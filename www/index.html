<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>타임슬립 한국사 · 한능검 심화 기출 — 챕터 목록</title>
<meta name="description" content="한국사능력검정시험(한능검) 심화 대비 게임. 선사부터 현대까지 36화를 걸어다니며, 기출 415문항을 이야기로 푼다.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gugi&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; word-break: keep-all; overflow-wrap: break-word; }
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; overscroll-behavior:none;
    background:#15110c; font-family: "Gowun Batang", -apple-system, "Malgun Gothic", serif; color:#f5ecd8; }

  /* 가로모드 고정: 이 게임은 항상 가로로만 플레이한다(세로모드 없음).
     게임 챕터들과 동일한 트릭 — 세로 뷰포트면 #wrap 전체를 90도 돌려서
     강제로 가로 화면처럼 쓴다. */
  #wrap { position: fixed; top: 0; left: 0; touch-action: pan-x pan-y; transform-origin: top left; overflow: hidden; }
  body.rot #wrap { transform: rotate(90deg) translateY(-100%); }

  /* 시대 아코디언 목록이라 페이지 전체는 세로로 스크롤한다(펼친 시대 안
     챕터 카드만 따로 가로 스크롤). */
  #scroller { width:100%; height:100%; overflow-x:hidden; overflow-y:auto; -webkit-overflow-scrolling:touch; }
  #app { min-height:100%; width:100%; padding: calc(14px + env(safe-area-inset-top)) calc(20px + env(safe-area-inset-right))
    calc(16px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left)); display:flex; flex-direction:column; }

  .topbar { display:flex; align-items:center; gap:10px; margin-bottom: 10px; flex: none; }
  /* 실제 붓글씨 로고 이미지(assets/title_logo.png) — 마젠타 배경을 지우고
     먹색 획을 금색으로 다시 칠한 것. 세로 공간이 빠듯해 높이로만 제어하고
     폭은 원본 비율(2.68:1)대로 따라가게 둔다. */
  h1 { margin: 0; line-height:0; flex:none; }
  h1 img { display:block; height:60px; width:auto; }

  .subtitle { margin:2px 0 0; font-size:12px; color:#b8a888; letter-spacing:.02em; }

  /* 스트릭(연속 학습) 알약 — 헤더에 항상 보이게. 오늘 아직 활동이 없어
     끊기기 직전이면(스트릭 0일 때는 표시 안 함) 살짝 다른 색으로 눈에
     띄게 한다. */
  /* 스트릭 알약이 숨겨져 있을 때(스트릭 0)도 메뉴 버튼이 항상 우측
     끝에 오도록, 둘을 한 그룹으로 묶고 그룹 자체에 margin-left:auto를
     준다 — 개별 요소에 각각 주면 알약이 display:none일 때 그 auto
     마진이 사라져서 메뉴 버튼이 화면 중간으로 끌려온다(실제 발생). */
  #topbar-actions { margin-left:auto; flex:none; align-self:flex-start; display:flex; align-items:center; gap:8px; }
  #streak-pill { flex:none; display:none;
    align-items:center; gap:5px; background:#241c12; border:1px solid #4a3512;
    border-radius:999px; padding:4px 10px 4px 6px; cursor:pointer; font-family:inherit; }
  #streak-pill.show { display:flex; }
  #streak-pill span { font-size:13px; font-weight:700; color:#f0d9a0; font-variant-numeric:tabular-nums; }
  #streak-pill.at-risk { border-color:#e0883a; background:#3a2410; animation:streak-pulse 1.8s ease-in-out infinite; }

  /* 봉수대(烽燧臺) 아이콘 — 제미나이로 뽑은 정지 그림(돌탑+불꽃) 위에
     은은한 불빛 깜빡임(glow)과 위로 떠오르는 불티(ember) 2개를 CSS로
     얹어서 자연스럽게 일렁이는 느낌을 준다. 그림 자체는 손대지 않고
     투명 레이어만 덧씌우는 방식이라 원본 그림 교체도 쉽다. */
  .beacon-icon { position:relative; display:inline-block; flex:none; }
  .beacon-icon img { display:block; width:100%; height:100%; object-fit:contain; }
  .beacon-glow { position:absolute; left:50%; top:6%; width:58%; height:42%; transform:translateX(-50%);
    background:radial-gradient(circle, rgba(255,205,110,.95), rgba(255,120,30,0) 72%);
    border-radius:50%; mix-blend-mode:screen; pointer-events:none;
    animation: beacon-flicker 1.7s ease-in-out infinite; }
  .beacon-ember { position:absolute; left:48%; top:14%; width:6%; height:6%; border-radius:50%;
    background:#ffcf7a; opacity:0; pointer-events:none; animation: beacon-rise 2.6s ease-in infinite; }
  .beacon-ember.e2 { left:58%; animation-delay:1.2s; animation-duration:3s; }
  @keyframes beacon-flicker {
    0%,100% { opacity:.55; transform:translateX(-50%) scale(.88); }
    30% { opacity:.9; transform:translateX(-53%) scale(1.05); }
    55% { opacity:.68; transform:translateX(-47%) scale(.95); }
    80% { opacity:1; transform:translateX(-50%) scale(1.12); }
  }
  @keyframes beacon-rise {
    0% { opacity:0; transform:translate(0,0) scale(1); }
    15% { opacity:.9; }
    75% { opacity:.35; }
    100% { opacity:0; transform:translate(-40%,-140%) scale(.4); }
  }
  #streak-pill .beacon-icon { width:19px; height:19px; }
  @keyframes streak-pulse { 0%,100%{ box-shadow:0 0 0 0 rgba(224,136,58,.35);} 50%{ box-shadow:0 0 0 5px rgba(224,136,58,0);} }

  /* 우측 상단 메뉴 버튼 — 동그라미 없이 가로줄 3개(햄버거 아이콘)만. */
  #menu-btn { flex:none; align-self:flex-start; width:30px; height:30px;
    border:none; background:none; padding:0; color:#f5ecd8; display:flex; align-items:center;
    justify-content:center; cursor:pointer; }
  #menu-btn svg { width:20px; height:20px; }

  /* 스트릭 모달 — 카드/테두리 없이 화면(=#wrap, 회전된 가로 화면) 전체를
     그대로 채우는 풀스크린 연출. 이 게임은 항상 가로로만 플레이하니까
     듀오링고의 세로 레이아웃(그림→숫자→요일 순서로 쌓기)을 그대로
     베끼지 않고, 가로 공간에 맞춰 왼쪽에 봉수대 그림·오른쪽에 숫자·
     통계·버튼을 나란히 두는 구성으로 바꿨다. */
  #streak-modal { position:absolute; inset:0; z-index:41; display:none;
    background:radial-gradient(ellipse at 30% 50%, #2c2010 0%, #150f09 70%); }
  #streak-modal.show { display:flex; }
  #streak-panel { flex:1; display:flex; align-items:center; justify-content:center;
    gap:6%; padding:4% 6%; text-align:left; }
  #streak-panel .beacon-icon.sk-flame { width:34%; max-width:220px; flex:none; aspect-ratio:574/548; }
  #streak-bubble { position:relative; background:#f5ecd8; color:#1b150e; font-family:"Gowun Batang",serif;
    font-size:13px; font-weight:700; padding:8px 14px; border-radius:14px; margin-bottom:14px; display:inline-block; }
  #streak-bubble::after { content:''; position:absolute; left:24px; bottom:-7px; width:0; height:0;
    border:8px solid transparent; border-top-color:#f5ecd8; border-bottom:0; }
  #streak-panel .sk-count { font-size:64px; line-height:1; font-weight:700; color:#f0d9a0;
    font-family:"Gugi","Gowun Batang",serif; text-shadow:0 4px 18px rgba(224,136,58,.35); }
  #streak-panel .sk-label { font-size:14px; color:#c9a24a; margin-top:4px; font-weight:700; }
  #streak-panel .sk-stats { display:flex; gap:22px; margin:18px 0; padding-top:14px; border-top:1px solid #3a2c1a; }
  #streak-panel .sk-stat b { display:block; font-size:18px; color:#f5ecd8; }
  #streak-panel .sk-stat span { font-size:11px; color:#8a7d68; }
  #streak-panel .sk-msg { font-size:13px; color:#d8ccb5; line-height:1.6; margin-bottom:16px; max-width:320px; }
  #streak-btnrow { display:flex; gap:10px; }
  #streak-freeze-btn { flex:1; background:#3a2410; border:1px solid #e0883a;
    color:#ffd29c; font-family:inherit; font-size:13px; font-weight:700; padding:12px 16px; border-radius:999px;
    cursor:pointer; }
  #streak-close-btn { flex:1; max-width:180px; background:#c9b8f0; border:none;
    color:#0c0f14; font-family:inherit; font-size:13px; font-weight:700; padding:12px 16px; border-radius:999px; cursor:pointer; }

  /* 메뉴 · 배지함 모달 — 왕조 계보 모달(#kings-modal)과 같은 뼈대를 쓴다. */
  #menu-modal, #badges-modal { position:absolute; inset:0; z-index:41; display:none;
    background:rgba(8,6,4,.72); align-items:center; justify-content:center; padding:18px; }
  #menu-modal.show, #badges-modal.show { display:flex; }
  #menu-panel { background:#1b150e; border:1px solid #4a3c26; border-radius:16px;
    width:100%; max-width:320px; padding:16px; }
  #menu-panel h3 { margin:0 0 12px; font-size:15px; color:#f0c96b; }
  #menu-panel button, #menu-panel a { display:block; width:100%; box-sizing:border-box; text-align:left;
    background:#2a2013; border:1px solid #4a3c26; color:#f5ecd8; font-family:inherit; font-size:13px;
    padding:11px 14px; border-radius:10px; margin-bottom:8px; cursor:pointer; text-decoration:none; }
  #menu-panel button:last-child, #menu-panel a:last-child { margin-bottom:0; }
  #badges-panel { background:#1b150e; border:1px solid #4a3c26; border-radius:16px;
    width:100%; height:100%; max-width:720px; display:flex; flex-direction:column; overflow:hidden; }
  #badges-panel .kp-head { flex:none; display:flex; align-items:baseline; justify-content:space-between;
    gap:10px; padding:14px 18px 10px; border-bottom:1px solid #3a2c1a; }
  #badges-panel .kp-head h2 { margin:0; font-size:17px; color:#f0c96b; }
  #badges-panel .kp-head .kp-sub { font-size:11px; color:#afa38f; }
  #badges-close { flex:none; background:#2a2013; border:1px solid #4a3c26; color:#f5ecd8;
    border-radius:999px; width:30px; height:30px; font-size:15px; cursor:pointer; line-height:1; }
  #badges-body { flex:1 1 auto; min-height:0; overflow-y:auto; padding:16px 18px 20px; }
  .badge-era { font-family:"Gowun Batang", serif; font-weight:700; font-size:13px; color:#e9c979;
    margin:18px 0 10px; }
  .badge-era:first-child { margin-top:0; }
  /* 배지 그리드 — 예전엔 항목마다 박스 테두리를 둘렀는데, 배지 자체가
     예쁜 그림이 되면 그 박스가 오히려 방해라 없앴다(사용자 지적). 카드가
     아니라 그냥 배지들이 늘어서 있는 진열장처럼 보이게, 아이콘을 크게
     키우고 이름·설명은 그 아래 가운데 정렬로만 붙인다. */
  .badge-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(110px, 1fr)); gap:14px; }
  .badge-item { display:flex; flex-direction:column; align-items:center; gap:4px; text-align:center; padding:6px 4px; }
  .badge-item .b-icon { width:44px; height:44px; opacity:.3; filter:grayscale(1); }
  .badge-item .b-icon img { display:block; width:100%; height:100%; object-fit:contain; }
  .badge-item .b-name { font-size:11.5px; color:#8a7d68; }
  .badge-item .b-desc { font-size:9.5px; color:#6a5c48; line-height:1.4; }
  .badge-item.got .b-icon { opacity:1; filter:none; }
  .badge-item.got .b-name { color:#f0d9a0; font-weight:700; }
  .badge-item.got .b-desc { color:#c9b896; }
  .badge-item.got { cursor:pointer; }
  .badge-item.got:active { transform:scale(.96); }

  /* 배지 확대 보기 — 손으로 쥐고 돌려보는 패, 운동 앱의 배지 회전 연출을
     이 게임 화풍(가로 화면·마패)에 맞게 가져왔다. perspective로 3D
     공간을 만들고, 드래그한 만큼 rotateX/rotateY를 주고 놓으면 스프링
     처럼 다시 정면으로 돌아온다. 광택은 코인과 같이 회전하는 대각선
     그라디언트라 기울일 때마다 원근으로 비스듬히 빛을 받는 것처럼
     보인다. */
  #badge-detail-modal { position:absolute; inset:0; z-index:45; display:none;
    background:rgba(6,4,2,.86); align-items:center; justify-content:center; padding:18px; }
  #badge-detail-modal.show { display:flex; }
  #badge-detail-close { position:absolute; top:18px; right:18px; background:#2a2013;
    border:1px solid #4a3c26; color:#f5ecd8; border-radius:999px; width:34px; height:34px;
    font-size:15px; cursor:pointer; z-index:1; }
  #badge-detail-panel { display:flex; flex-direction:column; align-items:center; gap:2px; max-width:300px; }
  #badge-detail-stage { width:190px; height:190px; perspective:750px; touch-action:none; margin-bottom:8px; }
  #badge-detail-coin { position:relative; width:100%; height:100%; transform-style:preserve-3d;
    cursor:grab; transition:transform .55s cubic-bezier(.22,1.4,.36,1); will-change:transform; }
  #badge-detail-coin.dragging { transition:none; cursor:grabbing; }
  #badge-detail-coin img { display:block; width:100%; height:100%; object-fit:contain;
    -webkit-user-drag:none; user-select:none; pointer-events:none;
    filter:drop-shadow(0 16px 20px rgba(0,0,0,.55)); }
  #badge-detail-shine { position:absolute; inset:0; border-radius:50%; pointer-events:none;
    background:linear-gradient(115deg, rgba(255,255,255,0) 30%, rgba(255,255,255,.55) 48%, rgba(255,255,255,0) 62%);
    mix-blend-mode:overlay; opacity:.85; }
  #badge-detail-coin.hint { animation:badgeHintTilt 1.8s ease-in-out 1; }
  @keyframes badgeHintTilt {
    0%, 100% { transform:rotateX(0) rotateY(0); }
    28% { transform:rotateX(-7deg) rotateY(16deg); }
    62% { transform:rotateX(5deg) rotateY(-13deg); }
  }
  #badge-detail-name { font-family:"Gowun Batang", serif; font-weight:700; font-size:16px; color:#f0d9a0; }
  #badge-detail-desc { font-size:12.5px; color:#c9b896; line-height:1.5; text-align:center; margin-top:4px; }
  #badge-detail-hint { font-size:10.5px; color:#8a7d68; margin-top:10px; letter-spacing:.02em; }

  /* 시대 아코디언 목록: 세로로 쌓인 시대 중 한 번에 하나만 펼쳐서, 펼친
     시대의 챕터 카드는 가로 한 줄로 크게 보여준다(디자인 가이드 레이아웃
     제안). #era-list가 세로 스크롤을 맡고, 왼쪽 가장자리를 따라 흐르는
     얇은 세로선 + 점이 예전 가로 타임라인의 '시간 순서' 느낌을 잇는다. */
  #era-list { flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden; padding-left: 22px; position: relative; }
  #era-list::before { content: ''; position: absolute; left: 5px; top: 8px; bottom: 8px; width: 2px; background: #3a2f1e; }
  .era-section { position: relative; border-bottom: 1px solid #241c12; }
  .era-section:last-child { border-bottom: none; }
  .era-dot { position: absolute; left: -22px; top: 20px; width: 12px; height: 12px; border-radius: 50%;
    background: #d9a441; border: 3px solid #15110c; box-shadow: 0 0 0 1px #3a2f1e; z-index: 1; }
  .era-header { display: flex; align-items: baseline; gap: 10px; padding: 14px 10px 14px 4px; }
  .era-title { font-size: 18px; font-weight: bold; color: #f0c96b; }
  .era-title.clk { cursor: pointer; border-bottom: 1px dotted #d9a441; padding-bottom: 1px; }
  .era-year { font-size: 11px; color: #afa38f; white-space: nowrap; }
  .era-pct { font-size: 11px; color: #c9a24a; white-space: nowrap; }

  /* 시대 마스코트 — 헤더 오른쪽 끝에 그 시대를 대표하는 인물이 처음부터
     컬러로 서 있다(애니메이션·잠금 없음, 정적 이미지 한 장). 캐릭터가
     커서(112px) 문서 흐름에 그대로 두면 그만큼 헤더가 높아져 아래
     진행선·카드가 밀려 내려간다 — position:absolute로 흐름에서 빼서
     시대 블록(.era-section) 위에 겹쳐 띄우고, z-index로 맨 앞에 오게
     해 진행선·카드를 밀어내지 않고 그 위를 덮게 한다. */
  .era-mascot { position: absolute; right: 10px; top: 4px; z-index: 2; height:112px;
    background-repeat:no-repeat; background-size: 100% 100%; background-position: 0 0;
    image-rendering:-webkit-optimize-contrast; }

  /* 기출문제 풀이 버튼 — 마스코트 왼쪽에 겹쳐 띄운다. 마스코트와 같은
     이유(가로 진행선을 밀어내지 않고 그 위를 덮게)로 position:absolute +
     z-index를 쓴다. 마스코트 폭이 시대마다 달라서(65~116px) right 오프셋을
     인라인 스타일로 개별 계산해 넣는다. 테두리·배경 없이 글씨만 — 실제
     가로 진행선(era-track-line)이 뒤로 그대로 지나간다. */
  .era-exam-btn { position: absolute; top: 4px; z-index: 3; width: 74px;
    cursor: pointer; text-decoration: none; display: block; text-align: center;
    font-family: "Gowun Batang", serif; text-shadow: 0 2px 6px rgba(0,0,0,.7); }
  .era-exam-btn .eb-icon { display: block; width: 18px; height: 18px; margin: 0 auto 2px; color: #d9a441;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,.6)); }
  .era-exam-btn .eb-title { display: block; font-size: 15px; font-weight: 700; color: #f0c96b; }
  .era-exam-btn .eb-sub { display: block; font-size: 11px; color: #f5ecd8; margin-top: 2px; }
  .era-exam-btn:active { transform: translateY(1px); }

  /* 시대 진행선 — 시작(금색 점) → 현재(최근 학습한 챕터, 빛나는 고리) →
     끝(빈 점). 카드 목록 위, 헤더 아래 가로선으로 "이 시대의 어디쯤"을
     보여준다. 최근 학습한 챕터가 없는 시대는 고리 없이 선만 보인다. */
  .era-track { position: relative; height: 16px; margin: 2px 10px 8px 4px; flex: none; }
  .era-track-line { position: absolute; left: 4px; right: 4px; top: 50%; height: 2px;
    background: #3a2f1e; transform: translateY(-50%); }
  .era-track-dot { position: absolute; top: 50%; width: 8px; height: 8px; border-radius: 50%;
    transform: translate(-50%,-50%); }
  .era-track-dot.start { left: 4px; background: #d9a441; }
  .era-track-dot.end { left: calc(100% - 4px); background: #15110c; border: 2px solid #4a3c26; }
  .era-track-dot.current { width: 15px; height: 15px; background: #1b150e; border: 3px solid #f0c96b;
    box-shadow: 0 0 10px 2px rgba(240,201,107,.65); }

  /* 펼친 시대의 챕터 카드 — 가로 한 줄, 큼직하게. 제목이 가장 크고,
     인물/키워드는 보조, 기출 비중은 맨 아래로 낮춰서 위계를 준다. */
  .era-cards-row { display: flex; gap: 14px; overflow-x: auto; padding: 14px 10px 18px 4px;
    margin-top: 42px; /* 우상단에 떠 있는 마스코트(112px)가 카드 위를 덮지 않게 여백 확보 */
    -webkit-overflow-scrolling: touch; scrollbar-width: none; -ms-overflow-style: none; }
  .era-cards-row::-webkit-scrollbar { display: none; }
  #era-list { scrollbar-width: none; -ms-overflow-style: none; }
  #era-list::-webkit-scrollbar { display: none; }
  .chapter-card { position: relative; flex: 0 0 auto; width: 176px; min-height: 176px; display: flex;
    flex-direction: column; gap: 7px; text-decoration: none; color: inherit; background: #241c12;
    background-size: cover; background-position: center; border: 1px solid #3a2f1e;
    border-radius: 16px; padding: 16px; box-shadow: 0 4px 16px rgba(0,0,0,.22);
    transition: border-color .15s, transform .1s; }
  .chapter-card:active { transform: scale(0.97); }
  /* 최근 학습한 챕터 — 말풍선 꼭지처럼 위에 삼각형을 달고 금색으로 빛나게
     해서 "이어서 할 곳"이 목록에서 바로 눈에 띄게 한다. */
  .chapter-card.recent { border-color: #f0c96b;
    box-shadow: 0 0 0 2px #f0c96b, 0 0 22px 5px rgba(240,201,107,.55), 0 4px 16px rgba(0,0,0,.22); }
  .chapter-card.recent::before { content: ''; position: absolute; top: -9px; left: 50%;
    transform: translateX(-50%); width: 0; height: 0;
    border-left: 8px solid transparent; border-right: 8px solid transparent; border-bottom: 9px solid #f0c96b; }
  /* 배경에 챕터 무대 그림을 깔고(아래 background-image 인라인), 그 위에
     글씨가 늘 읽히도록 어두운 그러데이션을 얹는다 — 위는 그림이 좀 더
     보이게 연하게, 아래(출제 비중 줄)로 갈수록 짙게. */
  .chapter-card .ccard-num { position:relative; font-size: 10.5px; color: #e9c979; font-weight: 600;
    letter-spacing: .02em; text-shadow: 0 1px 4px rgba(0,0,0,.85); }
  .chapter-card .ccard-title { position:relative; font-size: 16px; font-weight: bold; line-height: 1.35;
    color: #fff; text-shadow: 0 1px 5px rgba(0,0,0,.9); }
  .chapter-card .ccard-who { position:relative; font-size: 11.5px; color: #e5dcc8; line-height: 1.4;
    text-shadow: 0 1px 4px rgba(0,0,0,.85); }
  .chapter-card .ccard-pct { position:relative; margin-top: auto; font-size: 10.5px; color: #e0d4b8;
    padding-top: 4px; border-top: 1px solid rgba(255,255,255,.18); text-shadow: 0 1px 3px rgba(0,0,0,.85); }

  .plan-note { font-size: 11px; color:#afa38f; line-height:1.5; text-align:center; padding-top: 4px; flex:none; margin:6px 0 0; }
  /* 가로모드 폰처럼 화면이 낮을 땐 카드 영역을 최대한 확보하려고 안내문을 숨긴다.
     회전 트릭 때문에 CSS 미디어쿼리로는 실제 게임 화면 높이를 알 수 없어서
     JS가 body에 .short 클래스를 붙여준다. */
  body.short .plan-note { display:none; }

  /* 왕조 계보 모달 — 시대 제목을 누르면 그 시대 나라들의 왕 계보를 기출
     출제 횟수와 함께 보여준다. #wrap 안에 둬야 세로모드 회전 트릭을 그대로
     따라간다(미니맵과 같은 이유). */
  .era-title.clk { cursor:pointer; border-bottom:1px dotted #d9a441; padding-bottom:1px; }
  #kings-modal { position:absolute; inset:0; z-index:40; display:none;
    background:rgba(8,6,4,.72); align-items:center; justify-content:center; padding:18px; }
  #kings-modal.show { display:flex; }
  #kings-panel { background:#1b150e; border:1px solid #4a3c26; border-radius:16px;
    width:100%; height:100%; max-width:1040px; display:flex; flex-direction:column; overflow:hidden; }
  #kings-panel .kp-head { flex:none; display:flex; align-items:baseline; justify-content:space-between;
    gap:10px; padding:14px 18px 10px; border-bottom:1px solid #3a2c1a; }
  #kings-panel .kp-head h2 { margin:0; font-size:17px; color:#f0c96b; }
  #kings-panel .kp-head .kp-sub { font-size:11px; color:#afa38f; }
  #kings-close { flex:none; background:#2a2013; border:1px solid #4a3c26; color:#f5ecd8;
    border-radius:999px; width:30px; height:30px; font-size:15px; cursor:pointer; line-height:1; }
  #kings-body { flex:1 1 auto; min-height:0; overflow-y:auto; padding:14px 18px 20px; }
  /* 동명이인 점은 hover가 안 되는 손가락 터치로도 봐야 해서, title 툴팁 대신
     눌렀을 때 여기에 문구를 띄운다(회전 트릭 중엔 좌표 계산이 꼬이기 쉬워
     점 옆에 말풍선을 띄우는 대신 이 고정 배너로 대신한다). */
  #kp-tapinfo { display:none; flex:none; margin:0 18px; padding:8px 12px; font-size:11.5px; line-height:1.5;
    background:#332411; border:1px solid #d9a441; border-radius:8px; color:#f0d9a0; }
  #kp-tapinfo.show { display:block; }
  /* 메뉴에서 들어온 "전체 시대" 보기일 때만 쓰는 시대 구분 표제 —
     배지함의 .badge-era와 같은 톤(굵은 고운바탕체, 금색)으로 통일감을
     맞췄다. 시대 하나만 보는 기존 진입(챕터목록 시대 제목 클릭)에는
     안 붙는다. */
  .kp-era-head { font-family:"Gowun Batang", serif; font-weight:700; font-size:15px; color:#f0c96b;
    margin:22px 0 12px; padding-top:16px; border-top:1px solid #3a2c1a; }
  .kp-era-head:first-child { margin-top:0; padding-top:0; border-top:none; }
  .kp-country { margin-bottom:28px; }
  .kp-country .kp-cname { font-family:"Gowun Batang", serif; font-weight:700; font-size:13.5px; color:#e9c979; margin-bottom:6px; }
  .kp-country .kp-ccount { font-size:10.5px; color:#afa38f; margin-left:6px; font-weight:400; }
  /* 시대 하나를 볼 때, 나라가 달라도 같은 시기의 왕은 같은 가로 위치에
     오도록 실제 재위 연도로 자리를 계산한다(전엔 그냥 순서대로 나열해
     나라별로 스크롤 위치가 서로 어긋났다). 그러려면 나라별로 따로
     스크롤되면 안 되므로, 한 시대의 모든 나라 줄을 kp-hscroll 하나가
     함께 가로 스크롤한다(줄마다 스크롤이 있으면 다시 어긋난다). */
  .kp-hscroll { position:relative; overflow-x:auto; scrollbar-width: none; -ms-overflow-style: none; }
  .kp-hscroll::-webkit-scrollbar { display: none; }
  /* 100년 단위 눈금선 — 나라가 여럿(고대)일 때만, 실제 연도 축 감을
     주려고 긋는다. 글씨·왕 그림보다 항상 맨 뒤에 있어야 하므로 DOM상
     제일 먼저 두고 z-index도 가장 낮게(0) 준다. */
  .kp-century-line { position:absolute; top:0; bottom:0; width:0; border-left:1px dashed #3a2c1a; z-index:0; pointer-events:none; }
  .kp-century-label { position:absolute; top:2px; left:4px; font-size:9px; color:#5a4c38; white-space:nowrap; }
  .kp-strip { position:relative; height:156px; padding:8px 8px 10px; margin-top:30px; }
  /* margin-top: 초상화 있는 왕(.kp-has-p)이 발밑을 선에 맞추려고 블록을
     29px 위로 올리는데(왕관이 선에 안 걸리게), 그 여유 공간이 없으면
     바로 위 나라 이름 줄과 겹쳐서 글자가 잘렸다(고려·조선전기 등에서
     실제 발생) — 그만큼 위에 미리 여백을 깔아 둔다. */
  /* 예전엔 ::before로 줄 전체 폭(20px~right:20px)에 선을 그렸는데, 그러면
     나라가 일찍 멸망해도 선이 트랙 끝까지 이어져 마치 그 뒤로도 왕조가
     계속되는 것처럼 보였다. 이제 실제 엘리먼트로 그려서, 그 나라의
     마지막 왕(=멸망 시점) 자리에서 선이 끝나도록 폭을 JS에서 정한다. */
  .kp-line { position:absolute; left:20px; top:24px; height:2px; z-index:0;
    background: linear-gradient(90deg, transparent, #5a4a30 8%, #5a4a30 100%); }
  .kp-king { position:absolute; top:8px; width:108px; display:flex; flex-direction:column; align-items:center; padding:0 5px; z-index:1; }
  /* 초상화(54px 세로)는 원형 배지(40px)보다 커서, 배지 기준으로 맞춘
     가로 진행선(top:24px)이 원 안이 아니라 초상화 얼굴·왕관 높이를
     가로질러 버렸다(왕관이 잘려 보인다는 지적). 초상화가 있는 왕은
     발밑이 선에 닿도록 블록 전체를 위로 올린다. */
  .kp-king.kp-has-p { top:-29px; }
  .kp-king .kp-badge { position:relative; width:40px; height:40px; border-radius:50%; display:flex; align-items:center;
    justify-content:center; font-weight:700; font-size:11.5px;
    background:#2a2013; border:2px solid #4a3c26; color:#9c8d70; }
  /* 초상화가 있는 왕은 원 안에 욱여넣어 자르지 않는다 — 캐릭터 실루엣이
     그대로 보이게 자연스러운 비율의 <img>를 배지 없이 세워서 보여주고,
     기출 횟수(원래 배지 안 숫자)는 오른쪽 아래 작은 알약으로, 등급색은
     발밑 작은 점으로 옮긴다(얼굴이 이미지로 먼저 기억되게). */
  .kp-king .kp-badge.has-p { width:auto; height:54px; border-radius:0; background:none; border:none;
    display:block; }
  .kp-king .kp-badge.has-p img { display:block; height:54px; width:auto; max-width:84px; }
  .kp-king .kp-badge.has-p .kp-n { position:absolute; bottom:-4px; right:-6px; min-width:16px; height:16px;
    padding:0 3px; border-radius:9px; background:#1b150e; border:1.5px solid #4a3c26; color:#f0d9a0;
    font-size:9px; font-weight:700; display:flex; align-items:center; justify-content:center; z-index:1; }
  .kp-king .kp-badge.has-p .kp-tier-dot { position:absolute; bottom:-2px; left:0; width:9px; height:9px;
    border-radius:50%; border:1.5px solid #1b150e; }
  /* 이름·연도·업적 묶음. 같은 줄에서 왕들이 몰려 있으면(연도가 실제로
     가까움) 자리(가로 좌표)는 절대 옮기지 않고 — 다른 나라와 같은
     해가 늘 같은 세로줄에 오게 하기 위해서다 — 이 라벨만 아래로
     한 단 내려서(.kp-king.kp-stag) 글자가 서로 안 겹치게 한다. */
  .kp-king .kp-label { margin-top:7px; }
  .kp-king.kp-stag .kp-label { margin-top:49px; }
  .kp-king .kp-nm { font-size:12px; font-weight:500; text-align:center; white-space:nowrap; line-height:1.3; color:#f0e6d2; }
  .kp-king .kp-yr { font-size:10px; color:#a89878; margin-top:2px; font-variant-numeric: tabular-nums; }
  /* 업적 — 쉼표로 이어지는 한 줄 산문 대신, 항목별로 줄을 나눠 점으로
     찍어서 외우기 쉽게 스캔되도록 한다(왕 이름 아래, 이미지처럼 기억). */
  .kp-king .kp-achv-list { list-style:none; margin:4px auto 0; padding:0; font-size:9.5px; color:#c9b896;
    text-align:left; line-height:1.45; width:max-content; max-width:100px; }
  .kp-king .kp-achv-list li { white-space:normal; word-break:keep-all; }
  .kp-king .kp-achv-list li::before { content:'· '; color:#8a7c63; }
  /* background 축약형을 쓰면 안 된다 — has-p 뱃지의 background-image/size/cover를
     덮어써서(같은 시각적 우선순위·나중에 나오는 규칙이 이김) 초상화가 있어도
     이 색만 보이고 그림은 40x40 안 왼쪽 위 한 귀퉁이만 잘려 보이는 버그가 있었다.
     :not(.has-p)도 필수 — 안 붙이면 이 규칙이 나중에 나온다는 이유만으로
     has-p의 background:none을 다시 덮어써서 원 색 사각형이 이미지 뒤에 남는다. */
  .kp-king[data-t="0"] .kp-badge:not(.has-p){ background-color:#221a10; border-color:#3a2f1e; color:#6a5c48; }
  .kp-king[data-t="1"] .kp-badge:not(.has-p){ background-color:#3a2f1a; border-color:#8a744a; color:#dcc48f; }
  .kp-king[data-t="2"] .kp-badge:not(.has-p){ background-color:#4a3512; border-color:#d9a441; color:#f5d488; }
  .kp-king[data-t="3"] .kp-badge:not(.has-p){ background-color:#5a3411; border-color:#e0883a; color:#ffd29c; }
  .kp-king[data-t="4"] .kp-badge:not(.has-p){ background-color:#7a3512; border-color:#ff9a4a; color:#fff; box-shadow:0 0 9px rgba(255,144,64,.55); }
  /* has-p 뱃지는 원 대신 발밑 작은 점 하나로만 등급색을 표시한다. */
  .kp-king[data-t="0"] .kp-tier-dot{ background:#3a2f1e; }
  .kp-king[data-t="1"] .kp-tier-dot{ background:#8a744a; }
  .kp-king[data-t="2"] .kp-tier-dot{ background:#d9a441; }
  .kp-king[data-t="3"] .kp-tier-dot{ background:#e0883a; }
  .kp-king[data-t="4"] .kp-tier-dot{ background:#ff9a4a; box-shadow:0 0 6px rgba(255,144,64,.8); }
  .kp-dupdot{ position:absolute; top:-2px; right:-2px; width:12px; height:12px; border-radius:50%; font-size:7px;
    line-height:12px; text-align:center; font-weight:900; color:#1b150e; background:#7fb0a0; border:1.5px solid #1b150e; }
  .kp-legend{ display:flex; gap:12px; flex-wrap:wrap; font-size:10px; color:#afa38f; margin-bottom:10px; }
  .kp-legend i{ display:inline-block; width:8px; height:8px; border-radius:50%; border:2px solid #4a3c26; margin-right:3px; vertical-align:middle; }
</style>
</head>
<body>
<div id="wrap">
  <div id="scroller">
    <div id="app">
      <div class="topbar">
        <h1><img src="assets/title_logo.png" alt="타임슬립 한국사"></h1>
        <p class="subtitle">한능검 심화 기출</p>
        <div id="topbar-actions">
          <button id="streak-pill" aria-label="스트릭">
            <span class="beacon-icon">
              <img src="assets/icons/beacon_streak.png" alt="">
              <i class="beacon-glow"></i>
              <i class="beacon-ember e1"></i>
              <i class="beacon-ember e2"></i>
            </span>
            <span id="streak-pill-count">0</span>
          </button>
          <button id="menu-btn" aria-label="메뉴"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
        </div>
      </div>
      <div id="era-list"></div>
    </div>
  </div>
  <div id="streak-modal">
    <div id="streak-panel">
      <span class="beacon-icon sk-flame">
        <img src="assets/icons/beacon_streak.png" alt="">
        <i class="beacon-glow"></i>
        <i class="beacon-ember e1"></i>
        <i class="beacon-ember e2"></i>
      </span>
      <div>
        <div id="streak-bubble">봉화가 이어지고 있어요</div>
        <div class="sk-count" id="streak-count">0</div>
        <div class="sk-label">일 연속 학습</div>
        <div class="sk-stats">
          <div class="sk-stat"><b id="streak-longest">0</b><span>최장 기록</span></div>
          <div class="sk-stat"><b id="streak-freezes">0</b><span>스트릭 프리즈</span></div>
        </div>
        <p class="sk-msg" id="streak-msg"></p>
        <div id="streak-btnrow">
          <button id="streak-freeze-btn" style="display:none">광고 보고 프리즈 받기</button>
          <button id="streak-close-btn">닫기</button>
        </div>
      </div>
    </div>
  </div>
  <div id="menu-modal">
    <div id="menu-panel">
      <h3>메뉴</h3>
      <button id="menu-srs">오답 복습</button>
      <button id="menu-kings-open">왕조 계보 보기</button>
      <button id="menu-badges-open"><svg viewBox="0 0 24 24" width="1em" height="1em" style="vertical-align:-0.125em" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3l4 6 4-6"/><circle cx="12" cy="15" r="6"/><circle cx="12" cy="15" r="2.5"/></svg> 배지함 보기</button>
      <button id="menu-reset">진행 기록 초기화</button>
      <button id="bgm-mute-toggle"><svg viewBox="0 0 24 24" width="1em" height="1em" style="vertical-align:-0.125em" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><polygon points="4,10 8,10 12,6 12,18 8,14 4,14" stroke-linejoin="round"/><path d="M16 9c1.2 1 1.2 5 0 6"/><path d="M18.5 6.5c2.5 2.5 2.5 8.5 0 11"/></svg> 배경음악 끄기</button>
      <button id="menu-close-btn">닫기</button>
    </div>
  </div>
  <div id="badges-modal">
    <div id="badges-panel">
      <div class="kp-head">
        <div><h2>배지함</h2><span class="kp-sub" id="badges-sub"></span></div>
        <button id="badges-close" aria-label="닫기"><svg viewBox="0 0 24 24" width="1em" height="1em" style="vertical-align:-0.125em" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="5" x2="19" y2="19"/><line x1="19" y1="5" x2="5" y2="19"/></svg></button>
      </div>
      <div id="badges-body"></div>
    </div>

/* 가로모드 고정 (게임 챕터들과 동일 로직) */
const wrapEl = document.getElementById('wrap');
function getViewportSize(){
  const vv = window.visualViewport;
  // 핀치줌이 걸리면 vv.width/height가 확대 배율만큼 줄어든다. 그 값을 그대로 쓰면
  // #wrap이 축소되면서 화면이 "확대된 채로" 굳어 되돌릴 수 없었다(실제 발생).
  // 줌이 걸린 동안은 레이아웃 뷰포트를 써서 레이아웃이 줌을 따라가지 않게 한다.
  if (vv && (vv.scale || 1) <= 1.01) return { w: vv.width, h: vv.height };
  return { w: window.innerWidth, h: window.innerHeight };
}

/* ============ 확대(핀치줌·더블탭줌) 차단 ============
   iOS Safari는 접근성 정책상 viewport meta의 user-scalable=no를 무시하므로
   JS로 직접 막는다. 위 getViewportSize의 폴백과 2중 방어. */
['gesturestart','gesturechange','gestureend'].forEach(function(ev){
  document.addEventListener(ev, function(e){ e.preventDefault(); }, { passive: false });
});
document.addEventListener('touchmove', function(e){
  if (e.touches.length > 1) e.preventDefault();          // 두 손가락 = 핀치
}, { passive: false });
var __lastTouchEnd = 0;
document.addEventListener('touchend', function(e){
  var now = Date.now();
  if (now - __lastTouchEnd <= 300) e.preventDefault();   // 더블탭 줌
  __lastTouchEnd = now;
}, { passive: false });
function applyOrientation(){
  const { w: iw, h: ih } = getViewportSize();
  const portrait = ih > iw;
  document.body.classList.toggle('rot', portrait);
  const w = portrait ? ih : iw;
  const h = portrait ? iw : ih;
  wrapEl.style.width = w + 'px';
  wrapEl.style.height = h + 'px';
  document.body.classList.toggle('short', h < 430);
}
window.addEventListener('resize', applyOrientation);
window.addEventListener('orientationchange', () => setTimeout(applyOrientation, 80));
if (window.visualViewport){
  window.visualViewport.addEventListener('resize', applyOrientation);
  window.visualViewport.addEventListener('scroll', applyOrientation);
}
setTimeout(applyOrientation, 300);
setTimeout(applyOrientation, 800);
applyOrientation();

const KINGS_NAME_GROUPS = {};

function kingsTier(n){ return n === 0 ? 0 : n <= 3 ? 1 : n <= 8 ? 2 : n <= 15 ? 3 : 4; }
function kingsJosa(word, withB, noB){
  const code = word.charCodeAt(word.length - 1) - 0xAC00;
  if (code < 0 || code > 11171) return word + noB;
  return word + (code % 28 ? withB : noB);
}
function kingsDupOthers(name, era, country, year){
  const group = KINGS_NAME_GROUPS[name];
  if (!group || group.length < 2) return null;
  const others = group.filter(o => !(o.era === era && o.country === country && o.year === year));
  return others.length ? others : null;
}

  const others = kingsDupOthers(name, era, country, year);

/* 업적 문자열("왕자의 난, 사병 혁파, 호패법")을 쉼표로 나눠 항목별 줄로.
   쉼표는 항목 구분자, 가운뎃점(·)은 한 항목 안에서 쓰는 구분자라 그대로 둔다
   (예: "국호 신라·왕 칭호 확정, 우산국 정벌" → 2항목, 첫 항목 안엔 · 유지). */
function kingsAchvList(a){
  // 쉼표뿐 아니라 여는 괄호 앞에서도 끊는다 — "정동행성 설치(원 간섭
  // 시작)"처럼 쉼표 없이 긴 항목 하나로 이어지면 줄바꿈이 안 돼 옆으로
  // 길게 삐져나오던 문제.
  return a.split(/,|(?=\()/).map(s => s.trim()).filter(Boolean)
    .map(s => `<li>${s}</li>`).join('');
}
/* 왕 연도 문자열 → 숫자(정렬·가로 위치 계산용). "BC194"·"~BC108" 같은
   기원전 표기는 음수로, 건국 설화처럼 연도가 없는 항목은 관례적으로
   쓰이는 대략의 해를 대신 쓴다(표시 위치를 잡기 위한 것일 뿐, 그 해가
   확정된 사실이라는 뜻은 아니다). */
function kingsYearNum(y){
  if (y === '(건국)') return -2333;       // 단군신화 속 고조선 건국 연대
  if (y === '(대가야 시조)') return 42;    // 같은 가야권 김수로왕과 비슷한 시기
  const m = y.match(/~?\s*(BC)?\s*(\d+)/);
  if (!m) return 0;
  const n = parseInt(m[2], 10);
  return m[1] ? -n : n;
}
/* 시대 하나의 나라별 가로 타임라인(kp-hscroll) html만 만들어 돌려준다.
   openKingsModal이 시대 하나만 볼 때도, 메뉴에서 들어와 전체 시대를
   이어붙여 볼 때도 이 함수 하나를 반복 호출해서 쓴다(중복 제거). */
function kingsEraSectionHTML(era){
  const groups = KINGS_BY_ERA[era];
  if (!groups) return '';
  // 이 시대 전체(모든 나라 통틀어)의 연도 범위로 가로 축척을 하나 정해서
  // 나라가 달라도 같은 해가 같은 x좌표에 오게 한다.
  const allYears = [];
  groups.forEach(([, kings]) => kings.forEach(k => allYears.push(kingsYearNum(k.year))));
  const minY = Math.min.apply(null, allYears), maxY = Math.max.apply(null, allYears);
  const span = Math.max(1, maxY - minY);
  const singleRow = groups.length === 1;
  const pxPerYear = Math.max(3.5, 900 / span);
  let trackW = 640;
  let centuryLines = [];

  let rows;
  if (singleRow){
    // 나라가 하나뿐이면 다른 나라와 맞출 일이 없다. 연도差 그대로 쓰면
    // (예: 단군왕검~위만처럼 왕 수는 적은데 연도差는 수천 년) 화면 밖으로
    // 한참 밀려나므로, 그냥 일정 간격으로 고르게 배치한다(실제 연도
    // 간격은 라벨로 알 수 있다).
    rows = groups.map(([country, kings]) => {
      const positioned = kings.map((k, i) => ({ k, x: 40 + i * 140 }));
      const rowEndX = positioned.length ? positioned[positioned.length - 1].x : 40;
      trackW = Math.max(trackW, rowEndX + 80);
      return { country, kings, positioned, rowEndX };
    });
  } else {
    // 나라가 여럿이면(지금은 고대만) "같은 해는 나라가 달라도 같은
    // x좌표"를 절대 깨지 않으면서, 그러면서도 배지·라벨(폭 108px)이
    // 서로 절대 안 겹치게 해야 한다 — 둘 다 지키려면 연도축을 균일하게
    // 늘리는 게 아니라, 실제로 왕이 몰려서 비좁은 구간만 "국지적으로"
    // 넓혀야 한다(그래야 전체 폭이 쓸데없이 안 커진다). 그래서 모든
    // 나라를 통틀어 등장하는 연도를 하나로 모아 오름차순으로 훑으면서,
    // 어떤 나라든 그 앞 왕과의 간격이 MIN_GAP보다 좁아지면 이 연도(=
    // 모든 나라가 공유하는 좌표)를 통째로 뒤로 밀고, 그 뒤로 나오는
    // 모든 연도도 최소한 그만큼은 밀려나게(floor) 이어 붙인다.
    const MIN_GAP = 115;
    // 같은 나라 안에서 완전히 같은 해가 연달아 나오면(가야: 김수로왕·
    // 이진아시왕 둘 다 42년) 정렬 키가 겹쳐 계산이 안 되므로, 그럴 때만
    // 아주 작은 값을 더해 순서만 구분한다(화면에 보이는 "연도" 텍스트는
    // 원래 표기 그대로 — 이 값은 배치 계산에만 쓴다).
    const rowKeySeqs = groups.map(([, kings]) => {
      let lastKey = null;
      return kings.map(k => {
        let key = kingsYearNum(k.year);
        if (lastKey !== null && key <= lastKey) key = lastKey + 1e-6;
        lastKey = key;
        return key;
      });
    });
    const rowPrevOf = new Map();
    rowKeySeqs.forEach(seq => {
      seq.forEach((key, i) => {
        const prevKey = i > 0 ? seq[i - 1] : null;
        if (!rowPrevOf.has(key)) rowPrevOf.set(key, []);
        rowPrevOf.get(key).push(prevKey);
      });
    });
    // 100년 단위 점선 세로선 자리도 같은 sweep에 슬쩍 끼워 넣는다 — 실제
    // 왕이 없는 "빈 연도"라 아무것도 밀지는(prevKey 없음) 않지만, 그
    // 지점까지 쌓인 국지적 확장(extraOffset)은 그대로 반영되어 실제
    // 연도 위치에 맞게 그어진다.
    const centuryYears = [];
    for (let y = Math.ceil(minY / 100) * 100; y <= maxY; y += 100){
      if (!rowPrevOf.has(y)) rowPrevOf.set(y, []);
      centuryYears.push(y);
    }
    // 연도가 다르면 x좌표도 반드시 달라야 한다 — 아래 min0(=floor)를 그냥
    // "이전 값보다 작아지지만 않게 눌러 붙이기"로 짰더니, 어딘가 한 번
    // 크게 밀린 뒤에는 그 다음 몇 개 연도가 전부 "눌린 값"에 나란히
    // 뭉쳐버리는 버그가 있었다(서로 수십 년 차이 나는 왕들이 같은
    // x에 겹쳐 찍힘). 대신 "밀린 만큼"을 누적 오프셋으로 들고 다니면서
    // 그 뒤로 나오는 모든 연도의 기준선(baseline) 자체를 같이 밀어준다
    // — 그러면 한 번 밀린 뒤에도 서로 다른 연도는 항상 서로 다른(그리고
    // 실제 연도差에 비례하는) x를 갖는다.
    const sortedKeys = Array.from(rowPrevOf.keys()).sort((a, b) => a - b);
    const xOf = new Map();
    let extraOffset = 0;
    sortedKeys.forEach(key => {
      const baseline = 40 + (key - minY) * pxPerYear + extraOffset;
      let req = baseline;
      rowPrevOf.get(key).forEach(prevKey => {
        if (prevKey !== null) req = Math.max(req, xOf.get(prevKey) + MIN_GAP);
      });
      if (req > baseline) extraOffset += (req - baseline);
      xOf.set(key, req);
    });

    rows = groups.map(([country, kings], ri) => {
      const positioned = kings.map((k, i) => ({ k, x: xOf.get(rowKeySeqs[ri][i]) }));
      const rowEndX = positioned.length ? positioned[positioned.length - 1].x : 40;
      trackW = Math.max(trackW, rowEndX + 80);
      return { country, kings, positioned, rowEndX };
    });
    centuryLines = centuryYears.map(y => ({ year: y, x: xOf.get(y) }));
  }

  const centuryHtml = centuryLines.map(({ year, x }) =>
    `<div class="kp-century-line" style="left:${x}px"><span class="kp-century-label">${year}년</span></div>`
  ).join('');

  return `<div class="kp-hscroll">` + centuryHtml + rows.map(({ country, kings, positioned, rowEndX }) => {
    const total = kings.reduce((s, k) => s + k.n, 0);
    // 이 나라의 마지막 왕(=멸망 또는 이 왕조 목록의 끝) 자리에서 선이

    const lineW = Math.max(0, rowEndX - 20);
    return `<div class="kp-country"><span class="kp-cname">${country}<span class="kp-ccount">· 왕 ${kings.length}명 · 출제 합계 ${total}회</span></span>
      <div class="kp-strip" style="width:${trackW}px">
        <div class="kp-line" style="width:${lineW}px"></div>` + positioned.map(({ k, x, stagger }) => `
        <div class="kp-king${stagger ? ' kp-stag' : ''}${k.p ? ' kp-has-p' : ''}" data-t="${kingsTier(k.n)}" style="left:${x}px">
          <div class="kp-badge${k.p ? ' has-p' : ''}">${k.p ? `<img src="assets/portraits/${k.p}.png" alt=""><span class="kp-tier-dot"></span><span class="kp-n">${k.n}</span>` : k.n}${kingsDupDot(k.name, era, country, k.year)}</div>
          <div class="kp-label">
            <div class="kp-nm">${k.name}</div>
            <div class="kp-yr">${k.year}</div>
            ${(k.a && k.n > 0) ? `<ul class="kp-achv-list">${kingsAchvList(k.a)}</ul>` : ''}
          </div>
        </div>`).join('') + `</div></div>`;
  }).join('') + `</div>`;
}

/* era를 주면 그 시대 하나만, 안 주면(메뉴 "왕조 계보 보기") 왕이 있는
   모든 시대를 이어 붙여서 보여준다. */
function openKingsModal(era){
  const eras = era ? [era] : Object.keys(KINGS_BY_ERA);
  const body = document.getElementById('kings-body');
  if (era){
    const groups = KINGS_BY_ERA[era];
    if (!groups) return;
    document.getElementById('kp-title').textContent = era + ' 왕 계보';
    const totalKings = groups.reduce((s, [,ks]) => s + ks.length, 0);
    document.getElementById('kp-sub').textContent = `${groups.map(g => g[0]).join(' · ')} · 왕 ${totalKings}명 · 원 안 숫자 = 기출 출제 횟수`;
  } else {
    const totalKings = eras.reduce((s, e) => s + KINGS_BY_ERA[e].reduce((s2, [,ks]) => s2 + ks.length, 0), 0);
    document.getElementById('kp-title').textContent = '왕조 계보';
    document.getElementById('kp-sub').textContent = `${eras.length}개 시대 · 왕 ${totalKings}명 · 원 안 숫자 = 기출 출제 횟수`;
  }
  let html = `<div class="kp-legend">
    <span><i style="background:#221a10; border-color:#3a2f1e"></i>0회</span><span><i style="background:#3a2f1a; border-color:#8a744a"></i>1~3회</span>
    <span><i style="background:#4a3512; border-color:#d9a441"></i>4~8회</span><span><i style="background:#5a3411; border-color:#e0883a"></i>9~15회</span>
    <span><i style="background:#7a3512; border-color:#ff9a4a"></i>16회+</span>
    <span><span class="kp-dupdot" style="position:static; display:inline-flex; align-items:center; justify-content:center;">동</span> 다른 시대·나라에 같은 이름의 왕이 또 있음</span>
  </div>`;
  html += eras.map(e => (era ? '' : `<div class="kp-era-head">${e}</div>`) + kingsEraSectionHTML(e)).join('');

  body.innerHTML = html;
  document.getElementById('kp-tapinfo').classList.remove('show');
  document.getElementById('kings-modal').classList.add('show');
}
function closeKingsModal(){

// 최근 학습한 챕터 — 각 챕터가 열릴 때 자기 파일명을 기억해 둔 것을 읽어
// 온다. 있으면 그 챕터가 있는 시대를 기본으로 펼치고, 카드에 빛나는
// 표시를 단다("이어서 하기"를 한눈에 찾게).

// 제안). 기본으로는 최근 학습한 챕터가 있는 시대를, 없으면 첫 시대
// (선사·초기국가)를 펼쳐 둔다.
function renderEraList(){
  eraListEl.innerHTML = '';
  ERAS.forEach((e, eraIdx) => {
    const section = document.createElement('div');
    section.className = 'era-section';

    const hasKings = !!KINGS_BY_ERA[e.title];
    const pctLine = e.pct ? `<span class="era-pct">기출 ${e.pct}</span>` : '';
    const mascotW = e.mascot ? (e.mascotW || 112) : 0;
    // 마스코트는 세로 모드에서 옆으로 90도 누워 보이는데(#wrap 회전 트릭),
    // 그림마다 원래 폭(mascotW, 65~116px)이 달라 예전처럼 오른쪽 끝을
    // 다들 10px로 고정해 버리면 그 폭 차이가 화면 회전 후 "세로 중심선이
    // 안 맞는" 것으로 보였다(실제 사용자 지적). 가장 넓은 마스코트
    // (단군왕검 116px) 기준으로 폭이 좁을수록 더 안쪽으로 밀어 넣어,
    // 모든 마스코트의 가로 중심이 한 지점(오른쪽에서 68px)에 오게 한다.
    const MASCOT_MAX_W = 116;

    const mascotHtml = e.mascot ? `<div class="era-mascot"

    const examBtnRight = mascotRight + mascotW + 14;
    const examBtnHtml = `<a class="era-exam-btn" href="exam_practice.html?era=${eraIdx}"

        <svg class="eb-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 5a2 2 0 100 4h12a2 2 0 100-4z"/><path d="M6 19a2 2 0 100-4h12a2 2 0 100 4z"/><path d="M6 7v10M18 9v6"/><line x1="9" y1="9" x2="15" y2="9"/><line x1="9" y1="13" x2="15" y2="13"/></svg>
        <span class="eb-title">기출변형</span><span class="eb-sub">풀어보기</span>

      <div class="era-dot"></div>
      <div class="era-header">

        <span class="era-year">${e.year}</span>
        ${pctLine}
        ${examBtnHtml}
        ${mascotHtml}
      </div>`;
    if (e.cards){
      const recentIdx = e.cards.findIndex(c => c.href === lastChapterHref);

      // 가로선 + 시작/현재/끝 점 — 현재 점은 최근 학습한 챕터가 이 시대
      // 안에서 몇 번째인지(0~100%)에 맞춰 둔다. 최근 챕터가 없는 시대는
      // 밋밋한 선(시작·끝 점만)만 보여준다.
      const track = document.createElement('div');
      track.className = 'era-track';
      const pct = (recentIdx >= 0 && e.cards.length > 1) ? (recentIdx / (e.cards.length - 1) * 100) : null;
      track.innerHTML = `<div class="era-track-line"></div>
        <div class="era-track-dot start"></div>
        ${pct !== null ? `<div class="era-track-dot current" style="left:${pct}%"></div>` : ''}
        <div class="era-track-dot end"></div>`;
      section.appendChild(track);

      const cardsRow = document.createElement('div');
      cardsRow.className = 'era-cards-row';
      cardsRow.innerHTML = e.cards.map((c, i) =>
        `<a class="chapter-card${i === recentIdx ? ' recent' : ''}" href="${c.href}"${c.bg ? ` style="background-image:linear-gradient(180deg, rgba(20,15,10,.32) 0%, rgba(20,15,10,.58) 45%, rgba(15,11,7,.92) 100%), url('${c.bg}')"` : ''}>

    const titleEl = section.querySelector('.era-title');
    if (hasKings){
      titleEl.addEventListener('click', (ev) => { ev.stopPropagation(); openKingsModal(e.title); });
    }
    eraListEl.appendChild(section);
  });
}

function chapterBadgeId(href){ return 'ch_complete_' + href; }
/* 시대 완주 배지 아이콘 — 그 시대 마스코트를 마패 메달에 새긴 그림으로,
   ERAS의 title과 1:1로 매칭된다(순서는 무관, 제목 문자열로 찾는다). */
const ERA_BADGE_ICON = {
  '선사·초기국가': 'assets/icons/badge_dangun.png',
  '고대': 'assets/icons/badge_gwanggaeto.png',
  '고려': 'assets/icons/badge_taejo.png',
  '조선 전기': 'assets/icons/badge_sejong.png',
  '조선 후기': 'assets/icons/badge_yisunsin.png',
  '근대·개항기': 'assets/icons/badge_jeonbongjun.png',
  '일제강점기': 'assets/icons/badge_yugwansun.png',
  '현대': 'assets/icons/badge_hanbando.png',
  '시대 통합': 'assets/icons/badge_seollal.png',
};
function renderBadges(){
  let earned = (window.Badges ? Badges.load() : {});
  // 전체 36화가 다 완주됐는데 아직 완주 배지를 못 받았다면 지금 준다
  // (챕터 파일 하나하나를 손대지 않고 여기서만 검사해도 충분하다).
  if (window.Badges && !Badges.has('all_chapters')){
    const allIds = [];
    ERAS.forEach(era => era.cards.forEach(c => allIds.push(chapterBadgeId(c.href))));
    if (allIds.length && allIds.every(id => earned[id])){
      Badges.earn('all_chapters');
      earned = Badges.load();
    }
  }
  let totalCount = 0;
  let html = '';
  ERAS.forEach(era => {
    const icon = ERA_BADGE_ICON[era.title] || 'assets/icons/badge_mapae.png';
    html += `<div class="badge-era">${era.title}</div><div class="badge-grid">`;
    era.cards.forEach(c => {
      const got = !!earned[chapterBadgeId(c.href)];
      totalCount++;
      html += `<div class="badge-item${got ? ' got' : ''}">
        <div class="b-icon"><img src="${icon}" alt=""></div>
        <div class="b-name">${got ? c.num + ' ' + c.name : '???'}</div>
        <div class="b-desc">${got ? '완주' : '이 화를 끝까지 마치면 열립니다'}</div>
      </div>`;
    });
    html += '</div>';
  });
  // "그 외" 특별 배지는 챕터처럼 정해진 목록을 미리 보여줄 게 아니라
  // 다양한 방식으로 우연히 얻는 것들이라, 얻기 전엔 아예 안 보여주고
  // 얻은 것만 하나씩 진열장에 늘어놓는다("???" 자리 채우기 식이 아님).
  const gotSpecials = Object.keys(BADGE_DEFS).filter(id => !!earned[id]);
  totalCount += Object.keys(BADGE_DEFS).length;
  if (gotSpecials.length){
    html += `<div class="badge-era">그 외</div><div class="badge-grid">`;
    gotSpecials.forEach(id => {
      const def = BADGE_DEFS[id];
      html += `<div class="badge-item got">
        <div class="b-icon"><img src="${def.icon || 'assets/icons/badge_mapae.png'}" alt=""></div>
        <div class="b-name">${def.name}</div>
        <div class="b-desc">${def.desc}</div>
      </div>`;
    });
    html += '</div>';
  }
  document.getElementById('badges-body').innerHTML = html;
  document.getElementById('badges-sub').textContent = `${Object.keys(earned).length} / ${totalCount}개 획득`;
}

(function(){
  const coin = document.getElementById('badge-detail-coin');
  let dragging = false, sx0 = 0, sy0 = 0, rx = 0, ry = 0;
  function setTilt(nrx, nry){
    rx = nrx; ry = nry;
    coin.style.transform = `rotateX(${rx}deg) rotateY(${ry}deg)`;
  }
  coin.addEventListener('pointerdown', (ev) => {
    dragging = true;
    coin.classList.remove('hint');
    coin.classList.add('dragging');
    sx0 = ev.clientX; sy0 = ev.clientY;
    coin.setPointerCapture(ev.pointerId);
  });
  coin.addEventListener('pointermove', (ev) => {
    if (!dragging) return;
    const dx = ev.clientX - sx0, dy = ev.clientY - sy0;
    setTilt(Math.max(-22, Math.min(22, -dy / 4)), Math.max(-28, Math.min(28, dx / 4)));
    ev.preventDefault();
  });
  function release(){
    if (!dragging) return;
    dragging = false;
    coin.classList.remove('dragging');
    setTilt(0, 0);
  }
  coin.addEventListener('pointerup', release);
  coin.addEventListener('pointercancel', release);
})();

      var b = document.createElement('button');
      b.id = id; b.type = 'button'; b.className = 'daily-pill';
      b.textContent = label; b.onclick = fn;
      host.appendChild(b); return b;
    }
    var st = document.createElement('style');
    st.textContent = '.daily-pill{height:34px;padding:0 13px;border-radius:17px;' +
      'background:rgba(26,20,12,.82);border:1px solid #4a3c26;color:#f0c96b;' +
      'font-family:"Gowun Batang",serif;font-size:13px;cursor:pointer;position:relative}' +
      '.daily-pill.hot::after{content:"";position:absolute;top:5px;right:6px;width:7px;' +
      'height:7px;border-radius:50%;background:#e8836e}';
    document.head.appendChild(st);
    var a = mk('daily-att', '출석', function(){ Daily.openAttendance(); });
    if (window.Quests) mk('daily-quest', '할 일', function(){ Quests.open(); });
    if (window.Mini) mk('daily-mini', '미니게임', function(){ Mini.open(); });
    if (window.Unlock) mk('daily-unlock', '계급', function(){ Unlock.open(); });
    var b = mk('daily-box', '상자', function(){ Daily.openBox(); });
    function paint(){
      a.classList.toggle('hot', !Daily.claimedToday());
      b.classList.toggle('hot', Daily.boxLeft() > 0);
      var q = document.getElementById('daily-quest');
      if (q && window.Quests) q.classList.toggle('hot', Quests.pending());
    }
    paint();
    setInterval(paint, 3000);
  })();

  /* 로그인 단추는 상단 액션 줄에 붙인다. 설정이 없으면 Auth.attach가
     아무것도 만들지 않으므로, 여기서 조건을 또 볼 필요가 없다. */
  (function(){
    var host = document.getElementById('topbar-actions');
    if (window.Auth && host) Auth.attach(host);

    /* 랭킹 단추. 로그인 안 해도 남들 점수는 볼 수 있게 열어 둔다 —
       올리는 것만 로그인이 필요하다. */
    if (window.Board && host && !document.getElementById('board-btn')){
      var b = document.createElement('button');
      b.id = 'board-btn';
      b.setAttribute('aria-label', '랭킹');
      b.textContent = '급제';
      b.onclick = function(){ Board.open(); };
      host.insertBefore(b, host.firstChild);
    }
  })();
</script>
