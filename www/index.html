<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>한국사 게임 — 챕터 목록</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; overscroll-behavior:none;
    background:#15110c; font-family: -apple-system, "Pretendard", "Malgun Gothic", sans-serif; color:#f5ecd8; }

  /* 가로모드 고정: 이 게임은 항상 가로로만 플레이한다(세로모드 없음).
     게임 챕터들과 동일한 트릭 — 세로 뷰포트면 #wrap 전체를 90도 돌려서
     강제로 가로 화면처럼 쓴다. */
  #wrap { position: fixed; top: 0; left: 0; touch-action: pan-x pan-y; transform-origin: top left; overflow: hidden; }
  body.rot #wrap { transform: rotate(90deg) translateY(-100%); }

  /* 가로(시대 이동)로만 페이지 전체가 스크롤되고, 세로는 페이지 단위가 아니라
     카드가 넘치는 시대의 .cards 안에서만(그 시대 칸만) 스크롤되게 한다. */
  #scroller { width:100%; height:100%; overflow-x:auto; overflow-y:hidden; -webkit-overflow-scrolling:touch; }
  #app { height:100%; width:max-content; min-width:100%; padding: calc(14px + env(safe-area-inset-top)) calc(20px + env(safe-area-inset-right))
    calc(16px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left)); display:flex; flex-direction:column; }

  .topbar { display:flex; align-items:baseline; gap:10px; margin-bottom: 10px; flex: none; }
  h1 { font-size: 17px; margin: 0; color:#f0c96b; white-space:nowrap; }

  /* 타임라인: 왼쪽(과거)→오른쪽(현재) 시간순으로 시대를 가로로 배열.
     #timeline이 세로로도 남은 공간을 다 차지해야 .timeline-line(가운데쯤)과
     .cards(아래쪽, 넘치면 그 칸만 스크롤)가 제대로 자리잡는다. */
  #timeline { position: relative; flex: 1 1 auto; min-height: 0; }
  /* 선 위치(--line-y)는 화면 높이에 따라 JS가 정해준다 — 고정값으로 두면
     낮은 화면(가로모드 폰)에서 카드 영역이 지나치게 눌린다. */
  .timeline-line { position: absolute; top: var(--line-y, 32px); left: 0; right: 0; height: 2px;
    background: #6a5636; z-index: 0; }
  .eras-row { display:flex; align-items:stretch; gap: 26px; position:relative; z-index:1; height:100%; }
  .era-col { flex: 0 0 auto; width: 216px; display:flex; flex-direction:column; }
  .era-marker-wrap { display:flex; flex-direction:column; align-items:center; margin-bottom:10px; flex:none; }
  .era-dot { width:13px; height:13px; border-radius:50%; background:#d9a441; border:3px solid #15110c;
    box-shadow: 0 0 0 1px #6a5636; margin-top: calc(var(--line-y, 32px) - 6px); }
  .era-dot.plan { background:#5a4c36; }
  .era-year { font-size:10px; opacity:.55; margin-top:6px; white-space:nowrap; }

  .era-head { text-align:center; margin-bottom: 10px; flex:none; }
  .era-title { font-size: 15px; font-weight: bold; display:block; }
  .era-badge { display:inline-block; font-size: 10px; padding: 2px 8px; border-radius: 999px; margin-top:4px; }
  .badge-live { background:#2f5d3a; color:#c9f0d0; }
  .badge-partial { background:#4a4020; color:#f0dca0; }
  .badge-plan { background:#3a2c1a; color:#d8c9a3; border:1px solid #6a5636; }
  .era-pct { display:block; font-size: 10px; opacity:.5; margin-top:3px; }

  /* flex:1이어야 남은 세로 공간을 채우고, min-height:0이어야 넘칠 때 부모(페이지)가
     아니라 이 안에서만 overflow-y:auto로 스크롤된다(플렉스 자식의 흔한 함정). */
  .cards { display:grid; grid-template-columns: repeat(2, 1fr); gap: 7px; align-content:start;
    flex: 1 1 auto; min-height: 0; overflow-y: auto; padding-bottom: 4px; }
  .card { display:block; text-decoration:none; color:inherit; background:#241b10; border:1px solid #4a3c26;
    border-radius: 10px; padding: 8px 9px; transition: border-color .15s, transform .1s; }
  .card:active { transform: scale(0.96); }
  .card.live { border-color:#c9a24a; }
  .card .num { font-size:9.5px; color:#f0c96b; opacity:.85; }
  .card .name { font-size: 12px; margin-top: 2px; line-height:1.3; }
  .card .who { font-size: 9.5px; opacity:.6; margin-top: 3px; }

  .plan-note { font-size: 11px; opacity:.55; line-height:1.5; text-align:center; padding-top: 4px; flex:none; margin:6px 0 0; }
  /* 가로모드 폰처럼 화면이 낮을 땐 카드 영역을 최대한 확보하려고 안내문을 숨긴다.
     회전 트릭 때문에 CSS 미디어쿼리로는 실제 게임 화면 높이를 알 수 없어서
     JS가 body에 .short 클래스를 붙여준다. */
  body.short .plan-note { display:none; }
</style>
</head>
<body>
<div id="wrap">
  <div id="scroller">
    <div id="app">
      <div class="topbar">
        <h1>한국사 게임</h1>
      </div>
      <div id="timeline">
        <div class="timeline-line"></div>
        <div class="eras-row" id="eras-row"></div>
      </div>
      <p class="plan-note">기획 중인 시대는 실제 기출 750문항(15개 회차) 분석을 바탕으로 챕터 구조와 NPC 대사까지 미리 설계되어 있습니다. 완성되는 대로 순서대로 추가됩니다.</p>
    </div>
  </div>
</div>

<script>
/* 가로모드 고정 (게임 챕터들과 동일 로직) */
const wrapEl = document.getElementById('wrap');
function getViewportSize(){
  if (window.visualViewport) return { w: window.visualViewport.width, h: window.visualViewport.height };
  return { w: window.innerWidth, h: window.innerHeight };
}
function applyOrientation(){
  const { w: iw, h: ih } = getViewportSize();
  const portrait = ih > iw;
  document.body.classList.toggle('rot', portrait);
  const w = portrait ? ih : iw;
  const h = portrait ? iw : ih;
  wrapEl.style.width = w + 'px';
  wrapEl.style.height = h + 'px';
  // 타임라인 가로선을 화면 높이의 약 24% 지점(대략 중앙 위쪽)에 두되,
  // 너무 낮거나 높지 않도록 범위를 제한한다.
  const lineY = Math.max(26, Math.min(42, Math.round(h * 0.09)));
  document.documentElement.style.setProperty('--line-y', lineY + 'px');
  document.body.classList.toggle('short', h < 430);
}
window.addEventListener('resize', applyOrientation);
window.addEventListener('orientationchange', () => setTimeout(applyOrientation, 80));
if (window.visualViewport){
  window.visualViewport.addEventListener('resize', applyOrientation);
  window.visualViewport.addEventListener('scroll', applyOrientation);
}
setTimeout(applyOrientation, 300);
setTimeout(applyOrientation, 800);
applyOrientation();

/* ============ 시대순(왼쪽=과거 → 오른쪽=현재) 타임라인 데이터 ============ */
const ERAS = [
  { title: '선사·초기국가', year: '~ BC108', pct: '4.3%', range: '구석기 ~ 고조선·초기국가' },
  { title: '고대', year: 'BC57 ~ 918', pct: '14.5%', range: '삼국시대 ~ 남북국시대' },
  { title: '고려', year: '918 ~ 1392', pct: '16.5%', range: '918 ~ 1392' },
  { title: '조선 전기', year: '1392 ~ 1592', pct: null, range: null, cards: [
    { href: 'ch0_phaser.html', num: '0화 · 신버전', name: '새 나라의 설계자', who: '태조 · 정도전' },
    { href: 'ch0.html', num: '0화', name: '새 나라의 설계자', who: '태조 · 정도전' },
    { href: 'ch1.html', num: '1화', name: '왕권의 기틀', who: '태종' },
    { href: 'ch2.html', num: '2화', name: '황금시대', who: '세종' },
    { href: 'ch3.html', num: '3화', name: '피의 계승', who: '세조' },
    { href: 'ch4.html', num: '4화', name: '법과 제도의 완성', who: '성종' },
    { href: 'ch5.html', num: '5화', name: '사림과 피바람', who: '연산군~명종' },
    { href: 'ch6.html', num: '6화 · 완결', name: '폭풍 전야', who: '선조' },
  ] },
  { title: '조선 후기', year: '1592 ~ 1863', pct: '11.6%', range: '1592 ~ 1863' },
  { title: '근대·개항기', year: '1863 ~ 1910', pct: '13.7%', range: '1863 ~ 1910', cards: [
    { href: 'gaehang_ch2.html', num: '2화 · 체험판', name: '군인들의 함성', who: '임오군란 · 흥선대원군' },
    { href: 'gaehang_ch3.html', num: '3화 · 체험판', name: '삼일천하의 꿈', who: '갑신정변 · 김옥균' },
  ] },
  { title: '일제강점기', year: '1910 ~ 1945', pct: '16.5%', range: '1910 ~ 1945', cards: [
    { href: 'ilje_ch7.html', num: '7화 · 체험판', name: '임정의 부활', who: '한인애국단 · 김구·윤봉길' },
  ] },
  { title: '현대', year: '1945 ~ 현재', pct: '10.9%', range: '1945 ~ 현재' },
];

const row = document.getElementById('eras-row');
ERAS.forEach(e => {
  const col = document.createElement('div');
  col.className = 'era-col';
  const isFull = e.title === '조선 전기';
  const hasCards = !!e.cards;
  const badge = isFull ? '<span class="era-badge badge-live">플레이 가능 · 전 7화</span>'
    : hasCards ? '<span class="era-badge badge-partial">일부 체험 가능</span>'
    : '<span class="era-badge badge-plan">기획 완료 · 구현 예정</span>';
  const dotClass = (isFull || hasCards) ? 'era-dot' : 'era-dot plan';
  const pctLine = e.pct ? `<span class="era-pct">기출 ${e.pct}</span>` : '';
  let html = `
    <div class="era-marker-wrap"><div class="${dotClass}"></div><div class="era-year">${e.year}</div></div>
    <div class="era-head">
      <span class="era-title">${e.title}</span>
      ${badge}
      ${pctLine}
    </div>`;
  if (e.cards){
    html += '<div class="cards">' + e.cards.map(c =>
      `<a class="card live" href="${c.href}"><div class="num">${c.num}</div><div class="name">${c.name}</div><div class="who">${c.who}</div></a>`
    ).join('') + '</div>';
  }
  col.innerHTML = html;
  row.appendChild(col);
});
</script>
</body>
</html>
