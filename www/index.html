<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>타임슬립 한국사 · 한능검 심화 기출 — 챕터 목록</title>
<meta name="description" content="한국사능력검정시험(한능검) 심화 대비 게임. 선사부터 현대까지 36화를 걸어다니며, 기출 415문항을 이야기로 푼다.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; word-break: keep-all; overflow-wrap: break-word; }
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; overscroll-behavior:none;
    background:#15110c; font-family: "Gowun Batang", -apple-system, "Malgun Gothic", serif; color:#f5ecd8; }

  /* 가로모드 고정: 이 게임은 항상 가로로만 플레이한다(세로모드 없음).
     게임 챕터들과 동일한 트릭 — 세로 뷰포트면 #wrap 전체를 90도 돌려서
     강제로 가로 화면처럼 쓴다. */
  #wrap { position: fixed; top: 0; left: 0; touch-action: pan-x pan-y; transform-origin: top left; overflow: hidden; }
  body.rot #wrap { transform: rotate(90deg) translateY(-100%); }

  /* 시대 아코디언 목록이라 페이지 전체는 세로로 스크롤한다(펼친 시대 안
     챕터 카드만 따로 가로 스크롤). */
  #scroller { width:100%; height:100%; overflow-x:hidden; overflow-y:auto; -webkit-overflow-scrolling:touch; }
  #app { min-height:100%; width:100%; padding: calc(14px + env(safe-area-inset-top)) calc(20px + env(safe-area-inset-right))
    calc(16px + env(safe-area-inset-bottom)) calc(20px + env(safe-area-inset-left)); display:flex; flex-direction:column; }

  .topbar { display:flex; align-items:baseline; gap:10px; margin-bottom: 10px; flex: none; }
  h1 { font-size: 17px; margin: 0; color:#f0c96b; white-space:nowrap; }

  .subtitle { margin:2px 0 0; font-size:12px; color:#b8a888; letter-spacing:.02em; }

  /* 우측 상단 메뉴 버튼 — 챕터 안의 #menu-btn과 같은 생김새(원형 햄버거)로
     통일한다. */
  #menu-btn { margin-left:auto; flex:none; align-self:flex-start; width:30px; height:30px; border-radius:50%;
    border:1px solid #4a3c26; background:#241c12; color:#f5ecd8; font-size:14px; line-height:1;
    display:flex; align-items:center; justify-content:center; cursor:pointer; }

  /* 메뉴 · 배지함 모달 — 왕조 계보 모달(#kings-modal)과 같은 뼈대를 쓴다. */
  #menu-modal, #badges-modal { position:absolute; inset:0; z-index:41; display:none;
    background:rgba(8,6,4,.72); align-items:center; justify-content:center; padding:18px; }
  #menu-modal.show, #badges-modal.show { display:flex; }
  #menu-panel { background:#1b150e; border:1px solid #4a3c26; border-radius:16px;
    width:100%; max-width:320px; padding:16px; }
  #menu-panel h3 { margin:0 0 12px; font-size:15px; color:#f0c96b; }
  #menu-panel button, #menu-panel a { display:block; width:100%; box-sizing:border-box; text-align:left;
    background:#2a2013; border:1px solid #4a3c26; color:#f5ecd8; font-family:inherit; font-size:13px;
    padding:11px 14px; border-radius:10px; margin-bottom:8px; cursor:pointer; text-decoration:none; }
  #menu-panel button:last-child, #menu-panel a:last-child { margin-bottom:0; }
  #badges-panel { background:#1b150e; border:1px solid #4a3c26; border-radius:16px;
    width:100%; height:100%; max-width:720px; display:flex; flex-direction:column; overflow:hidden; }
  #badges-panel .kp-head { flex:none; display:flex; align-items:baseline; justify-content:space-between;
    gap:10px; padding:14px 18px 10px; border-bottom:1px solid #3a2c1a; }
  #badges-panel .kp-head h2 { margin:0; font-size:17px; color:#f0c96b; }
  #badges-panel .kp-head .kp-sub { font-size:11px; color:#afa38f; }
  #badges-close { flex:none; background:#2a2013; border:1px solid #4a3c26; color:#f5ecd8;
    border-radius:999px; width:30px; height:30px; font-size:15px; cursor:pointer; line-height:1; }
  #badges-body { flex:1 1 auto; min-height:0; overflow-y:auto; padding:16px 18px 20px; }
  .badge-era { font-family:"Gowun Batang", serif; font-weight:700; font-size:13px; color:#e9c979;
    margin:18px 0 10px; }
  .badge-era:first-child { margin-top:0; }
  .badge-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(140px, 1fr)); gap:8px; }
  .badge-item { background:#241c12; border:1px solid #3a2c1a; border-radius:10px; padding:10px;
    display:flex; flex-direction:column; gap:3px; }
  .badge-item .b-icon { font-size:18px; opacity:.35; }
  .badge-item .b-name { font-size:12px; color:#8a7d68; }
  .badge-item .b-desc { font-size:10px; color:#6a5c48; line-height:1.4; }
  .badge-item.got { border-color:#7a5a1e; background:#2c2210; }
  .badge-item.got .b-icon { opacity:1; }
  .badge-item.got .b-name { color:#f0d9a0; font-weight:700; }
  .badge-item.got .b-desc { color:#c9b896; }

  /* 시대 아코디언 목록: 세로로 쌓인 시대 중 한 번에 하나만 펼쳐서, 펼친
     시대의 챕터 카드는 가로 한 줄로 크게 보여준다(디자인 가이드 레이아웃
     제안). #era-list가 세로 스크롤을 맡고, 왼쪽 가장자리를 따라 흐르는
     얇은 세로선 + 점이 예전 가로 타임라인의 '시간 순서' 느낌을 잇는다. */
  #era-list { flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden; padding-left: 22px; position: relative; }
  #era-list::before { content: ''; position: absolute; left: 5px; top: 8px; bottom: 8px; width: 2px; background: #3a2f1e; }
  .era-section { position: relative; border-bottom: 1px solid #241c12; }
  .era-section:last-child { border-bottom: none; }
  .era-dot { position: absolute; left: -22px; top: 20px; width: 12px; height: 12px; border-radius: 50%;
    background: #d9a441; border: 3px solid #15110c; box-shadow: 0 0 0 1px #3a2f1e; z-index: 1; }
  .era-header { display: flex; align-items: baseline; gap: 10px; padding: 14px 10px 14px 4px; cursor: pointer; }
  .era-header:active { background: rgba(255,255,255,.03); }
  .era-title { font-size: 18px; font-weight: bold; color: #f0c96b; }
  .era-title.clk { cursor: pointer; border-bottom: 1px dotted #d9a441; padding-bottom: 1px; }
  .era-year { font-size: 11px; color: #afa38f; white-space: nowrap; }
  .era-pct { font-size: 11px; color: #c9a24a; white-space: nowrap; }
  .era-chevron { margin-left: auto; flex: none; color: #8a7c63; font-size: 13px;
    transition: transform .2s ease; }
  .era-section.open .era-chevron { transform: rotate(90deg); color: #d9a441; }

  /* 시대 진행선 — 시작(금색 점) → 현재(최근 학습한 챕터, 빛나는 고리) →
     끝(빈 점). 카드 목록 위, 헤더 아래 가로선으로 "이 시대의 어디쯤"을
     보여준다. 최근 학습한 챕터가 없는 시대는 고리 없이 선만 보인다. */
  .era-track { position: relative; height: 16px; margin: 2px 10px 8px 4px; flex: none; }
  .era-track-line { position: absolute; left: 4px; right: 4px; top: 50%; height: 2px;
    background: #3a2f1e; transform: translateY(-50%); }
  .era-track-dot { position: absolute; top: 50%; width: 8px; height: 8px; border-radius: 50%;
    transform: translate(-50%,-50%); }
  .era-track-dot.start { left: 4px; background: #d9a441; }
  .era-track-dot.end { left: calc(100% - 4px); background: #15110c; border: 2px solid #4a3c26; }
  .era-track-dot.current { width: 15px; height: 15px; background: #1b150e; border: 3px solid #f0c96b;
    box-shadow: 0 0 10px 2px rgba(240,201,107,.65); }

  /* 펼친 시대의 챕터 카드 — 가로 한 줄, 큼직하게. 제목이 가장 크고,
     인물/키워드는 보조, 기출 비중은 맨 아래로 낮춰서 위계를 준다. */
  .era-cards-row { display: flex; gap: 14px; overflow-x: auto; padding: 14px 10px 18px 4px;
    -webkit-overflow-scrolling: touch; }
  .chapter-card { position: relative; flex: 0 0 auto; width: 176px; display: flex; flex-direction: column; gap: 7px;
    text-decoration: none; color: inherit; background: #241c12; border: 1px solid #3a2f1e;
    border-radius: 16px; padding: 16px; box-shadow: 0 4px 16px rgba(0,0,0,.22);
    transition: border-color .15s, transform .1s; }
  .chapter-card:active { transform: scale(0.97); }
  /* 최근 학습한 챕터 — 말풍선 꼭지처럼 위에 삼각형을 달고 금색으로 빛나게
     해서 "이어서 할 곳"이 목록에서 바로 눈에 띄게 한다. */
  .chapter-card.recent { border-color: #f0c96b;
    box-shadow: 0 0 0 2px #f0c96b, 0 0 22px 5px rgba(240,201,107,.55), 0 4px 16px rgba(0,0,0,.22); }
  .chapter-card.recent::before { content: ''; position: absolute; top: -9px; left: 50%;
    transform: translateX(-50%); width: 0; height: 0;
    border-left: 8px solid transparent; border-right: 8px solid transparent; border-bottom: 9px solid #f0c96b; }
  .chapter-card .ccard-num { font-size: 10.5px; color: #c9a24a; font-weight: 600; letter-spacing: .02em; }
  .chapter-card .ccard-title { font-size: 16px; font-weight: bold; line-height: 1.35; color: #f5ecd8; }
  .chapter-card .ccard-who { font-size: 11.5px; color: #afa38f; line-height: 1.4; }
  .chapter-card .ccard-pct { margin-top: auto; font-size: 10.5px; color: #8a7c63; padding-top: 4px;
    border-top: 1px solid #2a2013; }

  .plan-note { font-size: 11px; color:#afa38f; line-height:1.5; text-align:center; padding-top: 4px; flex:none; margin:6px 0 0; }
  /* 가로모드 폰처럼 화면이 낮을 땐 카드 영역을 최대한 확보하려고 안내문을 숨긴다.
     회전 트릭 때문에 CSS 미디어쿼리로는 실제 게임 화면 높이를 알 수 없어서
     JS가 body에 .short 클래스를 붙여준다. */
  body.short .plan-note { display:none; }

  /* 왕조 계보 모달 — 시대 제목을 누르면 그 시대 나라들의 왕 계보를 기출
     출제 횟수와 함께 보여준다. #wrap 안에 둬야 세로모드 회전 트릭을 그대로
     따라간다(미니맵과 같은 이유). */
  .era-title.clk { cursor:pointer; border-bottom:1px dotted #d9a441; padding-bottom:1px; }
  #kings-modal { position:absolute; inset:0; z-index:40; display:none;
    background:rgba(8,6,4,.72); align-items:center; justify-content:center; padding:18px; }
  #kings-modal.show { display:flex; }
  #kings-panel { background:#1b150e; border:1px solid #4a3c26; border-radius:16px;
    width:100%; height:100%; max-width:1040px; display:flex; flex-direction:column; overflow:hidden; }
  #kings-panel .kp-head { flex:none; display:flex; align-items:baseline; justify-content:space-between;
    gap:10px; padding:14px 18px 10px; border-bottom:1px solid #3a2c1a; }
  #kings-panel .kp-head h2 { margin:0; font-size:17px; color:#f0c96b; }
  #kings-panel .kp-head .kp-sub { font-size:11px; color:#afa38f; }
  #kings-close { flex:none; background:#2a2013; border:1px solid #4a3c26; color:#f5ecd8;
    border-radius:999px; width:30px; height:30px; font-size:15px; cursor:pointer; line-height:1; }
  #kings-body { flex:1 1 auto; min-height:0; overflow-y:auto; padding:14px 18px 20px; }
  /* 동명이인 점은 hover가 안 되는 손가락 터치로도 봐야 해서, title 툴팁 대신
     눌렀을 때 여기에 문구를 띄운다(회전 트릭 중엔 좌표 계산이 꼬이기 쉬워
     점 옆에 말풍선을 띄우는 대신 이 고정 배너로 대신한다). */
  #kp-tapinfo { display:none; flex:none; margin:0 18px; padding:8px 12px; font-size:11.5px; line-height:1.5;
    background:#332411; border:1px solid #d9a441; border-radius:8px; color:#f0d9a0; }
  #kp-tapinfo.show { display:block; }
  .kp-country { margin-bottom:28px; }
  .kp-country .kp-cname { font-family:"Gowun Batang", serif; font-weight:700; font-size:13.5px; color:#e9c979; margin-bottom:6px; }
  .kp-country .kp-ccount { font-size:10.5px; color:#afa38f; margin-left:6px; font-weight:400; }
  /* 시대 하나를 볼 때, 나라가 달라도 같은 시기의 왕은 같은 가로 위치에
     오도록 실제 재위 연도로 자리를 계산한다(전엔 그냥 순서대로 나열해
     나라별로 스크롤 위치가 서로 어긋났다). 그러려면 나라별로 따로
     스크롤되면 안 되므로, 한 시대의 모든 나라 줄을 kp-hscroll 하나가
     함께 가로 스크롤한다(줄마다 스크롤이 있으면 다시 어긋난다). */
  .kp-hscroll { overflow-x:auto; }
  .kp-strip { position:relative; height:156px; padding:8px 8px 10px; }
  /* 예전엔 ::before로 줄 전체 폭(20px~right:20px)에 선을 그렸는데, 그러면
     나라가 일찍 멸망해도 선이 트랙 끝까지 이어져 마치 그 뒤로도 왕조가
     계속되는 것처럼 보였다. 이제 실제 엘리먼트로 그려서, 그 나라의
     마지막 왕(=멸망 시점) 자리에서 선이 끝나도록 폭을 JS에서 정한다. */
  .kp-line { position:absolute; left:20px; top:24px; height:2px; z-index:0;
    background: linear-gradient(90deg, transparent, #5a4a30 8%, #5a4a30 100%); }
  .kp-king { position:absolute; top:8px; width:108px; display:flex; flex-direction:column; align-items:center; padding:0 5px; z-index:1; }
  .kp-king .kp-badge { position:relative; width:40px; height:40px; border-radius:50%; display:flex; align-items:center;
    justify-content:center; font-weight:700; font-size:11.5px;
    background:#2a2013; border:2px solid #4a3c26; color:#9c8d70;
    background-size:cover; background-position:center top; }
  /* 초상화가 있는 왕은 얼굴을 배지 전체에 채우고, 출제 횟수는 오른쪽
     아래 작은 알약으로 옮긴다(얼굴이 이미지로 먼저 기억되게). */
  .kp-king .kp-badge.has-p .kp-n { position:absolute; bottom:-4px; right:-6px; min-width:16px; height:16px;
    padding:0 3px; border-radius:9px; background:#1b150e; border:1.5px solid #4a3c26; color:#f0d9a0;
    font-size:9px; font-weight:700; display:flex; align-items:center; justify-content:center; }
  /* 이름·연도·업적 묶음. 같은 줄에서 왕들이 몰려 있으면(연도가 실제로
     가까움) 자리(가로 좌표)는 절대 옮기지 않고 — 다른 나라와 같은
     해가 늘 같은 세로줄에 오게 하기 위해서다 — 이 라벨만 아래로
     한 단 내려서(.kp-king.kp-stag) 글자가 서로 안 겹치게 한다. */
  .kp-king .kp-label { margin-top:7px; }
  .kp-king.kp-stag .kp-label { margin-top:49px; }
  .kp-king .kp-nm { font-size:12px; font-weight:500; text-align:center; white-space:nowrap; line-height:1.3; color:#f0e6d2; }
  .kp-king .kp-yr { font-size:10px; color:#a89878; margin-top:2px; font-variant-numeric: tabular-nums; }
  /* 업적 한 줄 — 왕 이름 아래 짧게 붙여 이미지처럼 기억하기 좋게(외우기용). */
  .kp-king .kp-achv { font-size:9.5px; color:#c9b896; margin-top:4px; text-align:center; line-height:1.35;
    white-space:normal; word-break:keep-all; }
  .kp-king[data-t="0"] .kp-badge{ background:#221a10; border-color:#3a2f1e; color:#6a5c48; }
  .kp-king[data-t="1"] .kp-badge{ background:#3a2f1a; border-color:#8a744a; color:#dcc48f; }
  .kp-king[data-t="2"] .kp-badge{ background:#4a3512; border-color:#d9a441; color:#f5d488; }
  .kp-king[data-t="3"] .kp-badge{ background:#5a3411; border-color:#e0883a; color:#ffd29c; }
  .kp-king[data-t="4"] .kp-badge{ background:#7a3512; border-color:#ff9a4a; color:#fff; box-shadow:0 0 9px rgba(255,144,64,.55); }
  .kp-dupdot{ position:absolute; top:-2px; right:-2px; width:12px; height:12px; border-radius:50%; font-size:7px;
    line-height:12px; text-align:center; font-weight:900; color:#1b150e; background:#7fb0a0; border:1.5px solid #1b150e; }
  .kp-legend{ display:flex; gap:12px; flex-wrap:wrap; font-size:10px; color:#afa38f; margin-bottom:10px; }
  .kp-legend i{ display:inline-block; width:8px; height:8px; border-radius:50%; border:2px solid #4a3c26; margin-right:3px; vertical-align:middle; }
</style>
</head>
<body>
<div id="wrap">
  <div id="scroller">
    <div id="app">
      <div class="topbar">
        <h1>타임슬립 한국사</h1>
        <p class="subtitle">한능검 심화 기출 · 선사부터 현대까지 36화</p>
        <button id="menu-btn" aria-label="메뉴">☰</button>
      </div>
      <div id="era-list"></div>
    </div>
  </div>
  <div id="menu-modal">
    <div id="menu-panel">
      <h3>메뉴</h3>
      <button id="menu-back">◀ 이전으로</button>
      <button id="menu-badges-open">🏅 배지함 보기</button>
      <button id="menu-reset">진행 기록 초기화</button>
      <button id="menu-close-btn">닫기</button>
    </div>
  </div>
  <div id="badges-modal">
    <div id="badges-panel">
      <div class="kp-head">
        <div><h2>배지함</h2><span class="kp-sub" id="badges-sub"></span></div>
        <button id="badges-close" aria-label="닫기">✕</button>
      </div>
      <div id="badges-body"></div>
    </div>
  </div>
  <div id="kings-modal">
    <div id="kings-panel">
      <div class="kp-head">
        <div><h2 id="kp-title"></h2><span class="kp-sub" id="kp-sub"></span></div>
        <button id="kings-close" aria-label="닫기">✕</button>
      </div>
      <div id="kp-tapinfo"></div>
      <div id="kings-body"></div>
    </div>
  </div>
</div>

<script src="assets/badges.js"></script>
<script>
/* 가로모드 고정 (게임 챕터들과 동일 로직) */
const wrapEl = document.getElementById('wrap');
function getViewportSize(){
  const vv = window.visualViewport;
  // 핀치줌이 걸리면 vv.width/height가 확대 배율만큼 줄어든다. 그 값을 그대로 쓰면
  // #wrap이 축소되면서 화면이 "확대된 채로" 굳어 되돌릴 수 없었다(실제 발생).
  // 줌이 걸린 동안은 레이아웃 뷰포트를 써서 레이아웃이 줌을 따라가지 않게 한다.
  if (vv && (vv.scale || 1) <= 1.01) return { w: vv.width, h: vv.height };
  return { w: window.innerWidth, h: window.innerHeight };
}

/* ============ 확대(핀치줌·더블탭줌) 차단 ============
   iOS Safari는 접근성 정책상 viewport meta의 user-scalable=no를 무시하므로
   JS로 직접 막는다. 위 getViewportSize의 폴백과 2중 방어. */
['gesturestart','gesturechange','gestureend'].forEach(function(ev){
  document.addEventListener(ev, function(e){ e.preventDefault(); }, { passive: false });
});
document.addEventListener('touchmove', function(e){
  if (e.touches.length > 1) e.preventDefault();          // 두 손가락 = 핀치
}, { passive: false });
var __lastTouchEnd = 0;
document.addEventListener('touchend', function(e){
  var now = Date.now();
  if (now - __lastTouchEnd <= 300) e.preventDefault();   // 더블탭 줌
  __lastTouchEnd = now;
}, { passive: false });
function applyOrientation(){
  const { w: iw, h: ih } = getViewportSize();
  const portrait = ih > iw;
  document.body.classList.toggle('rot', portrait);
  const w = portrait ? ih : iw;
  const h = portrait ? iw : ih;
  wrapEl.style.width = w + 'px';
  wrapEl.style.height = h + 'px';
  document.body.classList.toggle('short', h < 430);
}
window.addEventListener('resize', applyOrientation);
window.addEventListener('orientationchange', () => setTimeout(applyOrientation, 80));
if (window.visualViewport){
  window.visualViewport.addEventListener('resize', applyOrientation);
  window.visualViewport.addEventListener('scroll', applyOrientation);
}
setTimeout(applyOrientation, 300);
setTimeout(applyOrientation, 800);
applyOrientation();

const KINGS_BY_ERA = {};
KINGS_DATA.forEach(([era, country, kings]) => {
  (KINGS_BY_ERA[era] = KINGS_BY_ERA[era] || []).push([country, kings]);
});
const KINGS_NAME_GROUPS = {};
KINGS_DATA.forEach(([era, country, kings]) => {
  kings.forEach(k => { (KINGS_NAME_GROUPS[k.name] = KINGS_NAME_GROUPS[k.name] || []).push({ ...k, era, country }); });
});
function kingsTier(n){ return n === 0 ? 0 : n <= 3 ? 1 : n <= 8 ? 2 : n <= 15 ? 3 : 4; }
function kingsJosa(word, withB, noB){
  const code = word.charCodeAt(word.length - 1) - 0xAC00;
  if (code < 0 || code > 11171) return word + noB;
  return word + (code % 28 ? withB : noB);
}
function kingsDupOthers(name, era, country, year){
  const group = KINGS_NAME_GROUPS[name];
  if (!group || group.length < 2) return null;
  const others = group.filter(o => !(o.era === era && o.country === country && o.year === year));
  return others.length ? others : null;
}
function kingsDupDot(name, era, country, year){
  const others = kingsDupOthers(name, era, country, year);
  if (!others) return '';
  const list = others.map(o => `${o.country} ${o.name}(${o.year}, ${o.n}회)`).join(' / ');
  const tip = (kingsJosa(name, '과', '와') + ` 같은 이름의 다른 왕이 있습니다: ${list}`).replace(/"/g, '&quot;');
  return `<span class="kp-dupdot" title="${tip}" data-tip="${tip}">동</span>`;
}
/* 왕 연도 문자열 → 숫자(정렬·가로 위치 계산용). "BC194"·"~BC108" 같은
   기원전 표기는 음수로, 건국 설화처럼 연도가 없는 항목은 관례적으로
   쓰이는 대략의 해를 대신 쓴다(표시 위치를 잡기 위한 것일 뿐, 그 해가
   확정된 사실이라는 뜻은 아니다). */
function kingsYearNum(y){
  if (y === '(건국)') return -2333;       // 단군신화 속 고조선 건국 연대
  if (y === '(대가야 시조)') return 42;    // 같은 가야권 김수로왕과 비슷한 시기
  const m = y.match(/~?\s*(BC)?\s*(\d+)/);
  if (!m) return 0;
  const n = parseInt(m[2], 10);
  return m[1] ? -n : n;
}
function openKingsModal(era){
  const groups = KINGS_BY_ERA[era];
  if (!groups) return;
  document.getElementById('kp-title').textContent = era + ' 왕 계보';
  const totalKings = groups.reduce((s, [,ks]) => s + ks.length, 0);
  document.getElementById('kp-sub').textContent = `${groups.map(g => g[0]).join(' · ')} · 왕 ${totalKings}명 · 원 안 숫자 = 기출 출제 횟수`;
  const body = document.getElementById('kings-body');
  let html = `<div class="kp-legend">
    <span><i style="background:#221a10; border-color:#3a2f1e"></i>0회</span><span><i style="background:#3a2f1a; border-color:#8a744a"></i>1~3회</span>
    <span><i style="background:#4a3512; border-color:#d9a441"></i>4~8회</span><span><i style="background:#5a3411; border-color:#e0883a"></i>9~15회</span>
    <span><i style="background:#7a3512; border-color:#ff9a4a"></i>16회+</span>
    <span><span class="kp-dupdot" style="position:static; display:inline-flex; align-items:center; justify-content:center;">동</span> 다른 시대·나라에 같은 이름의 왕이 또 있음(눌러서 확인)</span>
  </div>`;

  // 이 시대 전체(모든 나라 통틀어)의 연도 범위로 가로 축척을 하나 정해서
  // 나라가 달라도 같은 해가 같은 x좌표에 오게 한다.
  const allYears = [];
  groups.forEach(([, kings]) => kings.forEach(k => allYears.push(kingsYearNum(k.year))));
  const minY = Math.min.apply(null, allYears), maxY = Math.max.apply(null, allYears);
  const span = Math.max(1, maxY - minY);
  const pxPerYear = Math.max(2.4, 900 / span);
  let trackW = 640;

  // 나라(줄)가 하나뿐이면 다른 줄과 맞출 일이 없으니, 배지끼리 겹치지만
  // 않게 최소 간격만 지키며 민다(예전 방식 — 안전하고 자리도 안 넘친다).
  // 나라가 여럿이면(지금은 고대만) 자리를 실제 연도로 고정해야 같은 해가
  // 나라를 넘나들어도 같은 세로줄에 온다 — 그 대신 같은 줄에서 연도가
  // 너무 가까우면 라벨만(배지는 그대로 두고) 한 단 내려 겹침을 피한다.
  const singleRow = groups.length === 1;
  const rows = groups.map(([country, kings]) => {
    let lastX = -Infinity, tier = 0;
    const positioned = kings.map(k => {
      let x = 40 + (kingsYearNum(k.year) - minY) * pxPerYear;
      if (singleRow){
        if (x < lastX + 100) x = lastX + 100;
        lastX = x;
        return { k, x, stagger: false };
      }
      tier = (x - lastX < 100) ? (tier === 0 ? 1 : 0) : 0;
      lastX = x;
      return { k, x, stagger: tier === 1 };
    });
    const rowEndX = positioned.length ? positioned[positioned.length - 1].x : 40;
    trackW = Math.max(trackW, rowEndX + 80);
    return { country, kings, positioned, rowEndX };
  });

  html += `<div class="kp-hscroll">` + rows.map(({ country, kings, positioned, rowEndX }) => {
    const total = kings.reduce((s, k) => s + k.n, 0);
    // 이 나라의 마지막 왕(=멸망 또는 이 왕조 목록의 끝) 자리에서 선이
    // 끝나게 한다 — 트랙 전체 폭(trackW)까지 죽 이어지지 않는다.
    const lineW = Math.max(0, rowEndX - 20);
    return `<div class="kp-country"><span class="kp-cname">${country}<span class="kp-ccount">· 왕 ${kings.length}명 · 출제 합계 ${total}회</span></span>
      <div class="kp-strip" style="width:${trackW}px">
        <div class="kp-line" style="width:${lineW}px"></div>` + positioned.map(({ k, x, stagger }) => `
        <div class="kp-king${stagger ? ' kp-stag' : ''}" data-t="${kingsTier(k.n)}" style="left:${x}px">
          <div class="kp-badge${k.p ? ' has-p' : ''}"${k.p ? ` style="background-image:url('assets/portraits/${k.p}.png')"` : ''}>${k.p ? `<span class="kp-n">${k.n}</span>` : k.n}${kingsDupDot(k.name, era, country, k.year)}</div>
          <div class="kp-label">
            <div class="kp-nm">${k.name}</div>
            <div class="kp-yr">${k.year}</div>
            ${k.a ? `<div class="kp-achv">${k.a}</div>` : ''}
          </div>
        </div>`).join('') + `</div></div>`;
  }).join('') + `</div>`;

  body.innerHTML = html;
  document.getElementById('kp-tapinfo').classList.remove('show');
  document.getElementById('kings-modal').classList.add('show');
}
function closeKingsModal(){
  document.getElementById('kings-modal').classList.remove('show');
}
document.getElementById('kings-body').addEventListener('click', (ev) => {
  const dot = ev.target.closest('.kp-dupdot');
  const info = document.getElementById('kp-tapinfo');
  if (dot && dot.dataset.tip){
    info.textContent = dot.dataset.tip;
    info.classList.add('show');
  } else {
    info.classList.remove('show');
  }
});

// 최근 학습한 챕터 — 각 챕터가 열릴 때 자기 파일명을 기억해 둔 것을 읽어
// 온다. 있으면 그 챕터가 있는 시대를 기본으로 펼치고, 카드에 빛나는
// 표시를 단다("이어서 하기"를 한눈에 찾게).
let lastChapterHref = null;
try { lastChapterHref = localStorage.getItem('khg_lastChapter'); } catch(e){}

const eraListEl = document.getElementById('era-list');
// 시대 아코디언 — 한 번에 한 시대만 펼친다(디자인 가이드의 레이아웃
// 제안). 기본으로는 최근 학습한 챕터가 있는 시대를, 없으면 첫 시대
// (선사·초기국가)를 펼쳐 둔다.
let openEraTitle = ERAS[0].title;
if (lastChapterHref){
  const eraWithRecent = ERAS.find(e => e.cards && e.cards.some(c => c.href === lastChapterHref));
  if (eraWithRecent) openEraTitle = eraWithRecent.title;
}

function renderEraList(){
  eraListEl.innerHTML = '';
  ERAS.forEach(e => {
    const section = document.createElement('div');
    const isOpen = e.title === openEraTitle;
    section.className = 'era-section' + (isOpen ? ' open' : '');

    const hasKings = !!KINGS_BY_ERA[e.title];
    const pctLine = e.pct ? `<span class="era-pct">기출 ${e.pct}</span>` : '';
    section.innerHTML = `
      <div class="era-dot"></div>
      <div class="era-header">
        <span class="era-title${hasKings ? ' clk' : ''}"${hasKings ? ` title="누르면 이 시대 왕 계보 보기"` : ''}>${e.title}</span>
        <span class="era-year">${e.year}</span>
        ${pctLine}
        <span class="era-chevron">▶</span>
      </div>`;
    if (isOpen && e.cards){
      const recentIdx = e.cards.findIndex(c => c.href === lastChapterHref);

      // 가로선 + 시작/현재/끝 점 — 현재 점은 최근 학습한 챕터가 이 시대
      // 안에서 몇 번째인지(0~100%)에 맞춰 둔다. 최근 챕터가 없는 시대는
      // 밋밋한 선(시작·끝 점만)만 보여준다.
      const track = document.createElement('div');
      track.className = 'era-track';
      const pct = (recentIdx >= 0 && e.cards.length > 1) ? (recentIdx / (e.cards.length - 1) * 100) : null;
      track.innerHTML = `<div class="era-track-line"></div>
        <div class="era-track-dot start"></div>
        ${pct !== null ? `<div class="era-track-dot current" style="left:${pct}%"></div>` : ''}
        <div class="era-track-dot end"></div>`;
      section.appendChild(track);

      const cardsRow = document.createElement('div');
      cardsRow.className = 'era-cards-row';
      cardsRow.innerHTML = e.cards.map((c, i) =>
        `<a class="chapter-card${i === recentIdx ? ' recent' : ''}" href="${c.href}">
          <div class="ccard-num">${c.num}</div>
          <div class="ccard-title">${c.name}</div>
          <div class="ccard-who">${c.who}</div>
        </a>`
      ).join('');
      section.appendChild(cardsRow);
    }

    const titleEl = section.querySelector('.era-title');
    if (hasKings){
      titleEl.addEventListener('click', (ev) => { ev.stopPropagation(); openKingsModal(e.title); });
    }
    section.querySelector('.era-header').addEventListener('click', () => {
      openEraTitle = isOpen ? null : e.title;
      renderEraList();
    });
    eraListEl.appendChild(section);
  });
}
renderEraList();

document.getElementById('kings-close').addEventListener('click', closeKingsModal);
document.getElementById('kings-modal').addEventListener('click', (ev) => {
  if (ev.target.id === 'kings-modal') closeKingsModal();
});

/* ============ 메뉴 · 배지함 ============ */
function chapterBadgeId(href){ return 'ch_complete_' + href; }
function renderBadges(){
  const earned = (window.Badges ? Badges.load() : {});
  let totalCount = 0;
  let html = '';
  ERAS.forEach(era => {
    html += `<div class="badge-era">${era.title}</div><div class="badge-grid">`;
    era.cards.forEach(c => {
      const got = !!earned[chapterBadgeId(c.href)];
      totalCount++;
      html += `<div class="badge-item${got ? ' got' : ''}">
        <div class="b-icon">🏅</div>
        <div class="b-name">${got ? c.num + ' ' + c.name : '???'}</div>
        <div class="b-desc">${got ? '완주' : '이 화를 끝까지 마치면 열립니다'}</div>
      </div>`;
    });
    html += '</div>';
  });
  html += `<div class="badge-era">그 외</div><div class="badge-grid">`;
  Object.keys(BADGE_DEFS).forEach(id => {
    const def = BADGE_DEFS[id];
    const got = !!earned[id];
    totalCount++;
    html += `<div class="badge-item${got ? ' got' : ''}">
      <div class="b-icon">${got ? def.icon : '🔒'}</div>
      <div class="b-name">${got ? def.name : '???'}</div>
      <div class="b-desc">${got ? def.desc : '아직 만나지 못한 배지'}</div>
    </div>`;
  });
  html += '</div>';
  document.getElementById('badges-body').innerHTML = html;
  document.getElementById('badges-sub').textContent = `${Object.keys(earned).length} / ${totalCount}개 획득`;
}
function openMenu(){ document.getElementById('menu-modal').classList.add('show'); }
function closeMenu(){ document.getElementById('menu-modal').classList.remove('show'); }
function openBadges(){ renderBadges(); document.getElementById('badges-modal').classList.add('show'); }
function closeBadges(){ document.getElementById('badges-modal').classList.remove('show'); }

document.getElementById('menu-btn').addEventListener('click', openMenu);
document.getElementById('menu-close-btn').addEventListener('click', closeMenu);
document.getElementById('menu-modal').addEventListener('click', (ev) => {
  if (ev.target.id === 'menu-modal') closeMenu();
});
document.getElementById('menu-back').addEventListener('click', () => { history.back(); });
document.getElementById('menu-badges-open').addEventListener('click', () => { closeMenu(); openBadges(); });
document.getElementById('menu-reset').addEventListener('click', () => {
  if (!confirm('마지막 학습 위치·배지·인연 기록을 전부 지울까요? 되돌릴 수 없습니다.')) return;
  try {
    localStorage.removeItem('khg_lastChapter');
    localStorage.removeItem('khg_seenIntro');
    if (window.Badges) Badges.clear();
    if (window.Bonds) Bonds.clear();
  } catch(e){}
  location.reload();
});
document.getElementById('badges-close').addEventListener('click', closeBadges);
document.getElementById('badges-modal').addEventListener('click', (ev) => {
  if (ev.target.id === 'badges-modal') closeBadges();
});

document.addEventListener('keydown', (ev) => {
  if (ev.key !== 'Escape') return;
  closeKingsModal(); closeBadges(); closeMenu();
});
</script>
</body>
</html>
