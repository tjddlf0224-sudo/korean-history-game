<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>한국사 게임 - 0화</title>
<!-- 0화는 Phaser에서 캔버스 엔진으로 옮기면서 ch0.html이 되었다.
     파일을 그냥 지웠더니, 옛 index.html을 캐시하고 있던 브라우저에서
     0화를 누르면 404가 났다(실제로 발생). 캐시가 갈릴 때까지 여기서
     새 주소로 넘겨준다. 북마크나 외부 링크에도 같은 보호가 된다. -->
<link rel="canonical" href="ch0.html">
<meta http-equiv="refresh" content="0; url=ch0.html">
<script>location.replace('ch0.html' + location.search + location.hash);</script>
<style>
  html,body{margin:0;height:100%;background:#15110c;color:#f5ecd8;
    font-family:-apple-system,"Malgun Gothic",sans-serif;
    display:flex;align-items:center;justify-content:center;text-align:center}
  a{color:#f0c96b}
</style>
</head>
<body>
  <div>
    <p>0화 주소가 바뀌었습니다. 이동 중…</p>
    <p><a href="ch0.html">넘어가지 않으면 여기를 눌러주세요</a></p>
  </div>
</body>
</html>
