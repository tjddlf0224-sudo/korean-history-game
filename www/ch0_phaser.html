<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>한국사 게임 - 0화 새 나라의 설계자 (Phaser)</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; overscroll-behavior: none; background: #000; font-family: -apple-system, "Pretendard", "Malgun Gothic", sans-serif; }
  #wrap { position: fixed; top: 0; left: 0; touch-action: none; transform-origin: top left; }
  body.rot #wrap { transform: rotate(90deg) translateY(-100%); }
  #game-holder { position: absolute; inset: 0; width: 100%; height: 100%; }
  #game-holder canvas { display: block; }

  #hud { position: absolute; top: calc(10px + env(safe-area-inset-top)); left: calc(12px + env(safe-area-inset-left));
    color: #f5f0e6; font-size: 14px; text-shadow: 0 1px 3px rgba(0,0,0,.8); z-index: 5; }
  #hud .sub { font-size: 11px; opacity: .75; margin-top: 2px; }

  #stick-zone { position: absolute; left: calc(18px + env(safe-area-inset-left)); bottom: calc(18px + env(safe-area-inset-bottom));
    width: 130px; height: 130px; z-index: 6; touch-action: none; }
  #stick-base { position: absolute; inset: 0; border-radius: 50%; background: rgba(255,255,255,0.12); border: 2px solid rgba(255,255,255,0.25); }
  #stick-knob { position: absolute; width: 52px; height: 52px; left: 39px; top: 39px; border-radius: 50%; background: rgba(255,255,255,0.55); transition: transform .05s linear; }

  #act-btn { position: absolute; right: calc(22px + env(safe-area-inset-right)); bottom: calc(34px + env(safe-area-inset-bottom));
    width: 68px; height: 68px; border-radius: 50%; border: none; touch-action: none;
    background: #d9a441; color: #2b1d0e; box-shadow: 0 4px 10px rgba(0,0,0,.4);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity .15s; z-index: 6; }
  #act-btn.show { opacity: 1; pointer-events: auto; }

  .ov { position: absolute; inset: 0; z-index: 20; display: none; align-items: flex-end; justify-content: center; background: rgba(0,0,0,0.35); }
  .ov.show { display: flex; }
  .ov.center { align-items: center; }
  #intro-overlay { background: #15110c; }

  #dlg-panel, #intro-panel {
    width: 100%; max-width: 640px; margin: 0 16px calc(16px + env(safe-area-inset-bottom)); background: #2b2015ee; border: 2px solid #c9a24a;
    border-radius: 14px; padding: 16px 18px; color: #f5ecd8; box-shadow: 0 8px 24px rgba(0,0,0,.5);
    max-height: 80%; overflow-y: auto;
  }
  .dlg-top { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .dlg-portrait { width: 44px; height: 44px; border-radius: 50%; background: #8a6d3b; flex: none; display:flex; align-items:center; justify-content:center; font-size:20px; background-size: cover; background-position: center 15%; }
  .dlg-name { font-weight: bold; font-size: 15px; color: #f0c96b; }
  .dlg-tag { font-size: 11px; opacity: .7; }
  .dlg-box { font-size: 15px; line-height: 1.5; min-height: 54px; white-space: pre-wrap; }
  .dlg-next { text-align: right; margin-top: 10px; font-size: 13px; opacity: .8; cursor: pointer; }
  .dlg-next .arrow { display: inline-block; margin-left: 4px; animation: nudge 1s infinite; }
  @keyframes nudge { 0%,100%{transform:translateX(0);} 50%{transform:translateX(4px);} }

  #intro-panel { max-width: 560px; text-align: center; }
  #intro-text { font-size: 15px; line-height: 1.8; min-height: 90px; white-space: pre-wrap; }
  #intro-next { margin-top: 14px; font-size: 13px; opacity: .8; }

  #fade { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity .6s; z-index: 30; }
  #fade.show { opacity: 1; pointer-events: auto; }

  #end-screen { position: absolute; inset: 0; z-index: 40; display: none; align-items: center; justify-content: center;
    background: #000; color: #f0c96b; text-align: center; padding: 24px; }
  #end-screen.show { display: flex; }
  #end-screen h2 { font-size: 20px; margin-bottom: 10px; }
  #end-screen p { color: #d8c9a3; font-size: 14px; line-height: 1.7; }
</style>
</head>
<body>
<div id="wrap">
  <div id="game-holder"></div>

  <div id="hud">
    <div>0화 · 새 나라의 설계자</div>
    <div class="sub">1392년, 한양 도성 공사 현장</div>
  </div>

  <div id="stick-zone">
    <div id="stick-base"><div id="stick-knob"></div></div>
  </div>
  <button id="act-btn" onclick="Stage.interact()">
    <svg viewBox="0 0 24 24" width="30" height="30" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M4 5.5C4 4.67 4.67 4 5.5 4h13C19.33 4 20 4.67 20 5.5v9c0 .83-.67 1.5-1.5 1.5H9.8l-3.9 3.4c-.5.44-1.27.08-1.27-.58V16h-.13C3.67 16 3 15.33 3 14.5v-9C3 4.67 3.67 4 4.5 4"
        stroke="#2b1d0e" stroke-width="1.6" stroke-linejoin="round" fill="#2b1d0e" fill-opacity="0.06"/>
      <circle cx="8.3" cy="9.8" r="1.15" fill="#2b1d0e"/>
      <circle cx="12" cy="9.8" r="1.15" fill="#2b1d0e"/>
      <circle cx="15.7" cy="9.8" r="1.15" fill="#2b1d0e"/>
    </svg>
  </button>

  <div class="ov center show" id="intro-overlay">
    <div id="intro-panel">
      <div id="intro-text"></div>
      <div id="intro-next">탭하여 계속 ▶</div>
    </div>
  </div>

  <div class="ov" id="dlg-overlay">
    <div id="dlg-panel">
      <div class="dlg-top">
        <div class="dlg-portrait" id="dlg-portrait">👤</div>
        <div>
          <div class="dlg-tag" id="dlg-tag"></div>
          <div class="dlg-name" id="dlg-name"></div>
        </div>
      </div>
      <div class="dlg-box" id="dlg-text"></div>
      <div class="dlg-next" id="dlg-next">계속 <span class="arrow">▶</span></div>
    </div>
  </div>

  <div id="fade"></div>

  <div id="end-screen">
    <div>
      <h2>0화 · 끝</h2>
      <p>정도전: (성벽 너머 어딘가를 바라보며)<br>"…그나저나, 요즘 이방원 나리가 부쩍 날 찾아오시더군.<br>무슨 생각을 하고 계신 건지."</p>
      <p style="margin-top:18px; opacity:.7;">1화 「왕권의 기틀」에서 계속됩니다.</p>
    </div>
  </div>
</div>

<script>
/* ============ 가로모드 고정 (기존 챕터와 동일 트릭) ============ */
const wrapEl = document.getElementById('wrap');
let VW = 800, VH = 600;
/* 모바일 브라우저는 주소창이 늦게 접히거나 펼쳐지면서 innerWidth/innerHeight가
   한 박자 늦게 바뀌는 경우가 있다(특히 iOS Safari). visualViewport가 있으면
   그쪽이 실제 보이는 영역을 더 정확히 반영하므로 우선 사용한다. */
function getViewportSize(){
  if (window.visualViewport) return { w: window.visualViewport.width, h: window.visualViewport.height };
  return { w: window.innerWidth, h: window.innerHeight };
}
function applyOrientation(){
  const { w: iw, h: ih } = getViewportSize();
  const portrait = ih > iw;
  document.body.classList.toggle('rot', portrait);
  VW = portrait ? ih : iw;
  VH = portrait ? iw : ih;
  wrapEl.style.width = VW + 'px';
  wrapEl.style.height = VH + 'px';
  if (window.__phaserGame){
    window.__phaserGame.scale.resize(VW, VH);
  }
}
window.addEventListener('resize', applyOrientation);
window.addEventListener('orientationchange', () => setTimeout(applyOrientation, 80));
if (window.visualViewport){
  window.visualViewport.addEventListener('resize', applyOrientation);
  window.visualViewport.addEventListener('scroll', applyOrientation);
}
setTimeout(applyOrientation, 300);
setTimeout(applyOrientation, 800);
applyOrientation();

/* ============ 맵 데이터: Gemini로 뽑은 배경 한 장 + 손으로 지정한 충돌 영역 ============
   타일맵을 버리고 국가유산 레퍼런스 기반으로 그린 배경 이미지(ch0_bg.png,
   1376x768) 하나를 그대로 깔고, 그 위에 자재 적치장 돌담 구역만 이동 불가
   사각형으로 지정한다(그림에 이미 소품이 다 그려져 있어 타일/소품 시스템은
   더 이상 필요 없음). */
const TS = 64; // 캐릭터 스케일 기준 단위로만 사용(그리드 아님)
const BG_W = 1376, BG_H = 768;
const BARRIERS = [
  // 배경 이미지의 실제 돌담 픽셀 경계를 직접 측정해서 반영(이전 값은 상단
  // 마당 하단이 실제 담장보다 74px, 우측이 17px 더 넓게 잡혀 있어 그림상
  // 걸어갈 수 있어야 할 흙길까지 막고 있었음).
  { x0: 960, y0: 75, x1: 1345, y1: 318 },   // 상단 자재 적치장(돌담)
  { x0: 960, y0: 459, x1: 1345, y1: 672 },  // 하단 자재 적치장(돌담)
];
function isBarrierPx(x, y){
  if (x < 12 || y < 12 || x > BG_W-12 || y > BG_H-12) return true;
  return BARRIERS.some(b => x >= b.x0 && x <= b.x1 && y >= b.y0 && y <= b.y1);
}

/* 좌우 스프라이트 소스가 실제 이동 방향과 반대로 나와서(에셋 라벨링 오차),
   애니메이션/아이들 텍스처 둘 다 이 매핑으로 소스를 바꿔 재생한다. */
const DIR_SRC = { down: 'down', up: 'up', left: 'right', right: 'left' };

/* ============ NPC 데이터 (배경 이미지 위 픽셀 좌표) ============ */
const NPCS = [
  { id:'jeongdojeon', name:'정도전', px:420, py:220, portrait:'assets/portraits/jeongdojeon.png' },
  { id:'worker', name:'인부', px:880, py:420, portrait:'assets/portraits/commoner1.png' },
];

const NPC_DATA = {
  jeongdojeon_0: {
    name:'정도전', icon:'📜', img:'assets/portraits/jeongdojeon.png',
    beats: [
      { t:'어이, 거기 자네. 처음 보는 얼굴인데 — 그냥 구경하러 온 겐가?' },
      { t:'(씩 웃으며) 맞네, 삼봉 정도전일세. 이 새 궁궐 이름도 내가 지었지 — 경복궁(景福宮), \'큰 복을 누리라\'는 뜻으로.' },
      { t:'아무리 훌륭한 임금이라도 대를 이어 계속 훌륭할 순 없는 법이야. 그래서 나는 유능한 신하들이 함께 다스리는 나라를 꿈꾸고 있네.' },
      { t:'나라 이름도 새로 정했지. 아주 오래전 단군왕검이 세운 나라의 이름을 이어받아 — 조선(朝鮮)이라 하기로 했네.' },
    ]
  },
  jeongdojeon_1: {
    name:'정도전', icon:'📜', img:'assets/portraits/jeongdojeon.png',
    beats: [
      { t:'궁궐만 짓는다고 나라가 서는 게 아닐세. 도읍 자리부터 제대로 골라야지.' },
      { t:'전하께서 몸소 무악(毋岳) 땅까지 살피러 다니셨다네. 결국 산이 사방을 둘러싸 방어에 유리하고, 한강이 가까워 물자를 옮기기도 좋은 한양으로 정해졌지.' },
    ]
  },
  jeongdojeon_2: {
    name:'정도전', icon:'📜', img:'assets/portraits/jeongdojeon.png',
    beats: [
      { t:'(성벽 너머 어딘가를 바라보며) …그나저나, 요즘 이방원 나리가 부쩍 날 찾아오시더군.' },
      { t:'무슨 생각을 하고 계신 건지…' },
    ],
    endsChapter: true
  },
  worker_0: {
    name:'인부', icon:'🧱', img:'assets/portraits/commoner1.png',
    beats: [
      { t:'허리 한번 못 펴고 돌을 나르는 중이네. 이 궁궐이 다 지어지면 장관이겠지.' },
    ]
  }
};

/* ============ 오버레이 통합 체크 ============ */
function overlayOpen(){
  return !!document.querySelector('.ov.show') || document.getElementById('end-screen').classList.contains('show');
}

/* ============ 조이스틱 (기존 코드 그대로 재사용) ============ */
const Stick = { dx: 0, dy: 0 };
(function bindStick(){
  const zone = document.getElementById('stick-zone');
  const knob = document.getElementById('stick-knob');
  let activeId = null, cx = 0, cy = 0;
  const R = 44;
  zone.addEventListener('pointerdown', e=>{
    if (activeId !== null) return;
    activeId = e.pointerId;
    try { zone.setPointerCapture(activeId); } catch(err) {}
    const r = zone.getBoundingClientRect();
    cx = r.left + r.width/2; cy = r.top + r.height/2;
    move(e);
  });
  zone.addEventListener('pointermove', move);
  zone.addEventListener('pointerup', end);
  zone.addEventListener('pointercancel', end);
  function move(e){
    if (e.pointerId !== activeId) return;
    let dx = e.clientX - cx, dy = e.clientY - cy;
    const d = Math.hypot(dx, dy);
    if (d > R){ dx = dx/d*R; dy = dy/d*R; }
    knob.style.transform = `translate(${dx}px,${dy}px)`;
    let wx = dx, wy = dy;
    if (document.body.classList.contains('rot')){ wx = dy; wy = -dx; }
    Stick.dx = wx / R; Stick.dy = wy / R;
  }
  function end(e){
    if (e.pointerId !== activeId) return;
    activeId = null;
    Stick.dx = 0; Stick.dy = 0;
    knob.style.transform = 'translate(0,0)';
  }
})();

/* ============ 키보드 입력 ============ */
const Keys = { l:false, r:false, u:false, d:false };
window.addEventListener('keydown', e=>{
  if (e.key === ' ' || e.key === 'Enter'){
    e.preventDefault();
    if (document.getElementById('intro-overlay').classList.contains('show')) { introNext(); return; }
    if (document.getElementById('dlg-overlay').classList.contains('show')) { Dialog.next(); return; }
    Stage.interact();
    return;
  }
  if (overlayOpen()) return;
  if (['ArrowLeft','a','A'].includes(e.key)) Keys.l = true;
  if (['ArrowRight','d','D'].includes(e.key)) Keys.r = true;
  if (['ArrowUp','w','W'].includes(e.key)) Keys.u = true;
  if (['ArrowDown','s','S'].includes(e.key)) Keys.d = true;
});
window.addEventListener('keyup', e=>{
  if (['ArrowLeft','a','A'].includes(e.key)) Keys.l = false;
  if (['ArrowRight','d','D'].includes(e.key)) Keys.r = false;
  if (['ArrowUp','w','W'].includes(e.key)) Keys.u = false;
  if (['ArrowDown','s','S'].includes(e.key)) Keys.d = false;
});

/* ============ Dialog 엔진 ============ */
const Stage = {
  state: { talkStage: 0 },
  paused: false,
  interact(){
    if (document.querySelector('.ov.show')) return;
    const n = window.__nearNpc;
    if (!n) return;
    if (n.id === 'jeongdojeon'){
      const key = 'jeongdojeon_' + Math.min(Stage.state.talkStage, 2);
      Dialog.open(key, n);
    } else if (n.id === 'worker'){
      Dialog.open('worker_0', n);
    }
  },
  endChapter(){
    document.getElementById('end-screen').classList.add('show');
  }
};
const Dialog = {
  key: null, npc: null, idx: 0, data: null,
  open(key, npc){
    this.key = key; this.npc = npc; this.idx = 0;
    this.data = NPC_DATA[key];
    Stage.paused = true;
    document.getElementById('dlg-overlay').classList.add('show');
    document.getElementById('dlg-name').textContent = this.data.name;
    document.getElementById('dlg-tag').textContent = '1392년 · 한양';
    const portraitEl = document.getElementById('dlg-portrait');
    if (this.data.img){
      portraitEl.textContent = '';
      portraitEl.style.backgroundImage = `url('${this.data.img}')`;
    } else {
      portraitEl.style.backgroundImage = 'none';
      portraitEl.textContent = this.data.icon;
    }
    this.render();
  },
  render(){
    const beat = this.data.beats[this.idx];
    document.getElementById('dlg-text').textContent = beat.t;
  },
  next(){
    this.idx++;
    if (this.idx >= this.data.beats.length){ this.finish(); return; }
    this.render();
  },
  finish(){
    document.getElementById('dlg-overlay').classList.remove('show');
    if (this.data.endsChapter){
      Stage.endChapter();
      return;
    }
    Stage.paused = false;
    if (this.npc.id === 'jeongdojeon'){
      Stage.state.talkStage = Math.min(Stage.state.talkStage + 1, 2);
    }
  }
};
document.getElementById('dlg-panel').addEventListener('click', () => Dialog.next());

/* ============ 모던 인트로 ============ */
const INTRO_LINES = [
  '독서실. 형광등 불빛 아래, 한능검 문제집이 책상 위에 펼쳐져 있다.',
  '"조선 전기…태조, 태종, 세종…" 몇 번을 읽어도 이름과 사건이 뒤섞인다.',
  '눈꺼풀이 무거워진다. 시계는 새벽 1시를 가리키고 있었다.',
  '"딱 5분만…" 책상에 엎드린 순간, 눈앞이 흐려진다.',
  '— 그리고 눈을 떴을 때, 사방에서 흙먼지 냄새가 났다.'
];
let introIdx = 0;
function renderIntro(){ document.getElementById('intro-text').textContent = INTRO_LINES[introIdx]; }
function introNext(){
  introIdx++;
  if (introIdx >= INTRO_LINES.length){
    const fade = document.getElementById('fade');
    fade.classList.add('show');
    setTimeout(() => {
      document.getElementById('intro-overlay').classList.remove('show');
      fade.classList.remove('show');
    }, 600);
    return;
  }
  renderIntro();
}
document.getElementById('intro-panel').addEventListener('click', introNext);
renderIntro();

/* ============ Phaser Scene ============ */
class MainScene extends Phaser.Scene {
  constructor(){ super('main'); }
  preload(){
    this.load.image('bg', 'assets/scenes/ch0_bg.png');
    NPCS.forEach(n => { this.load.image('npc_' + n.id, n.portrait); });
    ['down','up','left','right'].forEach(dir => {
      for (let i = 0; i < 3; i++){ this.load.image(`p_${dir}_${i}`, `assets/player/${dir}_${i}.png`); }
    });
  }
  create(){
    this.add.image(0, 0, 'bg').setOrigin(0, 0);
    this.cameras.main.setBounds(0, 0, BG_W, BG_H);

    // NPC: Gemini로 뽑은 배경 제거된 초상화를 그대로 서 있는 스프라이트로 사용
    const NPC_TARGET_H = TS * 1.15;
    const SHADOW_DY = Math.round(NPC_TARGET_H * 0.30);
    this.SHADOW_DY = SHADOW_DY;
    const addShadow = (x, y) => this.add.ellipse(x, y + SHADOW_DY, TS * 0.6, TS * 0.24, 0x000000, 0.35);
    this.npcSprites = {};
    NPCS.forEach(n => {
      const px = n.px, py = n.py;
      const key = 'npc_' + n.id;
      addShadow(px, py);
      const spr = this.add.image(px, py, key);
      const scale = NPC_TARGET_H / spr.height;
      spr.setScale(scale);
      spr.setOrigin(0.5, 0.68);
      spr.y = py;
      this.npcSprites[n.id] = spr;
      // 전산회계오락실 방식: 평소엔 "!"만 떠 있다가, 근접하면 이름으로 바뀐다
      const mark = this.add.text(px, py - NPC_TARGET_H*0.95, '!', {
        fontSize: '20px', color: '#f0c96b', fontStyle: 'bold',
        stroke: '#2b2015', strokeThickness: 3
      });
      mark.setOrigin(0.5); mark.setVisible(false);
      mark.__npcName = n.name;
      spr.__mark = mark;
    });

    // 플레이어: 4방향 걷기 사이클(마젠타 시트에서 추출, 오른쪽은 왼쪽 좌우반전)
    const PLAYER_TARGET_H = TS * 1.15;
    ['down','up','left','right'].forEach(dir => {
      const src = DIR_SRC[dir];
      this.anims.create({
        key: 'walk_' + dir,
        frames: [0,1,2,1].map(i => ({ key: `p_${src}_${i}` })),
        frameRate: 7,
        repeat: -1
      });
    });
    this.playerShadow = addShadow(500, 470);
    this.player = this.add.sprite(500, 470, 'p_down_1');
    const pScale = PLAYER_TARGET_H / this.player.height;
    this.player.setScale(pScale);
    this.player.setOrigin(0.5, 0.68);
    this.player.__dir = 'down';

    this.cameras.main.startFollow(this.player, true, 0.15, 0.15);
    this.cameras.main.setZoom(1.7);

    window.__nearNpc = null;
  }
  update(time, dt){
    if (Stage.paused || overlayOpen()){ return; }
    let vx = Stick.dx, vy = Stick.dy;
    if (Keys.l) vx -= 1;
    if (Keys.r) vx += 1;
    if (Keys.u) vy -= 1;
    if (Keys.d) vy += 1;
    const len = Math.hypot(vx, vy);
    const speed = 220;
    const dtS = Math.min(0.05, dt/1000);
    if (len > 0.05){
      vx/=len; vy/=len;
      const nx = this.player.x + vx*speed*dtS;
      const ny = this.player.y + vy*speed*dtS;
      const pad = 12;
      if (!isBarrierPx(nx-pad, this.player.y-pad) && !isBarrierPx(nx+pad, this.player.y-pad) &&
          !isBarrierPx(nx-pad, this.player.y+pad) && !isBarrierPx(nx+pad, this.player.y+pad)) this.player.x = nx;
      if (!isBarrierPx(this.player.x-pad, ny-pad) && !isBarrierPx(this.player.x+pad, ny-pad) &&
          !isBarrierPx(this.player.x-pad, ny+pad) && !isBarrierPx(this.player.x+pad, ny+pad)) this.player.y = ny;
      const dir = Math.abs(vx) > Math.abs(vy) ? (vx > 0 ? 'right' : 'left') : (vy > 0 ? 'down' : 'up');
      this.player.__dir = dir;
      const animKey = 'walk_' + dir;
      if (!this.player.anims.isPlaying || this.player.anims.currentAnim.key !== animKey){
        this.player.play(animKey);
      }
    } else if (this.player.anims.isPlaying){
      this.player.anims.stop();
      this.player.setTexture('p_' + DIR_SRC[this.player.__dir] + '_1');
    }
    this.playerShadow.x = this.player.x;
    this.playerShadow.y = this.player.y + this.SHADOW_DY;
    // 근접 NPC 판정 — 원거리는 "!", 상호작용 가능 거리에 들어오면 이름으로 전환
    const SHOW_RANGE = TS*3, INTERACT_RANGE = TS*1.7;
    let nearest = null, nearestD = Infinity;
    NPCS.forEach(n => {
      const spr = this.npcSprites[n.id];
      const d = Phaser.Math.Distance.Between(this.player.x, this.player.y, spr.x, spr.y);
      spr.__mark.setVisible(false);
      if (d < nearestD){ nearestD = d; nearest = n; }
    });
    let found = null;
    if (nearest && nearestD < SHOW_RANGE){
      const spr = this.npcSprites[nearest.id];
      spr.__mark.setVisible(true);
      spr.__mark.setText(nearestD < INTERACT_RANGE ? spr.__mark.__npcName : '!');
      if (nearestD < INTERACT_RANGE) found = nearest;
    }
    if (found !== window.__nearNpc){
      window.__nearNpc = found;
      document.getElementById('act-btn').classList.toggle('show', !!found);
    }
  }
}
function drawFigure(g, color, role){
  if (role === 'scholar'){
    g.fillStyle(color, 1);
    g.fillTriangle(15,20, 25,20, 30,44);
    g.fillTriangle(15,20, 10,44, 30,44);
    g.fillStyle(0xf1c79a, 1);
    g.fillCircle(20, 14, 10);
    g.fillStyle(0x1c1a16, 1);
    g.fillEllipse(20, 7, 16, 8);
  } else {
    g.fillStyle(color, 1);
    g.fillRect(11, 20, 18, 24);
    g.fillStyle(0xf1c79a, 1);
    g.fillCircle(20, 14, 10);
  }
  g.fillStyle(0x2b2015, 1);
  g.fillCircle(17, 14, 1.6);
  g.fillCircle(23, 14, 1.6);
}

const config = {
  type: Phaser.AUTO,
  parent: 'game-holder',
  width: VW,
  height: VH,
  backgroundColor: '#bfa374',
  scene: MainScene,
  // Scale.RESIZE는 부모 크기를 getBoundingClientRect()(=화면상 시각적 박스)로 측정하는데,
  // #wrap에 rotate(90deg) 변환이 걸려 있으면 이 박스가 가로/세로가 뒤바뀐 값으로 나와서
  // applyOrientation()이 계산한 올바른 VW/VH를 Phaser가 매번 다시 뒤집어버린다.
  // 그래서 자동 리사이즈를 끄고(NONE), applyOrientation()의 명시적 resize() 호출만 크기를 결정하게 한다.
  scale: { mode: Phaser.Scale.NONE }
};
window.__phaserGame = new Phaser.Game(config);
</script>
