<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>타임슬립 한국사 - 4화 피의 계승</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; word-break: keep-all; overflow-wrap: break-word; }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; overscroll-behavior: none; touch-action: none; background: #000; font-family: "Gowun Batang", -apple-system, "Malgun Gothic", serif; }
  /* 가로모드 고정: 세로로 들면 #wrap 전체를 90도 회전시켜 강제로 가로 화면처럼 사용한다.
     (전산회계오락실 stage1_cost.html과 동일한 트릭 — 회전 상태에서 vh 단위는 실제 뷰포트 기준으로
     어긋나므로 절대 쓰지 않고, 크기는 항상 JS로 계산한 px 값을 쓴다.) */
  #wrap { position: fixed; top: 0; left: 0; touch-action: none; transform-origin: top left; }
  body.rot #wrap { transform: rotate(90deg) translateY(-100%); }
  #game { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  #hud { position: absolute; top: calc(10px + env(safe-area-inset-top)); left: calc(12px + env(safe-area-inset-left));
    color: #f5f0e6; font-size: 14px; text-shadow: 0 1px 3px rgba(0,0,0,.8); z-index: 5; }
  #hud .sub { font-size: 11px; opacity: .75; margin-top: 2px; }

  /* 조이스틱 */
  #stick-zone { position: absolute; left: calc(18px + env(safe-area-inset-left)); bottom: calc(18px + env(safe-area-inset-bottom));
    width: 130px; height: 130px; z-index: 6; touch-action: none; }
  #stick-base { position: absolute; inset: 0; border-radius: 50%; background: rgba(255,255,255,0.12); border: 2px solid rgba(255,255,255,0.25); }
  #stick-knob { position: absolute; width: 52px; height: 52px; left: 39px; top: 39px; border-radius: 50%; background: rgba(255,255,255,0.55); transition: transform .05s linear; }

  /* 대화 버튼 */
  #act-btn { position: absolute; right: calc(22px + env(safe-area-inset-right)); bottom: calc(34px + env(safe-area-inset-bottom));
    width: 68px; height: 68px; border-radius: 50%; border: none; touch-action: none;
    background: #d9a441; color: #2b1d0e; font-size: 26px; box-shadow: 0 4px 10px rgba(0,0,0,.4);
    opacity: 0; pointer-events: none; transition: opacity .15s; z-index: 6; }
  #act-btn.show { opacity: 1; pointer-events: auto; }

  /* 공통 오버레이 */
  .ov { position: absolute; inset: 0; z-index: 20; display: none; align-items: flex-end; justify-content: center; background: rgba(0,0,0,0.45); }
  .ov.show { display: flex; }
  .ov.center { align-items: center; }

  #dlg-frame { position: relative; width: 100%; max-width: 640px; margin: 0 16px calc(16px + env(safe-area-inset-bottom)); }
  #dlg-panel { width: 100%; box-sizing: border-box; background: #201512ee; border: 2px solid #6b3a3a;
    border-radius: 16px; padding: 16px 18px 16px 132px; color: #f0e4d8; box-shadow: 0 8px 24px rgba(0,0,0,.6);
    max-height: var(--dlg-max-h, 80%); overflow-y: auto; min-height: 110px; }
  #quiz-panel, #intro-panel {
    width: 100%; max-width: 640px; margin: 0 16px calc(16px + env(safe-area-inset-bottom)); background: #201512ee; border: 2px solid #6b3a3a;
    border-radius: 16px; padding: 16px 18px; color: #f0e4d8; box-shadow: 0 8px 24px rgba(0,0,0,.6);
    max-height: 80%; overflow-y: auto;
  }
  .dlg-top { margin-bottom: 6px; gap: 6px; }
  .dlg-close { position: absolute; top: 10px; right: 12px; width: 26px; height: 26px; border-radius: 50%;
    border: 1px solid #51432c; background: #2a2013; color: #f5ecd8; font-size: 13px; line-height: 1;
    display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 3; }
  .dlg-portrait { position: absolute; left: 14px; top: -44px; width: 100px; height: 132px; border-radius: 14px;
    background: #4a2b2b; flex: none; display:flex; align-items:center; justify-content:center; font-size:34px;
    background-size: cover; background-position: center top; border: 2px solid #6b3a3a;
    box-shadow: 0 10px 22px rgba(0,0,0,.5); z-index: 2; }
  .dlg-name { font-weight: bold; font-size: 15px; color: #d98c6b; }
  .dlg-tag { font-size: 11px; opacity: .7; }
  .dlg-box { font-size: 18px; line-height: 1.6; min-height: 54px; white-space: pre-wrap; }
  .dlg-nav { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
  .dlg-prev { font-size: 13px; opacity: .55; cursor: pointer; background: none; border: none;
    font-family: inherit; padding: 0; visibility: hidden; }
  .dlg-prev .arrow { display: inline-block; margin-right: 4px; }
  .dlg-next { text-align: right; font-size: 13px; opacity: .8; cursor: pointer; }
  .dlg-next .arrow { display: inline-block; margin-left: 4px; animation: nudge 1s infinite; }
  @keyframes nudge { 0%,100%{transform:translateX(0);} 50%{transform:translateX(4px);} }

  #intro-panel { }
  #intro-text { font-size: 18px; line-height: 1.6; min-height: 40px; white-space: pre-wrap; }
  #intro-next { margin-top: 14px; font-size: 13px; opacity: .8; }

  #quiz-panel { position: relative; }
  .quiz-close { position: absolute; top: 10px; right: 12px; width: 28px; height: 28px; border-radius: 50%;
    border: 1px solid #c9a24a; background: #3a2c1a; color: #f5ecd8; font-size: 14px; line-height: 1;
    display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .quiz-tag { font-size: 12px; color: #d98c6b; margin-bottom: 6px; }
  .quiz-q { font-size: 15px; line-height: 1.5; margin-bottom: 14px; }
  .quiz-opts { display: flex; flex-direction: column; gap: 8px; }
  .quiz-opt { padding: 12px 14px; border-radius: 12px; border: 1px solid #6b3a3a; background: #2c1c1a; color: #f0e4d8;
    font-size: 14px; text-align: left; }
  .quiz-opt.correct { background: #253d2c; border-color: #7faf8b; }
  .quiz-opt.wrong { background: #3d2622; border-color: #d96b5f; }
  .quiz-opt:disabled { opacity: .55; cursor: default; }
  .quiz-fb { margin-top: 10px; font-size: 13px; line-height: 1.5; color: #d8c9a3; min-height: 20px; }
  .quiz-next { text-align: right; margin-top: 10px; font-size: 13px; opacity: 0; cursor: pointer; }
  .quiz-next.show { opacity: .85; }
  /* 기출 출처 배지: 이 문항이 몇 회 몇 번 기출에서 온 것인지 표시(퀴즈 우측 하단). */
  .quiz-src { margin-top: 8px; text-align: right; font-size: 11px; color: #a89372; letter-spacing: .02em; }
  .quiz-src:empty { display: none; }

  #fade { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity .6s; z-index: 30; }
  #fade.show { opacity: 1; pointer-events: auto; }

  /* 대화 완료 팡파레 — 대화(+퀴즈까지) 끝에 한 번 터뜨려서 "여기서 더
     들을 말이 없다"를 분명히 알려준다. 신호가 없으니 끝난 건지 몰라
     같은 사람에게 자꾸 다시 말을 거는 일이 잦다는 신고를 받았다. */
  #fanfare { position: absolute; inset: 0; z-index: 32; display: flex; align-items: center; justify-content: center;
    pointer-events: none; opacity: 0; }
  #fanfare.show { opacity: 1; }
  #fanfare .fc-glow { position: absolute; width: 120px; height: 120px; border-radius: 50%;
    background: radial-gradient(circle, rgba(240,201,107,.55), rgba(240,201,107,0) 70%); }
  #fanfare.show .fc-glow { animation: fc-glow .9s ease-out forwards; }
  @keyframes fc-glow { 0%{ transform:scale(.3); opacity:0; } 30%{ opacity:1; } 100%{ transform:scale(2.4); opacity:0; } }
  #fanfare .fc-spark { position: absolute; width: 7px; height: 7px; background: #f0c96b; opacity: 0;
    clip-path: polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);
    transform: rotate(var(--a)) translate(0,0) scale(.4); }
  #fanfare.show .fc-spark { animation: fc-spark 1s cubic-bezier(.2,.7,.3,1) forwards; }
  @keyframes fc-spark {
    0% { opacity: 0; transform: rotate(var(--a)) translate(0,0) scale(.3); }
    15% { opacity: 1; }
    100% { opacity: 0; transform: rotate(var(--a)) translate(72px,0) scale(1) rotate(180deg); }
  }
  #fanfare .fc-spark:nth-child(1){ --a:0deg; } #fanfare .fc-spark:nth-child(2){ --a:45deg; animation-delay:.03s; }
  #fanfare .fc-spark:nth-child(3){ --a:90deg; } #fanfare .fc-spark:nth-child(4){ --a:135deg; animation-delay:.03s; }
  #fanfare .fc-spark:nth-child(5){ --a:180deg; } #fanfare .fc-spark:nth-child(6){ --a:225deg; animation-delay:.03s; }
  #fanfare .fc-spark:nth-child(7){ --a:270deg; } #fanfare .fc-spark:nth-child(8){ --a:315deg; animation-delay:.03s; }
  #fanfare .fc-label { position: relative; z-index: 1; font-family: "Gowun Batang", serif; font-weight: bold;
    font-size: 17px; color: #fff7e6; padding: 10px 22px; border-radius: 999px; white-space: nowrap;
    background: rgba(40,28,10,.55); border: 1px solid rgba(240,201,107,.5);
    text-shadow: 0 2px 8px rgba(0,0,0,.6), 0 0 16px rgba(240,201,107,.8);
    opacity: 0; transform: scale(.6) translateY(6px); }
  #fanfare.show .fc-label { animation: fc-label 1.15s cubic-bezier(.34,1.56,.64,1) forwards; }
  @keyframes fc-label {
    0% { opacity: 0; transform: scale(.6) translateY(6px); }
    35% { opacity: 1; transform: scale(1.08) translateY(0); }
    55% { transform: scale(1) translateY(0); }
    82% { opacity: 1; }
    100% { opacity: 0; transform: scale(1) translateY(-10px); }
  }

  /* 미니맵 위 작은 메뉴 버튼 — 맵을 하다가 언제든 챕터 목록으로 나가고
     싶어질 수 있으니, 눌러서 나가기·다시 시작·왕조 계보를 바로 쓴다. */
  #menu-btn { position: absolute; top: calc(4px + env(safe-area-inset-top)); right: calc(10px + env(safe-area-inset-right));
    width: 26px; height: 26px; border-radius: 50%; border: none; touch-action: none;
    background: transparent; color: rgba(255,255,255,.9); text-shadow: 0 1px 3px rgba(0,0,0,.7);
    display: flex; align-items: center; justify-content: center; font-size: 15px; z-index: 25; cursor: pointer; padding: 0; }
  #menu-btn:active { color: rgba(255,255,255,.6); }
  #game-menu-panel { background: #1b150e; border: 1px solid #4a3c26; border-radius: 16px; min-width: 250px;
    max-width: 80vw; padding: 18px; display: flex; flex-direction: column; gap: 9px; }
  #game-menu-panel h3 { margin: 0 0 4px; font-size: 15px; color: #f0c96b; text-align: center; font-family: "Gowun Batang", serif; }
  #game-menu-panel a, #game-menu-panel button { display: block; width: 100%; box-sizing: border-box; text-align: center;
    text-decoration: none; background: #2a2013; border: 1px solid #4a3c26; color: #f5ecd8; border-radius: 10px;
    padding: 12px; font-size: 14px; font-family: "Gowun Batang", serif; cursor: pointer; }
  #game-menu-panel a:active, #game-menu-panel button:active { transform: scale(.97); }
  #menu-close-btn { margin-top: 2px; background: transparent !important; border: none !important; color: #8d86a4; font-size: 12px; padding: 4px !important; }

  /* 왕조 계보 모달(index.html과 같은 데이터) — 시대 탭을 눌러 바로 다른
     시대로 넘어갈 수 있게 여기서는 탭을 달았다(챕터 목록에서는 시대 글자를
     눌러 들어오니 탭이 필요 없었지만, 여기는 한 화 안에서 계속 봐야 한다). */
  #kings-modal { position: absolute; inset: 0; z-index: 45; display: none; background: rgba(8,6,4,.72);
    align-items: center; justify-content: center; padding: 14px; }
  #kings-modal.show { display: flex; }
  #kings-panel { background: #1b150e; border: 1px solid #4a3c26; border-radius: 16px;
    width: 100%; height: 100%; max-width: 1040px; display: flex; flex-direction: column; overflow: hidden; }
  #kings-panel .kp-head { flex: none; display: flex; align-items: baseline; justify-content: space-between;
    gap: 10px; padding: 12px 16px 8px; border-bottom: 1px solid #3a2c1a; }
  #kings-panel .kp-head h2 { margin: 0; font-size: 15px; color: #f0c96b; font-family: "Gowun Batang", serif; }
  #kings-close { flex: none; background: #2a2013; border: 1px solid #4a3c26; color: #f5ecd8;
    border-radius: 999px; width: 26px; height: 26px; font-size: 13px; cursor: pointer; line-height: 1; }
  .kp-tabs { flex: none; display: flex; gap: 5px; flex-wrap: wrap; padding: 8px 16px 0; }
  .kp-tabs button { font-family: inherit; font-weight: bold; font-size: 11px; color: #cbb999; background: #2a2013;
    border: 1px solid #4a3c26; border-radius: 999px; padding: 5px 10px; cursor: pointer; }
  .kp-tabs button.active { background: #d9a441; color: #241c12; border-color: #d9a441; }
  #kings-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 10px 16px 16px; }
  .kp-country { margin-bottom: 28px; }
  .kp-country .kp-cname { font-family: "Gowun Batang", serif; font-weight: 700; font-size: 12.5px; color: #e9c979; margin-bottom: 5px; }
  .kp-country .kp-ccount { font-size: 10px; opacity: .55; margin-left: 6px; font-weight: 400; }
  /* 왕들을 잇는 가로 계보선 — 배지를 다 같은 크기로 통일해서 선이
     삐뚤빼뚤하지 않게 하고(예전엔 등급마다 배지 크기가 달라 선을 못
     그렸다), 배지 뒤로 지나가게 z-index를 낮춘다. */
  .kp-strip { display: flex; gap: 0; overflow-x: auto; padding: 8px 8px 8px; align-items: flex-start; -webkit-overflow-scrolling: touch; position: relative; }
  .kp-strip::before { content: ''; position: absolute; left: 24px; right: 24px; top: 24px; height: 2px;
    background: linear-gradient(90deg, transparent, #5a4a30 6%, #5a4a30 94%, transparent); z-index: 0; }
  .kp-king { flex: none; width: 72px; display: flex; flex-direction: column; align-items: center; padding: 0 3px; position: relative; z-index: 1; }
  .kp-king .kp-badge { position: relative; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center;
    justify-content: center; font-weight: 700; font-size: 11.5px; margin-bottom: 7px;
    background: #2a2013; border: 2px solid #4a3c26; color: #9c8d70; }
  .kp-king .kp-nm { font-size: 12px; font-weight: 500; text-align: center; white-space: nowrap; line-height: 1.3; color: #f0e6d2; }
  .kp-king .kp-yr { font-size: 10px; color: #a89878; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .kp-king[data-t="0"] .kp-badge { background: #221a10; border-color: #3a2f1e; color: #6a5c48; }
  .kp-king[data-t="1"] .kp-badge { background: #3a2f1a; border-color: #8a744a; color: #dcc48f; }
  .kp-king[data-t="2"] .kp-badge { background: #4a3512; border-color: #d9a441; color: #f5d488; }
  .kp-king[data-t="3"] .kp-badge { background: #5a3411; border-color: #e0883a; color: #ffd29c; }
  .kp-king[data-t="4"] .kp-badge { background: #7a3512; border-color: #ff9a4a; color: #fff; box-shadow: 0 0 9px rgba(255,144,64,.55); }
  .kp-dupdot { position: absolute; top: -2px; right: -2px; width: 11px; height: 11px; border-radius: 50%; font-size: 6px;
    line-height: 11px; text-align: center; font-weight: 900; color: #1b150e; background: #7fb0a0; border: 1.5px solid #1b150e; }
  #kp-tapinfo { display: none; flex: none; margin: 0 16px 8px; padding: 7px 10px; font-size: 10.5px; line-height: 1.5;
    background: #332411; border: 1px solid #d9a441; border-radius: 8px; color: #f0d9a0; }
  #kp-tapinfo.show { display: block; }
  .kp-noera { padding: 30px 10px; text-align: center; color: #8d86a4; font-size: 13px; line-height: 1.8; }

  #end-screen { position: absolute; inset: 0; z-index: 40; display: none; align-items: center; justify-content: center;
    background: #000; color: #d98c6b; text-align: center; padding: 24px; }
  #end-screen.show { display: flex; }
  #end-screen h2 { font-size: 28px; margin-bottom: 14px; }
  #end-screen p { color: #d8c9a3; font-size: 14px; line-height: 1.7; }
  #end-screen a { display: inline-block; margin: 10px 8px 0; color: #1a1408; background: #d9a441; text-decoration: none;
    padding: 10px 22px; border-radius: 999px; font-size: 14px; font-weight: bold; }
  #end-score { color: #d98c6b; font-size: 15px; margin-top: 14px; white-space: pre-wrap; }

  /* 미니맵: 반드시 #wrap 안에 둬야 한다. #wrap의 rotate(90deg)를 같이 물려받아야
     플레이어가 폰을 돌려서 보는 시야 기준으로 똑바로, 우상단에 놓이기 때문.
     (밖으로 빼서 position:fixed로 "물리적 화면 우상단"에 고정하면, 폰을 돌려
     보는 순간 그 지점은 시야의 좌상단이 되고 게임 화면만 회전돼 있어서
     미니맵만 90도 틀어져 보인다 — 실제로 그렇게 만들었다가 되돌린 부분.) */
  #minimap-canvas { position: absolute; top: calc(32px + env(safe-area-inset-top)); right: calc(10px + env(safe-area-inset-right));
    width: 160px; height: 90px; border: 2px solid #d9a441; border-radius: 8px; z-index: 4;
    box-shadow: 0 2px 8px rgba(0,0,0,.4); background: #1a140c; }

  /* 마지막 대사/보스전까지 다 마쳐도 곧장 챕터가 끝나지 않고, 이 버튼을
     눌러야만 끝난다 — 그 전까지는 계속 돌아다니며 다른 NPC와 대화 가능. */
  #next-chapter-btn { position: absolute; left: 50%; top: calc(14px + env(safe-area-inset-top)); transform: translateX(-50%);
    background: #d9a441; color: #2b1d0e; border: none; border-radius: 999px; padding: 10px 20px;
    font-size: 14px; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,.4);
    opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 7; }
  #next-chapter-btn.show { opacity: 1; pointer-events: auto; }

  /* 구역 이름 배너: 새 맵에 도착하면 화면 상단 가운데에 잠깐 떠서 '여기가 어디인지'를
     알려준다(맵만 바뀌고 이름이 없어 어딘지 모르겠다는 문제). #wrap 안에 두어야
     세로모드 90도 회전을 같이 물려받아 플레이어 시야 기준으로 똑바로 보인다. */
  #zone-banner { position: absolute; left: 50%; top: calc(64px + env(safe-area-inset-top));
    transform: translateX(-50%); z-index: 8; pointer-events: none;
    padding: 8px 22px; border-radius: 999px; white-space: nowrap;
    background: rgba(20,14,8,.62); border: 1px solid rgba(217,164,65,.55);
    color: #f0c96b; font-size: 15px; letter-spacing: .06em;
    text-shadow: 0 1px 4px rgba(0,0,0,.9);
    opacity: 0; transition: opacity .45s ease; }
  #zone-banner.show { opacity: 1; }

  /* 현재 장소 이름 — 미니맵 바로 위에 상시 표시(어느 맵인지 항상 알 수 있게).
     미니맵은 그만큼 아래로 내렸다. 도착 순간의 큰 배너(#zone-banner)와 역할이 다르다. */
  #zone-label { position: absolute; top: calc(10px + env(safe-area-inset-top));
    right: calc(10px + env(safe-area-inset-right)); width: 160px; text-align: center;
    z-index: 4; color: #f0c96b; font-size: 12px; letter-spacing: .04em;
    text-shadow: 0 1px 3px rgba(0,0,0,.9); pointer-events: none; }

  /* 대화 중에 다른 인물이 끼어들면(beat에 name이 따로 붙은 경우) 대화창 색을
     통째로 바꿔 '말하는 사람이 바뀌었다'를 한눈에 보이게 한다. 이름만 바뀌면
     존댓말/반말이 갑자기 뒤섞여 읽히는 것처럼 어색해진다(5화 조식↔이황).
     챕터마다 기본 팔레트가 따뜻한 계열이라, 끼어드는 쪽은 차가운 계열로 잡았다. */
  #dlg-frame.alt-speaker #dlg-panel { background: #17222bee; border-color: #6f9bb5; }
  #dlg-frame.alt-speaker .dlg-name { color: #9fd0e8; }
  #dlg-frame.alt-speaker .dlg-portrait { border-color: #6f9bb5; box-shadow: 0 10px 22px rgba(0,0,0,.5), 0 0 0 2px #6f9bb5; }
  /* 대화창 위에 띄우는 작은 표. 사화처럼 '이름이 넷인데 왕이 누구였나'가
     엉키는 것들은 글로만 읽어서는 안 남아서, 표로 한 번 보여 준다. */
  .dlg-chart { margin: 2px 0 10px; border: 1px solid rgba(255,255,255,.22); border-radius: 8px; overflow: hidden; }
  .dlg-chart[hidden] { display: none; }
  .dlg-chart table { width: 100%; border-collapse: collapse; font-size: 12px; }
  .dlg-chart th, .dlg-chart td { padding: 4px 7px; text-align: left; line-height: 1.35;
    border-bottom: 1px solid rgba(255,255,255,.12); }
  .dlg-chart th { background: rgba(255,255,255,.10); font-weight: bold; white-space: nowrap; }
  .dlg-chart td:first-child { font-weight: bold; white-space: nowrap; }
  .dlg-chart tr:last-child td { border-bottom: 0; }
  .dlg-chart .chart-note { padding: 6px 8px; font-size: 11.5px; line-height:1.45;
    background: rgba(255,255,255,.07); border-top: 1px solid rgba(255,255,255,.12); }
  /* 표가 뜬 칸에서는 대사가 짧아야 한 화면에 다 들어온다. */
  #dlg-panel.has-chart .dlg-box { font-size: 15px; min-height: 0; }
  /* 표 말고도 세 가지를 더 그린다.
     bar  — 비율이나 크기 비교(대동법 확산, 수출액 같은 것)
     flow — 순서가 중요한 것(삼국 통일, 대외 항쟁 차례)
     tree — 갈라져 나가는 것(붕당 계보, 왕위 계승) */
  .dlg-chart .bar-row { display:flex; align-items:center; gap:8px; padding:4px 8px;
    border-bottom:1px solid rgba(255,255,255,.10); font-size:11.5px; }
  .dlg-chart .bar-row:last-of-type { border-bottom:0; }
  .dlg-chart .bar-label { flex:0 0 74px; font-weight:bold; }
  .dlg-chart .bar-track { flex:1; height:14px; border-radius:4px; background:rgba(0,0,0,.35);
    border:1px solid rgba(255,255,255,.14); overflow:hidden; }
  /* 흰색 농도차(10%/45%)만으로는 어두운 패널 위에서 거의 안 보였다(사용자가
     '그래프가 다를 게 없다'고 지적). 앱 전체가 쓰는 금색 강조색으로 바꿔
     트랙(어둡게)과 채움(밝은 금색)이 색 자체로 갈리게 했다. */
  /* <i> 태그는 기본이 inline이라 width/height 스타일이 통째로 무시된다 —
     실제로 이 버그 때문에 채움 막대가 늘 0x0으로 그려져 안 보였다
     (사용자가 '그래프가 다를 게 없다'고 지적해서 찾았다). display:block 필수. */
  .dlg-chart .bar-fill { display:block; height:100%; min-width:3px; background:linear-gradient(90deg,#a97a2c,#f0c96b); }
  .dlg-chart .bar-val { flex:0 0 auto; color:#f0c96b; font-weight:bold; white-space:nowrap; }
  .dlg-chart .flow { display:flex; flex-wrap:wrap; align-items:stretch; gap:5px; padding:8px; }
  .dlg-chart .flow-step { flex:1 1 0; min-width:78px; padding:5px 6px; border-radius:6px;
    background:rgba(255,255,255,.09); border:1px solid rgba(255,255,255,.16); font-size:11.5px; line-height:1.35; }
  .dlg-chart .flow-step b { display:block; font-size:12.5px; margin-bottom:1px; }
  .dlg-chart .flow-arrow { align-self:center; opacity:.55; font-size:12px; }
  .dlg-chart .tree { padding:8px; font-size:11.5px; }
  .dlg-chart .tree-root { display:inline-block; padding:3px 9px; border-radius:6px; font-weight:bold;
    background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.2); }
  .dlg-chart .tree-branch { display:flex; gap:6px; margin-top:6px; }
  .dlg-chart .tree-col { flex:1; border-top:1px solid rgba(255,255,255,.2); padding-top:6px; }
  .dlg-chart .tree-node { padding:3px 7px; border-radius:5px; background:rgba(255,255,255,.09);
    border:1px solid rgba(255,255,255,.16); margin-bottom:4px; }
  .dlg-chart .tree-node b { font-size:12px; }
  .dlg-chart .tree-node span { display:block; opacity:.8; font-size:10.5px; }

  /* 다음 목표 안내 — 배경 위에 그냥 얹힌 작은 글자라 눈에 잘 안 띈다는
     피드백을 받고 글자를 키우고 빛나게 했다. 알약 배경·테두리는 "구려
     보인다"는 피드백으로 뺐다 — 박스 없이 글자 자체가 빛나는 쪽으로. */
  #hud-goal:not(:empty) { font-size: 14px !important; font-weight: 700;
    color: #ffe9a8 !important; opacity: 1 !important;
    animation: hudGoalPulse 1.6s ease-in-out infinite; }
  @keyframes hudGoalPulse {
    0%, 100% { text-shadow: 0 1px 3px rgba(0,0,0,.8); }
    50% { text-shadow: 0 1px 3px rgba(0,0,0,.8), 0 0 10px rgba(255,220,140,.95), 0 0 18px rgba(255,220,140,.6); }
  }
</style>
</head>

<script>
/* 최근 학습한 챕터를 기억해 뒀다가 챕터 목록에서 밝게 표시해 준다. */
try { localStorage.setItem('khg_lastChapter', location.pathname.split('/').pop()); } catch(e){}

/* ============ 기본 설정 ============ */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let VIEW_W = 0, VIEW_H = 0;   // 논리 픽셀 기준 화면 크기(DPR 스케일 전)
/* 그림 파일을 다시 뽑아도 이름이 같으면 브라우저가 옛 캐시를 계속 쓴다.
   초상·스프라이트를 갱신할 때 이 값을 올리면 확실히 새로 받는다.
   (주인공 스프라이트 로더보다 반드시 앞에 있어야 한다 — 뒤에 두면 TDZ 오류) */
const ART_V = '?v=16';   // 새 구역·이벤트

/* 가로모드 고정: 세로 뷰포트면 body에 .rot을 붙여 #wrap을 90도 회전시키고,
   #wrap/canvas 크기는 가로세로를 서로 바꾼 값으로 맞춘다. vh 대신 항상 px로 계산. */
const wrapEl = document.getElementById('wrap');
/* 모바일 브라우저는 주소창이 늦게 접히거나 펼쳐지면서 innerWidth/innerHeight가
   한 박자 늦게 바뀌는 경우가 있다(특히 iOS Safari). visualViewport가 있으면
   그쪽이 실제 보이는 영역을 더 정확히 반영하므로 우선 사용한다. */
function getViewportSize(){
  const vv = window.visualViewport;
  // 핀치줌이 걸리면 vv.width/height가 확대 배율만큼 줄어든다. 그 값을 그대로 쓰면
  // #wrap이 축소되면서 화면이 "확대된 채로" 굳어 되돌릴 수 없었다(실제 발생).
  // 줌이 걸린 동안은 레이아웃 뷰포트를 써서 레이아웃이 줌을 따라가지 않게 한다.
  if (vv && (vv.scale || 1) <= 1.01) return { w: vv.width, h: vv.height };
  return { w: window.innerWidth, h: window.innerHeight };
}

/* ============ 확대(핀치줌·더블탭줌) 차단 ============
   iOS Safari는 접근성 정책상 viewport meta의 user-scalable=no를 무시하므로
   JS로 직접 막는다. 위 getViewportSize의 폴백과 2중 방어. */
['gesturestart','gesturechange','gestureend'].forEach(function(ev){
  document.addEventListener(ev, function(e){ e.preventDefault(); }, { passive: false });
});
document.addEventListener('touchmove', function(e){
  if (e.touches.length > 1) e.preventDefault();          // 두 손가락 = 핀치
}, { passive: false });
var __lastTouchEnd = 0;
document.addEventListener('touchend', function(e){
  var now = Date.now();
  if (now - __lastTouchEnd <= 300) e.preventDefault();   // 더블탭 줌
  __lastTouchEnd = now;
}, { passive: false });
function applyOrientation(){
  const { w: iw, h: ih } = getViewportSize();
  const portrait = ih > iw;
  document.body.classList.toggle('rot', portrait);
  const w = portrait ? ih : iw;
  const h = portrait ? iw : ih;
  wrapEl.style.width = w + 'px';
  wrapEl.style.height = h + 'px';
  document.documentElement.style.setProperty('--dlg-max-h', Math.round(h * 0.8) + 'px');
  // 디스플레이 배율(DPR) 대응: 백킹 스토어를 물리 픽셀만큼 키우고 컨텍스트를 그만큼
  // 스케일해 둔다. 이걸 빼면 캔버스가 논리 픽셀 1배로 그려진 뒤 브라우저가 2~3배로
  // 늘려서 배경/NPC/주인공이 전부 뭉개진다(Phaser의 resolution 옵션과 같은 취지 — 다만 그 옵션은 Phaser 3.16에서 제거돼 실제로는 동작하지 않았고, 그래서 0화도 이 방식으로 옮겼다).
  // 이후 드로잉 코드는 전부 논리 픽셀(VIEW_W/VIEW_H)만 쓰면 된다.
  const dpr = Math.min(3, window.devicePixelRatio || 1);
  VIEW_W = w; VIEW_H = h;
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
}
window.addEventListener('resize', applyOrientation);
window.addEventListener('orientationchange', () => setTimeout(applyOrientation, 80));
if (window.visualViewport){
  window.visualViewport.addEventListener('resize', applyOrientation);
  window.visualViewport.addEventListener('scroll', applyOrientation);
}
// 일부 모바일 브라우저는 주소창이 애니메이션으로 늦게 접혀서, 로드 직후 한 번 더 재확인한다.
setTimeout(applyOrientation, 300);
setTimeout(applyOrientation, 800);
applyOrientation();

/* ============ 구역(zone): 실사 배경 이미지 + 구역별 충돌/NPC/출구 ============
   3화는 궁궐 야간(계유정난) 구역과, 훗날 세조가 회고하며 겹쳐 보여주는 강화도
   유배지 구역, 2곳으로 구성된다. 플레이어가 exits 사각형에 들어가면 다음 구역으로
   페이드 전환된다(젤다식 화면 전환, ch1과 동일 패턴). */
const BG_W = 1376, BG_H = 768, ZOOM = 1.6;
/* 배리어 디버그 격자: URL에 ?debug=1 붙이면 isBarrierPx()가 막힌 곳을
   빨간 점 격자로 표시해서 눈으로 바로 확인할 수 있다(책상 등 가구
   배리어를 배경 그림과 맞춰 잡을 때, 좌표를 눈대중으로 추측하다 계속
   틀렸던 문제의 재발 방지용). */
const DEBUG_GRID = new URLSearchParams(location.search).get('debug') === '1';
const ZONES = {
  gungya: {
    img: 'assets/scenes/ch3_gungya.png', label: '궁궐 야간',
    spawn: { x: 350, y: 500 },
    barriers: [
      { x0:460, y0:0, x1:910, y1:180 },     // 위쪽 전각
      { x0:460, y0:695, x1:910, y1:768 },   // 아래쪽 전각
      { x0:0, y0:0, x1:170, y1:768 },       // 좌측 행각
      { x0:1210, y0:0, x1:1376, y1:768 },   // 우측 행각
    ],
    npcs: [
      { id: 'sejo', name: '세조', x: 650, y: 380, img: 'assets/portraits/sejo.png', look: { role: 'king', body: '#5a1f24', accent: '#b06a3a' } },

// 줄이면서도 png보다 파일이 작다. 아직 변환하지 않은 그림은 png 그대로 뜬다.
const ZONE_BGM = { gungya: 'bgm_joseon_palace', ganghwado: 'bgm_exile', default: 'bgm_joseon_palace' };

}

function isBarrierPx(zoneId, x, y){
  if (x < 6 || y < 6 || x >= BG_W-6 || y >= BG_H-6) return true;
  for (const b of ZONES[zoneId].barriers){ if (x >= b.x0 && x <= b.x1 && y >= b.y0 && y <= b.y1) return true; }
  return false;
}

/* ============ 주인공(학생) 스프라이트: 프로시저럴 실루엣 대신 실사 이미지 사용.
   전 챕터 공통으로 4방향 걷기 시트를 그대로 재사용(같은 인물이므로 전 챕터 공통). */
/* 2026-08-31: 파일 이름을 그림에 맞춰 바꿨다. 예전에는 left_*.png가 오른쪽을
   보고 있어서 여기서 좌우를 바꿔치기(DIR_SRC)해 보정했는데, 그 보정을 모르는
   곳(boss.js)에서 주인공이 보스 반대쪽을 보는 버그가 났다. 이제 이름과 그림이
   같으므로 보정이 없다 — 그냥 방향 이름 그대로 쓴다. */
const DIR_SRC = { down:'down', up:'up', left:'left', right:'right' };
const PLAYER_SPRITES = {};
['down','up','left','right'].forEach(dir => {
  const src = DIR_SRC[dir];
  PLAYER_SPRITES[dir] = [0,1,2].map(i => { const im = new Image(); im.src = `assets/player/${src}_${i}.png` + ART_V; return im; });
});
const DIR_NAME = { u:'up', d:'down', l:'left', r:'right' };
function drawPlayerSprite(px, py, facing, moving){
  ctx.fillStyle = 'rgba(0,0,0,.28)';
  ctx.beginPath(); ctx.ellipse(px, py + 23, 20, 8, 0, 0, Math.PI*2); ctx.fill();
  const dir = DIR_NAME[facing] || 'down';
  const frames = PLAYER_SPRITES[dir];
  const seq = [0, 1, 0, 2];
  const idx = moving ? seq[Math.floor(performance.now()/140) % seq.length] : 0;
  const img = frames[idx];
  if (!img.complete || !img.naturalWidth) return;
  const H = 88, W = H * (img.naturalWidth / img.naturalHeight); // 전 챕터 공통으로 화면상 크기(73.6*줌1.2=88px)로 맞춤
  ctx.drawImage(img, px - W/2, py - H*0.68, W, H);
}


/* ============ NPC 실사 초상 스프라이트: 초상화가 있는 NPC는 프로시저럴
   실루엣 대신 실제 이미지를 필드에도 그린다(0화 Phaser판와 동일하게). */
const NPC_SPRITE_CACHE = {};
function getNpcImg(path){
  if (!NPC_SPRITE_CACHE[path]){ const im = new Image(); im.src = path + ART_V; NPC_SPRITE_CACHE[path] = im; }
  return NPC_SPRITE_CACHE[path];
}
function drawNpcSprite(px, py, imgPath, look){
  ctx.fillStyle = 'rgba(0,0,0,.28)';
  ctx.beginPath(); ctx.ellipse(px, py + 23, 20, 8, 0, 0, Math.PI*2); ctx.fill();
  const img = getNpcImg(imgPath);
  if (!img.complete || !img.naturalWidth){
    // 초상이 아직 없거나(신규 챕터) 로딩 중이면 프로시저럴 실루엣으로 대신 그린다.
    // 예전엔 그냥 return이라 NPC가 통째로 안 보였고, 그림이 준비되기 전에는
    // 대사·퀴즈가 멀쩡한데도 챕터를 검증할 수가 없었다.
    drawCharacter(px, py, 'd', look);
    return;
  }
  const H = 88, W = H * (img.naturalWidth / img.naturalHeight);
  ctx.drawImage(img, px - W/2, py - H*0.68, W, H);
}

/* ============ 캐릭터 드로잉 (역할별 실루엣) ============ */
function drawCharacter(px, py, facing, look){
  const role = (look && look.role) || 'commoner';
  const body = (look && look.body) || '#8a6d3b';
  const accent = (look && look.accent) || '#c9a24a';
  const eo = facing === 'l' ? -2 : facing === 'r' ? 2 : 0;
  ctx.save();
  ctx.translate(px, py);
  ctx.fillStyle = 'rgba(0,0,0,.35)';
  ctx.beginPath(); ctx.ellipse(0, 16, 12, 5, 0, 0, Math.PI*2); ctx.fill();

  if (role === 'king'){
    ctx.fillStyle = body;
    ctx.beginPath();
    ctx.moveTo(-6,-8); ctx.lineTo(6,-8); ctx.lineTo(13,14); ctx.lineTo(-13,14); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = accent; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-6,-8); ctx.lineTo(0,3); ctx.lineTo(6,-8); ctx.stroke();
    ctx.fillStyle = '#f1c79a';
    ctx.beginPath(); ctx.arc(0,-14,10,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#1c1a16';
    ctx.beginPath(); ctx.ellipse(0,-21,9,5,0,Math.PI,0); ctx.fill();
    ctx.fillRect(-9,-22,18,4);
    ctx.beginPath(); ctx.ellipse(-12,-17,5,2,-0.4,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(12,-17,5,2,0.4,0,Math.PI*2); ctx.fill();
  } else if (role === 'general'){
    ctx.fillStyle = body;
    ctx.fillRect(-9,-6,18,20);
    ctx.strokeStyle = 'rgba(0,0,0,.3)'; ctx.lineWidth = 1;
    for (let i=-3;i<=11;i+=4){ ctx.beginPath(); ctx.moveTo(-9,i); ctx.lineTo(9,i); ctx.stroke(); }
    ctx.fillStyle = accent;
    ctx.fillRect(-12,-7,6,6); ctx.fillRect(6,-7,6,6);
    ctx.fillStyle = '#f1c79a';
    ctx.beginPath(); ctx.arc(0,-14,10,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#565a5e';
    ctx.beginPath(); ctx.arc(0,-16,10,Math.PI,0); ctx.fill();
    ctx.fillRect(-10,-16,20,4);
    ctx.fillStyle = accent;
    ctx.beginPath(); ctx.moveTo(0,-27); ctx.lineTo(-2,-32); ctx.lineTo(2,-32); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#6b5636'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(13,-18); ctx.lineTo(13,14); ctx.stroke();
  } else if (role === 'scholar'){
    ctx.fillStyle = body;
    ctx.beginPath();
    ctx.moveTo(-5,-8); ctx.lineTo(5,-8); ctx.lineTo(10,14); ctx.lineTo(-10,14); ctx.closePath(); ctx.fill();
    ctx.fillStyle = accent;
    ctx.fillRect(-10,4,20,3);
    ctx.fillStyle = '#f1c79a';
    ctx.beginPath(); ctx.arc(0,-14,10,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#1c1a16';
    ctx.beginPath(); ctx.ellipse(0,-21,8,5,0,Math.PI,0); ctx.fill();
    ctx.fillRect(-8,-22,16,4);
    ctx.fillRect(-14,-19,6,2);
    ctx.fillRect(8,-19,6,2);
  } else {
    ctx.fillStyle = body;
    ctx.fillRect(-9,-6,18,20);
    ctx.strokeStyle = accent; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-9,-6); ctx.lineTo(0,2); ctx.lineTo(9,-6); ctx.stroke();
    ctx.fillStyle = '#f1c79a';
    ctx.beginPath(); ctx.arc(0,-14,10,0,Math.PI*2); ctx.fill();
    if (look && look.headband){
      ctx.fillStyle = accent;
      ctx.fillRect(-10,-18,20,3);
    }
  }

  ctx.fillStyle = '#2b2015';
  ctx.beginPath(); ctx.arc(eo-3,-14,1.4,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(eo+3,-14,1.4,0,Math.PI*2); ctx.fill();
  ctx.restore();
}

function showZoneBanner(text){
  const el = document.getElementById('zone-banner');
  if (!el || !text) return;
  el.textContent = text;
  el.classList.add('show');
  clearTimeout(el.__t);
  el.__t = setTimeout(() => el.classList.remove('show'), 2200);
}

/* 대화(+퀴즈) 끝에 한 번 터뜨리는 팡파레. Dialog.afterQuiz()에서 부른다.
   재입장해도(재방문 시 같은 대화가 다시 나오므로) 매번 같은 신호를
   줘서 "여기서 더 들을 말이 없다"를 분명히 알린다. */
function playFanfare(text){
  BGM.playOnce('sfx_fanfare');
  const el = document.getElementById('fanfare');
  if (!el) return;
  const label = document.getElementById('fc-label');
  if (label) label.textContent = text || '대화 완료';
  el.classList.remove('show');
  void el.offsetWidth; // 애니메이션 재시작을 위한 강제 리플로우
  el.classList.add('show');
  clearTimeout(el.__t);
  el.__t = setTimeout(() => el.classList.remove('show'), 1300);
}

const KINGS_ERA_ORDER = ["선사·초기국가","고대","고려","조선 전기","조선 후기","근대·개항기"];
const KINGS_BY_ERA = {};
KINGS_DATA.forEach(([era, country, kings]) => {
  (KINGS_BY_ERA[era] = KINGS_BY_ERA[era] || []).push([country, kings]);
});
const KINGS_NAME_GROUPS = {};
KINGS_DATA.forEach(([era, country, kings]) => {
  kings.forEach(k => { (KINGS_NAME_GROUPS[k.name] = KINGS_NAME_GROUPS[k.name] || []).push({ ...k, era, country }); });
});
let kingsCurrentEra = null;
function kingsTier(n){ return n === 0 ? 0 : n <= 3 ? 1 : n <= 8 ? 2 : n <= 15 ? 3 : 4; }
function kingsJosa(word, withB, noB){
  const code = word.charCodeAt(word.length - 1) - 0xAC00;
  if (code < 0 || code > 11171) return word + noB;
  return word + (code % 28 ? withB : noB);
}
function kingsDupOthers(name, era, country, year){
  const group = KINGS_NAME_GROUPS[name];
  if (!group || group.length < 2) return null;
  const others = group.filter(o => !(o.era === era && o.country === country && o.year === year));
  return others.length ? others : null;
}
function kingsDupDot(name, era, country, year){
  const others = kingsDupOthers(name, era, country, year);
  if (!others) return '';
  const list = others.map(o => `${o.country} ${o.name}(${o.year}, ${o.n}회)`).join(' / ');
  const title = (kingsJosa(name, '과', '와') + ` 같은 이름의 다른 왕이 있습니다: ${list}`).replace(/"/g, '&quot;');
  return `<span class="kp-dupdot" title="${title}" data-tip="${title}">동</span>`;
}
function selectKingsEra(era){
  kingsCurrentEra = era;
  document.querySelectorAll('#kp-tabs button').forEach(b => b.classList.toggle('active', b.dataset.era === era));
  document.getElementById('kp-title').textContent = era + ' 왕 계보';
  const body = document.getElementById('kings-body');
  const groups = KINGS_BY_ERA[era];
  if (!groups){
    body.innerHTML = '<div class="kp-noera">이 시대는 왕이 없습니다.<br>(일제강점기·현대처럼 왕조가 아닌 시대예요)</div>';
    return;
  }
  let html = '';
  groups.forEach(([country, kings]) => {
    const total = kings.reduce((s, k) => s + k.n, 0);
    html += `<div class="kp-country"><span class="kp-cname">${country}<span class="kp-ccount">· 왕 ${kings.length}명 · 출제 합계 ${total}회</span></span>
      <div class="kp-strip">` + kings.map(k => `
        <div class="kp-king" data-t="${kingsTier(k.n)}">
          <div class="kp-badge">${k.n}${kingsDupDot(k.name, era, country, k.year)}</div>
          <div class="kp-nm">${k.name}</div>
          <div class="kp-yr">${k.year}</div>
        </div>`).join('') + `</div></div>`;
  });
  body.innerHTML = html;
}

const World = {
  zone: 'gungya', px: ZONES.gungya.spawn.x, py: ZONES.gungya.spawn.y,
  facing: 'd', speed: 165, // 화면상 속도 = speed*ZOOM(1.6) ≈ 264px/s로 전 챕터 동일
  stick: { active: false, dx: 0, dy: 0 },
  keys: { l:false, r:false, u:false, d:false },
  paused: false,
  transitioning: false,
  moving: false,
  nearNpc: null,
  lastT: 0,

  canStand(x, y){
    const pad = 16;
    if (isBarrierPx(this.zone, x-pad, y-pad) || isBarrierPx(this.zone, x+pad, y-pad) ||
        isBarrierPx(this.zone, x-pad, y+pad) || isBarrierPx(this.zone, x+pad, y+pad)) return false;
    for (const n of ZONES[this.zone].npcs){ if (Math.hypot(n.x - x, n.y - y) < 34) return false; }
    return true;
  },

  update(dt){
    if (this.paused || this.transitioning || overlayOpen()) return;
    let vx = this.stick.dx, vy = this.stick.dy;
    if (this.keys.l) vx -= 1;
    if (this.keys.r) vx += 1;
    if (this.keys.u) vy -= 1;
    if (this.keys.d) vy += 1;
    const len = Math.hypot(vx, vy);
    this.moving = len > 0.05;
    if (this.moving){
      vx /= len; vy /= len;
      if (Math.abs(vx) > Math.abs(vy)) this.facing = vx > 0 ? 'r' : 'l';
      else this.facing = vy > 0 ? 'd' : 'u';
      const nx = this.px + vx * this.speed * dt;
      const ny = this.py + vy * this.speed * dt;
      if (this.canStand(nx, this.py)) this.px = nx;
      if (this.canStand(this.px, ny)) this.py = ny;
    }
    this.checkExit();
    this.checkNpc();
  },

  /* 구역 경계(exits) 사각형에 들어가면 다음 구역으로 페이드 전환(젤다식 화면 전환) */
  checkExit(){
    for (const e of ZONES[this.zone].exits){
      const r = e.rect;
      if (this.px >= r.x0 && this.px <= r.x1 && this.py >= r.y0 && this.py <= r.y1){
        this.goToZone(e.to, e.spawn);
        return;
      }
    }
  },
  goToZone(zoneId, spawn){
    this.transitioning = true;
    const fade = document.getElementById('fade');
    fade.classList.add('show');
    setTimeout(() => {
      this.zone = zoneId;
      BGM.play(ZONE_BGM[zoneId] || ZONE_BGM.default);
      this.px = spawn.x; this.py = spawn.y;
      showZoneBanner(ZONES[zoneId].label);
      this.nearNpc = null;
      document.getElementById('act-btn').classList.remove('show');
      const sub = document.querySelector('#hud .sub');
      if (sub) sub.textContent = ZONES[zoneId].label;
      setTimeout(() => {
        fade.classList.remove('show');
        this.transitioning = false;
      }, 60);
    }, 600);
  },

  checkNpc(){
    // 전 챕터 공통으로 2단계 거리(멀면 !, 가까우면 이름)로 통일
    const SHOW_RANGE = 192, INTERACT_RANGE = 108.8;
    let shown = null, best = SHOW_RANGE;
    for (const n of ZONES[this.zone].npcs){
      const d = Math.hypot(n.x - this.px, n.y - this.py);
      if (d < best){ best = d; shown = n; }
    }
    this.nearNpcShown = shown;
    this.nearNpcClose = (shown && best < INTERACT_RANGE) ? shown : null;
    const found = this.nearNpcClose;
    if (found !== this.nearNpc){
      this.nearNpc = found;
      const btn = document.getElementById('act-btn');
      if (found) btn.classList.add('show'); else btn.classList.remove('show');
    }
    if (window.Items) Items.checkSpot(this);
  },

  render(){
    const img = zoneImgs[this.zone];
    const viewW = VIEW_W / ZOOM, viewH = VIEW_H / ZOOM;
    const camX = Math.max(0, Math.min(Math.max(0, BG_W - viewW), this.px - viewW/2));
    const camY = Math.max(0, Math.min(Math.max(0, BG_H - viewH), this.py - viewH/2));
    ctx.fillStyle = '#1a140c';
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);
    if (img && img.complete && img.naturalWidth){
      const srcW = Math.min(viewW, BG_W), srcH = Math.min(viewH, BG_H);
      // 배경 그림이 BG_W보다 클 수 있다(2배 webp). 잘라낼 구간도 같은 배로 키운다 —
      // 안 그러면 그림의 왼쪽 위 1/4만 확대돼서 나온다.
      const s = img.naturalWidth / BG_W;
      ctx.drawImage(img, camX*s, camY*s, srcW*s, srcH*s, 0, 0, srcW*ZOOM, srcH*ZOOM);
    } else {
      // 배경 그림이 아직 없는 구역 — 격자 바닥과 안내를 대신 그려서, 그림이
      // 준비되기 전에도 대사·퀴즈·이동을 그대로 확인할 수 있게 한다.
      ctx.save(); ctx.scale(ZOOM, ZOOM);
      ctx.strokeStyle = 'rgba(255,255,255,.06)'; ctx.lineWidth = 1;
      for (let gx = -(camX % 64); gx < viewW; gx += 64){ ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, viewH); ctx.stroke(); }
      for (let gy = -(camY % 64); gy < viewH; gy += 64){ ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(viewW, gy); ctx.stroke(); }
      ctx.fillStyle = 'rgba(240,201,107,.5)';
      ctx.font = 'bold 13px "Gowun Batang", serif'; ctx.textAlign = 'center';
      ctx.fillText('배경 그림 준비 중 — ' + (ZONES[this.zone].label || ''), viewW/2, 26);
      ctx.restore();
    }
    const zone = ZONES[this.zone];
    ctx.save();
    ctx.scale(ZOOM, ZOOM);
    for (const n of zone.npcs){ if (!n.img) drawCharacter(n.x - camX, n.y - camY, 'd', n.look); }
    ctx.restore();
    for (const n of zone.npcs){ if (n.img) drawNpcSprite((n.x - camX) * ZOOM, (n.y - camY) * ZOOM, n.img); }
    drawPlayerSprite((this.px - camX) * ZOOM, (this.py - camY) * ZOOM, this.facing, this.moving);
    if (this.nearNpcShown){
      const n = this.nearNpcShown;
      const sx = (n.x - camX) * ZOOM, sy = (n.y - camY) * ZOOM;
      if (n === this.nearNpcClose){
        drawNpcLabel(n.name, sx, sy - 66, '#d98c6b');
      } else {
        const key = Stage.keyFor(n.id);
        if (!key || !seenDialogKeys.has(key)) drawNpcLabel('!', sx, sy - 66, '#d98c6b');
      }
    }
    if (DEBUG_GRID){
      const step = 16;
      for (let gx = 0; gx < BG_W; gx += step){
        for (let gy = 0; gy < BG_H; gy += step){
          if (!isBarrierPx(this.zone, gx, gy)) continue;
          const sx2 = (gx - camX) * ZOOM, sy2 = (gy - camY) * ZOOM;
          if (sx2 < -step*ZOOM || sx2 > VIEW_W || sy2 < -step*ZOOM || sy2 > VIEW_H) continue;
          ctx.fillStyle = 'rgba(255,40,40,0.45)';
          ctx.fillRect(sx2 - 2, sy2 - 2, 4, 4);
        }
      }
      ctx.fillStyle = '#fff'; ctx.font = 'bold 12px monospace'; ctx.textAlign = 'left';
      ctx.fillText(`DEBUG px:(${Math.round(this.px)},${Math.round(this.py)}) zone:${this.zone}`, 6, VIEW_H - 8);
    }
    const vg = ctx.createRadialGradient(VIEW_W/2, VIEW_H/2, VIEW_H*0.25, VIEW_W/2, VIEW_H/2, VIEW_H*0.8);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, 'rgba(0,0,0,.4)');
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, VIEW_W, VIEW_H);
  }
};

/* 조이스틱 입력 (Pointer Events 통일) */
(function bindStick(){
  const zone = document.getElementById('stick-zone');
  const knob = document.getElementById('stick-knob');
  let activeId = null, cx = 0, cy = 0;
  const R = 44;
  zone.addEventListener('pointerdown', e=>{
    if (activeId !== null) return;
    activeId = e.pointerId;
    try { zone.setPointerCapture(activeId); } catch(err) {}
    const r = zone.getBoundingClientRect();
    cx = r.left + r.width/2; cy = r.top + r.height/2;
    World.stick.active = true;
    move(e);
  });
  zone.addEventListener('pointermove', move);
  zone.addEventListener('pointerup', end);
  zone.addEventListener('pointercancel', end);
  function move(e){
    if (e.pointerId !== activeId) return;
    let dx = e.clientX - cx, dy = e.clientY - cy;
    const d = Math.hypot(dx, dy);
    if (d > R){ dx = dx/d*R; dy = dy/d*R; }
    let wx = dx, wy = dy;
    if (document.body.classList.contains('rot')){ wx = dy; wy = -dx; }
    // 조이스틱 손잡이는 #wrap 안에 있어서 translate가 '회전된' 좌표계로
    // 해석된다. 화면 델타(dx,dy)를 그대로 주면 손잡이만 90도 틀어져
    // 보인다(이동은 멀쩡한데 손잡이만 오른쪽으로 꺾이던 문제). 이동에
    // 쓰는 값과 똑같은 wx,wy로 그려서 손가락·주인공·손잡이를 일치시킨다.
    knob.style.transform = `translate(${wx}px,${wy}px)`;
    World.stick.dx = wx / R; World.stick.dy = wy / R;
  }
  function end(e){
    if (e.pointerId !== activeId) return;
    activeId = null;
    World.stick.active = false; World.stick.dx = 0; World.stick.dy = 0;
    knob.style.transform = 'translate(0,0)';
  }
})();

    e.preventDefault();
    if (document.getElementById('intro-overlay').classList.contains('show')) { introNext(); return; }
    if (document.getElementById('dlg-overlay').classList.contains('show')) { Dialog.next(); return; }
    if (document.getElementById('quiz-overlay').classList.contains('show')) { Quiz.confirmIfReady(); return; }
    Stage.interact();
    return;
  }
  if (overlayOpen()) return;
  if (['ArrowLeft','a','A'].includes(e.key)) World.keys.l = true;
  if (['ArrowRight','d','D'].includes(e.key)) World.keys.r = true;
  if (['ArrowUp','w','W'].includes(e.key)) World.keys.u = true;
  if (['ArrowDown','s','S'].includes(e.key)) World.keys.d = true;
});
window.addEventListener('keyup', e=>{
  if (['ArrowLeft','a','A'].includes(e.key)) World.keys.l = false;
  if (['ArrowRight','d','D'].includes(e.key)) World.keys.r = false;
  if (['ArrowUp','w','W'].includes(e.key)) World.keys.u = false;
  if (['ArrowDown','s','S'].includes(e.key)) World.keys.d = false;
});

/* ============ 절정 — 이 화의 마지막을 지키는 사람 ============
   문제는 이 화에서 이미 푼 것들 중에서 골라 낸다(boss.js의 fromChapter).
   보스전은 그 화에서 배운 것을 시험하는 자리이므로 복습이 되는 편이 맞다. */
function startChapterBoss(onDone){
  if (!window.Boss){ onDone(); return; }
  const qs = Boss.fromChapter(typeof NPC_DATA !== 'undefined' ? NPC_DATA : null, 5);
  if (!qs.length){ onDone(); return; }
  World.paused = true;
  Boss.start({
    name: '세조',
    img: 'assets/boss/sejo.png',
    bg: 'assets/scenes/ch3_gungya.webp',
    hp: qs.length, lives: 3,
    questions: qs,
    intro: '세조가 곤룡포 자락을 여미며 돌아본다.',
    onWin: () => { World.paused = false; onDone(); },
    onLose: () => { World.paused = false; },   // 다시 도전할 수 있다
  });
}

const Stage = {
  state: { sejoStage: 0, bossDone: false },
  keyFor(id){
    if (id === 'sejo') return Stage.state.bossDone ? 'sejo_repeat' : 'sejo_' + Math.min(Stage.state.sejoStage, 3);
    if (id === 'attendant') return 'attendant_0';
    if (id === 'danjong') return 'danjong_0';
    if (id === 'seongsammun') return 'seongsammun_0';
    return null;
  },
  interact(){
    if (overlayOpen()) return;
    // 가까이에 탐색 지점이 있으면 대화가 아니라 탐색이 먼저다
    if (window.Items && Items.trySearch(World)) return;
    const n = World.nearNpc;
    if (!n) return;
    const key = Stage.keyFor(n.id);
    if (key) Dialog.open(key, n);
  }
};

const seenDialogKeys = new Set();
/* 대화창 위 시각자료. 종류를 안 주면 표로 그린다. */
function drawChart(c){
  if (c.type === 'bar'){
    // 데이터가 이미 퍼센트(예: 인구 비율)면 c.max:100을 준다 — 안 주면 이
    // 묶음 안에서 제일 큰 값을 기준으로 상대 비교한다(예: 경공업 대 중화학
    // 처럼 절대치가 아니라 서로 견주는 게 목적인 데이터). c.max를 빠뜨리면
    // '70%'가 이 데이터의 최댓값이라는 이유만으로 막대가 꽉 차 버려서,
    // 마치 70%가 100%인 것처럼 보이는 오해가 생긴다(실제로 지적받은 문제).
    const max = c.max || Math.max.apply(null, c.bars.map(b => b.v));
    return c.bars.map(b =>
      '<div class="bar-row"><div class="bar-label">' + b.label + '</div>'
      + '<div class="bar-track"><i class="bar-fill" style="width:' + Math.round(b.v / max * 100) + '%"></i></div>'
      + '<div class="bar-val">' + (b.text || b.v) + '</div></div>').join('');
  }
  if (c.type === 'flow'){
    return '<div class="flow">' + c.steps.map((s, i) =>
      (i ? '<div class="flow-arrow">▶</div>' : '')
      + '<div class="flow-step"><b>' + s.t + '</b>' + (s.s || '') + '</div>').join('') + '</div>';
  }
  if (c.type === 'tree'){
    return '<div class="tree"><div class="tree-root">' + c.root + '</div><div class="tree-branch">'
      + c.cols.map(col => '<div class="tree-col">' + col.map(n =>
          '<div class="tree-node"><b>' + n.t + '</b>' + (n.s ? '<span>' + n.s + '</span>' : '') + '</div>'
        ).join('') + '</div>').join('') + '</div></div>';
  }
  return '<table><thead><tr>' + c.head.map(h => '<th>' + h + '</th>').join('')
    + '</tr></thead><tbody>'
    + c.rows.map(r => '<tr>' + r.map(v => '<td>' + v + '</td>').join('') + '</tr>').join('')
    + '</tbody></table>';
}

/* NPC 이름표. 예전에는 글자만 챕터 색으로 찍었는데, 흙바닥이나 마루처럼
   비슷한 밝기 위에서는 읽히지가 않았다(5화 서원 마당에서 붉은 글씨가
   묻혀 버렸다). 어두운 알약을 깔고 밝은 글씨를 올려 배경을 안 탄다. */
function drawNpcLabel(text, sx, sy, accent){
  ctx.font = 'bold 15px "Gowun Batang", -apple-system, sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const padX = 9, h = 24, w = Math.max(h, ctx.measureText(text).width + padX * 2);
  const x = sx - w / 2, y = sy - h / 2, r = h / 2;
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
  ctx.fillStyle = 'rgba(18,14,10,.78)';
  ctx.fill();
  ctx.lineWidth = 1.5;
  ctx.strokeStyle = accent;
  ctx.stroke();
  ctx.fillStyle = '#f5ecd8';
  ctx.fillText(text, sx, sy + 0.5);
  ctx.textBaseline = 'alphabetic';
}

const Dialog = {
  key: null, npc: null, idx: 0, data: null,
  close(){ document.getElementById('dlg-overlay').classList.remove('show'); World.paused = false; },
  open(key, npc){
    this.key = key; this.npc = npc; this.idx = 0; this._missedAny = false;
    this.data = NPC_DATA[key];
    // 신분에 따라 이 인물이 나를 맞이하는 첫마디가 달라진다. 원본 NPC_DATA를
    // 고치면 다음 대화에 인사가 쌓이므로, 얕은 복사본의 beats 앞에만 붙인다.
    if (window.Rank && npc && npc.look && npc.look.role){
      const greet = Rank.greetingFor(npc.look.role);
      if (greet) this.data = Object.assign({}, this.data,
        { beats: [{ who:'npc', t: greet }].concat(this.data.beats) });
    }
    seenDialogKeys.add(key);
    World.paused = true;
    document.getElementById('dlg-overlay').classList.add('show');
    document.getElementById('dlg-tag').textContent = '1453~1468년 · 조선';
    this.render();
  },
  render(){
    const beat = this.data.beats[this.idx];
    const prevEl = document.getElementById('dlg-prev');
    if (prevEl) prevEl.style.visibility = this.idx > 0 ? 'visible' : 'hidden';
    // 이 beat만 다른 인물이 말하는가? (beats에 name이 따로 붙어 있으면 끼어든 것)
    const interjecting = !!beat.name && beat.name !== this.data.name;
    document.getElementById('dlg-frame').classList.toggle('alt-speaker', interjecting);
    document.getElementById('dlg-name').textContent = beat.name || this.data.name;
    const portraitEl = document.getElementById('dlg-portrait');
    const img = beat.img || this.data.img;
    if (img){ portraitEl.textContent = ''; portraitEl.style.backgroundImage = `url('${img}${ART_V}')`; }
    else { portraitEl.style.backgroundImage = 'none'; portraitEl.innerHTML = beat.icon || this.data.icon; }
    const chartEl = document.getElementById('dlg-chart');
    if (beat.chart){
      const c = beat.chart;
      chartEl.innerHTML = drawChart(c)
        + (c.note ? '<div class="chart-note">' + c.note + '</div>' : '');
      chartEl.hidden = false;
    } else { chartEl.hidden = true; chartEl.innerHTML = ''; }
    document.getElementById('dlg-panel').classList.toggle('has-chart', !!beat.chart);
    document.getElementById('dlg-text').textContent = beat.t;
  },
  next(){
    this.idx++;
    if (this.idx >= this.data.beats.length){ this.finish(); return; }
    this.render();
  },
  prev(){
    if (this.idx <= 0) return;
    this.idx--;
    this.render();
  },
  finish(){
    document.getElementById('dlg-overlay').classList.remove('show');
    if (this.data.quizSeq){
      Quiz.openSequence(this.data.quizSeq, () => this.afterQuiz());
    } else if (this.data.quiz){
      Quiz.open(this.data.quiz, () => this.afterQuiz());
    } else {
      this.afterQuiz();
    }
  },
  afterQuiz(){
    if (this.data.startsBoss){
      BGM.play('bgm_boss_quiz', {fadeMs:500});
      Quiz.openSequence(BOSS_QUESTIONS, (score, total) => Stage.finishBoss(score, total));
      return;
    }
    World.paused = false;
    // 대화·퀴즈가 열려 있던 동안 화면이 잠깐 백그라운드로 갔다 오는 등의
    // 이유로 배경음악이 끊기거나 다른 트랙처럼 들리는 제보가 있어, 대화가
    // 끝날 때마다 이 구역의 정식 배경음악을 다시 한 번 틀어 준다(이미
    // 맞는 트랙이 재생 중이면 BGM.play()가 그냥 조용히 무시한다).
    BGM.play(ZONE_BGM[World.zone] || ZONE_BGM.default);
    const prevKey = this.key;
    if (this.npc.id === 'sejo'){
      Stage.state.sejoStage = Math.min(Stage.state.sejoStage + 1, 3);
    }
    if (Stage.keyFor(this.npc.id) === prevKey) playFanfare('대화 완료');
    // 이 인물의 퀴즈 대화를 다 끝냈으면 인물 카드를 얻는다
    if (window.Heroes && this.npc) Heroes.recordTalk(this.npc.id, this.key, !!this._missedAny);
    // 이 대화에 걸린 속보가 있으면 띄운다(없으면 조용히 넘어간다)
    if (window.News) News.fire(this.key);
  }
};

/* 기출 출처 표기: data.src에 회차 번호 배열(예: [51,55])을 넣으면
   2개까지는 그대로 나열하고, 3개 이상이면 "51회 등 6개 회차"로 줄인다
   (사화처럼 15개 회차에 걸친 개념을 다 나열하면 읽을 수 없기 때문).
   문자열을 넣으면 그대로 출력한다. */
function formatQuizSrc(src){
  if (!src) return '';
  if (typeof src === 'string') return '기출 출처 · ' + src;
  const rounds = [...src].sort((a, b) => a - b);
  if (!rounds.length) return '';
  const body = rounds.length <= 2
    ? rounds.join(', ') + '회'
    : `${rounds[0]}회 등 ${rounds.length}개 회차`;
  return '기출 출처 · ' + body;
}

/* ============ Quiz 엔진 (단일 확인퀴즈 + 보스전 연속퀴즈 공용) ============ */
const Quiz = {
  data: null, onDone: null, answered: false, optButtons: [],
  seq: null, seqIdx: 0, seqScore: 0, seqOnDone: null,

  open(data, onDone){
    this.seq = null;
    this._openOne(data, onDone);
  },
  openSequence(list, onAllDone){
    this.seq = list; this.seqIdx = 0; this.seqScore = 0; this.seqOnDone = onAllDone;
    this._openOne(this.seq[0], () => this._seqAdvance());
  },
  abort(){
    // 보스전/퀴즈를 중간에 그만두고 싶을 때(우상단 X) — 점수 집계 없이 그냥 닫는다.
    document.getElementById('quiz-overlay').classList.remove('show');
    this.seq = null; this.data = null; this.onDone = null; this.seqOnDone = null;
    World.paused = false;
  },
  _seqAdvance(){
    // 마지막 문항을 끝낸 뒤 한 번 더 불리면 this.seq가 null이라 터진다.
    // 실제로 자동 점검(_smoke.html)에서 잡혔다.
    if (!this.seq) return;
    this.seqIdx++;
    if (this.seqIdx >= this.seq.length){
      const score = this.seqScore, total = this.seq.length;
      this.seq = null;
      this.seqOnDone && this.seqOnDone(score, total);
      return;
    }
    this._openOne(this.seq[this.seqIdx], () => this._seqAdvance());
  },
  _openOne(data, onDone){
    this.data = data; this.onDone = onDone; this.answered = false; this._missed = false;
    document.getElementById('quiz-overlay').classList.add('show');
    document.getElementById('quiz-tag').textContent = this.seq ? `${this.seqIdx+1}/${this.seq.length}` : '확인 퀴즈';
    document.getElementById('quiz-q').textContent = data.q;
    document.getElementById('quiz-fb').textContent = '';
    document.getElementById('quiz-next').classList.remove('show');
    document.getElementById('quiz-src').textContent = formatQuizSrc(data.src);
    // 모든 퀴즈 데이터가 answer:0(첫 번째 보기)으로 통일 작성돼 있어서
    // 화면에 그대로 노출하면 정답이 항상 1번으로 예측 가능해짐 — 매번
    // 보기 순서를 섞어서 표시하고, order[화면순서]=원본인덱스로 매핑해둔다.
    this.order = data.opts.map((_, i) => i);
    for (let i = this.order.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [this.order[i], this.order[j]] = [this.order[j], this.order[i]];
    }
    const opts = document.getElementById('quiz-opts');
    opts.innerHTML = '';
    this.optButtons = this.order.map((origIdx, i) => {
      const b = document.createElement('button');
      b.className = 'quiz-opt';
      b.textContent = (i+1) + '. ' + data.opts[origIdx];
      b.onclick = () => this.pick(i);
      opts.appendChild(b);
      return b;
    });
  },
  pick(i){
    if (this.answered) return;
    const origIdx = this.order[i];
    const correct = origIdx === this.data.answer;
    if (correct){
      // 정답을 고르면 확정하고 다음 문제로 넘어갈 수 있게 한다.
      this.answered = true;
      if (this.seq) this.seqScore++;
      if (window.Badges) Badges.addCorrect();
      const _m = window.Juice ? Juice.xpMul() : 1;
      if (window.Rank) Rank.addXp((this._missed ? 3 : 10) * _m,
        (this._missed ? '정답' : '첫 시도 정답') + (_m > 1 ? ' · 피버 2배' : ''));
      if (window.Juice) Juice.correct(!this._missed);
      if (window.Srs && typeof Dialog !== 'undefined' && Dialog.key)
        Srs.hit(Srs.refOf(location.pathname.split('/').pop(), Dialog.key,
                this.seqIdx != null ? this.seqIdx : 0));
      this.optButtons[i].classList.add('correct');
      this.optButtons.forEach(b => b.disabled = true);
      document.getElementById('quiz-fb').textContent = this.data.feedback[1];
      const next = document.getElementById('quiz-next');
      next.classList.add('show');
      next.onclick = () => this.confirmIfReady();
    } else {
      // 오답이면 그 보기만 비활성화하고, 정답을 맞힐 때까지 다시 고를 기회를 준다
      // (다음 문제로는 못 넘어감 — 정답 공개도 하지 않음).
      if (window.Juice) Juice.wrong();
      // 틀린 문항을 오답노트에 넣는다(날이 지날수록 간격을 두고 다시 나온다)
      // Dialog는 const라 window.Dialog로는 안 잡힌다(rank·autowalk·heroes와 같은 함정)
      if (window.Srs && typeof Dialog !== 'undefined' && Dialog.key)
        Srs.miss(Srs.refOf(location.pathname.split('/').pop(), Dialog.key,
                 this.seqIdx != null ? this.seqIdx : 0), this.data && this.data.q);
      // 이 대화에서 한 번이라도 틀리면 인물 카드의 ★이 붙지 않는다.
      // Dialog는 const라 window.Dialog로는 안 잡힌다(rank.js·autowalk.js와 같은 함정).
      if (typeof Dialog !== 'undefined') Dialog._missedAny = true;
      this._missed = true;
      this.optButtons[i].classList.add('wrong');
      this.optButtons[i].disabled = true;
      document.getElementById('quiz-fb').textContent = this.data.feedback[0];
    }
  },
  confirmIfReady(){
    if (!this.answered) return;
    document.getElementById('quiz-overlay').classList.remove('show');
    this.onDone && this.onDone();
  }
};

Stage.finishBoss = function(score, total){
  Stage.state.bossDone = true;

};

/* 이 화를 닫기 전에 마지막 관문을 지난다. 이기면 그때 화가 끝난다. */
(function(){
  const orig = Stage.endChapter;
  Stage.endChapter = function(){
    if (Stage.state && Stage.state._bossCleared) return orig.call(Stage);
    // 연표를 먼저 맞추고, 그다음 마지막 관문(보스)을 지난다
    const goBoss = function(){ startChapterBoss(function(){
      if (Stage.state) Stage.state._bossCleared = true;
      orig.call(Stage);
    }); };
    if (window.Timeline) Timeline.play(goBoss); else goBoss();
  };
})();


/* ============ 미니맵: #wrap 안의 독립된 2D 캔버스에 매 프레임 직접 그린다.
   현재 구역의 배경 이미지를 그대로 축소해서 사용(구역이 바뀌면 자동 반영). */
const miniCanvas = document.getElementById('minimap-canvas');
const miniCtx = miniCanvas.getContext('2d');
function sizeMinimapCanvas(){
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  miniCanvas.width = Math.round(160 * dpr);
  miniCanvas.height = Math.round(90 * dpr);
}
sizeMinimapCanvas();
window.addEventListener('resize', sizeMinimapCanvas);
function drawMinimap(){
  const w = miniCanvas.width, h = miniCanvas.height;
  const img = zoneImgs[World.zone];
  const sx = w / BG_W, sy = h / BG_H;
  miniCtx.clearRect(0, 0, w, h);
  if (img.complete && img.naturalWidth){ miniCtx.drawImage(img, 0, 0, w, h); }
  // 구역 전환 출구(문)를 미니맵에도 표시 — 어디로 나가야 다음 구역인지 한눈에 보이게.
  // (이모지 폰트 미지원 환경에서도 항상 똑같이 보이도록 직접 그린 문 아이콘 사용)
  for (const ex of (ZONES[World.zone].exits || [])){
    const pad = 8;
    const cx = Math.max(pad, Math.min(w-pad, (ex.rect.x0 + ex.rect.x1) / 2 * sx));
    const cy = Math.max(pad, Math.min(h-pad, (ex.rect.y0 + ex.rect.y1) / 2 * sy));
    const dw = 7, dh = 9;
    miniCtx.fillStyle = '#c9a24a';
    miniCtx.strokeStyle = '#3a2c1a';
    miniCtx.lineWidth = 1;
    miniCtx.beginPath();
    miniCtx.roundRect(cx - dw/2, cy - dh/2, dw, dh, 1.5);
    miniCtx.fill();
    miniCtx.stroke();
    miniCtx.fillStyle = '#3a2c1a';
    miniCtx.beginPath();
    miniCtx.arc(cx + dw/2 - 2, cy + 1, 0.9, 0, Math.PI*2);
    miniCtx.fill();
  }
  for (const n of ZONES[World.zone].npcs){
    miniCtx.fillStyle = '#8a2f2f';
    miniCtx.beginPath();
    miniCtx.arc(n.x*sx, n.y*sy, 5, 0, Math.PI*2);
    miniCtx.fill();
  }
  miniCtx.fillStyle = '#2f6fbf';
  miniCtx.strokeStyle = '#ffffff';
  miniCtx.lineWidth = 1;
  miniCtx.beginPath();
  miniCtx.arc(World.px*sx, World.py*sy, 6, 0, Math.PI*2);
  miniCtx.fill();
  miniCtx.stroke();
}

/* ============ 메인 루프 ============ */
function loop(t){
  if (!World.lastT) World.lastT = t;
  const dt = Math.min(0.05, (t - World.lastT) / 1000);
  World.lastT = t;
  if (window.Auto) Auto.drive();
  World.update(dt);
  World.render();
  drawMinimap();
  updateHudGoal();
  { const zl = document.getElementById('zone-label');
    const nm = (ZONES[World.zone] && ZONES[World.zone].label) || '';
    if (zl && zl.textContent !== nm) zl.textContent = nm; }
  if (window.Encounter) Encounter.tick(World);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

</script>
