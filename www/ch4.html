<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>한국사 게임 - 4화 법과 제도의 완성</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; overscroll-behavior: none; background: #000; font-family: -apple-system, "Pretendard", "Malgun Gothic", sans-serif; }
  /* 가로모드 고정: 세로로 들면 #wrap 전체를 90도 회전시켜 강제로 가로 화면처럼 사용한다.
     (전산회계오락실 stage1_cost.html과 동일한 트릭 — 회전 상태에서 vh 단위는 실제 뷰포트 기준으로
     어긋나므로 절대 쓰지 않고, 크기는 항상 JS로 계산한 px 값을 쓴다.) */
  #wrap { position: fixed; top: 0; left: 0; touch-action: none; transform-origin: top left; }
  body.rot #wrap { transform: rotate(90deg) translateY(-100%); }
  #game { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  #hud { position: absolute; top: calc(10px + env(safe-area-inset-top)); left: calc(12px + env(safe-area-inset-left));
    color: #f5f0e6; font-size: 14px; text-shadow: 0 1px 3px rgba(0,0,0,.8); z-index: 5; }
  #hud .sub { font-size: 11px; opacity: .75; margin-top: 2px; }
  #hud .progress { font-size: 11px; opacity: .85; margin-top: 4px; color: #f0c96b; }

  /* 조이스틱 */
  #stick-zone { position: absolute; left: calc(18px + env(safe-area-inset-left)); bottom: calc(18px + env(safe-area-inset-bottom));
    width: 130px; height: 130px; z-index: 6; touch-action: none; }
  #stick-base { position: absolute; inset: 0; border-radius: 50%; background: rgba(255,255,255,0.12); border: 2px solid rgba(255,255,255,0.25); }
  #stick-knob { position: absolute; width: 52px; height: 52px; left: 39px; top: 39px; border-radius: 50%; background: rgba(255,255,255,0.55); transition: transform .05s linear; }

  /* 대화 버튼 */
  #act-btn { position: absolute; right: calc(22px + env(safe-area-inset-right)); bottom: calc(34px + env(safe-area-inset-bottom));
    width: 68px; height: 68px; border-radius: 50%; border: none; touch-action: none;
    background: #d9a441; color: #2b1d0e; font-size: 26px; box-shadow: 0 4px 10px rgba(0,0,0,.4);
    opacity: 0; pointer-events: none; transition: opacity .15s; z-index: 6; }
  #act-btn.show { opacity: 1; pointer-events: auto; }

  /* 공통 오버레이 */
  .ov { position: absolute; inset: 0; z-index: 20; display: none; align-items: flex-end; justify-content: center; background: rgba(0,0,0,0.35); }
  .ov.show { display: flex; }
  .ov.center { align-items: center; }

  #dlg-panel, #quiz-panel, #intro-panel {
    width: 100%; max-width: 640px; margin: 0 16px calc(16px + env(safe-area-inset-bottom)); background: #1c2430ee; border: 2px solid #4a7a9c;
    border-radius: 14px; padding: 16px 18px; color: #eaf1f5; box-shadow: 0 8px 24px rgba(0,0,0,.5);
    max-height: 80%; overflow-y: auto;
  }
  .dlg-top { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .dlg-portrait { width: 44px; height: 44px; border-radius: 50%; background: #2f4a5c; flex: none; display:flex; align-items:center; justify-content:center; font-size:20px; }
  .dlg-name { font-weight: bold; font-size: 15px; color: #7fc4e8; }
  .dlg-tag { font-size: 11px; opacity: .7; }
  .dlg-box { font-size: 18px; line-height: 1.6; min-height: 54px; white-space: pre-wrap; }
  .dlg-next { text-align: right; margin-top: 10px; font-size: 13px; opacity: .8; cursor: pointer; }
  .dlg-next .arrow { display: inline-block; margin-left: 4px; animation: nudge 1s infinite; }
  @keyframes nudge { 0%,100%{transform:translateX(0);} 50%{transform:translateX(4px);} }

  #intro-panel { max-width: 560px; text-align: center; }
  #intro-text { font-size: 15px; line-height: 1.8; min-height: 90px; white-space: pre-wrap; }
  #intro-next { margin-top: 14px; font-size: 13px; opacity: .8; }

  .quiz-tag { font-size: 12px; color: #7fc4e8; margin-bottom: 6px; }
  .quiz-q { font-size: 15px; line-height: 1.5; margin-bottom: 14px; }
  .quiz-opts { display: flex; flex-direction: column; gap: 8px; }
  .quiz-opt { padding: 12px 14px; border-radius: 10px; border: 1px solid #4a7a9c; background: #223140; color: #eaf1f5;
    font-size: 14px; text-align: left; }
  .quiz-opt.correct { background: #2f5d3a; border-color: #5fbf76; }
  .quiz-opt.wrong { background: #5d2f2f; border-color: #bf5f5f; }
  .quiz-fb { margin-top: 10px; font-size: 13px; line-height: 1.5; color: #cfe3ec; min-height: 20px; }
  .quiz-next { text-align: right; margin-top: 10px; font-size: 13px; opacity: 0; cursor: pointer; }
  .quiz-next.show { opacity: .85; }

  #fade { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity .6s; z-index: 30; }
  #fade.show { opacity: 1; pointer-events: auto; }

  #end-screen { position: absolute; inset: 0; z-index: 40; display: none; align-items: center; justify-content: center;
    background: #000; color: #7fc4e8; text-align: center; padding: 24px; }
  #end-screen.show { display: flex; }
  #end-screen h2 { font-size: 20px; margin-bottom: 10px; }
  #end-screen p { color: #cfe3ec; font-size: 14px; line-height: 1.7; }
  #end-screen a { display: inline-block; margin: 10px 8px 0; color: #1a1408; background: #d9a441; text-decoration: none;
    padding: 10px 22px; border-radius: 999px; font-size: 14px; font-weight: bold; }
  #end-score { color: #7fc4e8; font-size: 15px; margin-top: 14px; white-space: pre-wrap; }

  /* 미니맵: 반드시 #wrap 안에 둬야 한다. #wrap의 rotate(90deg)를 같이 물려받아야
     플레이어가 폰을 돌려서 보는 시야 기준으로 똑바로, 우상단에 놓이기 때문.
     (밖으로 빼서 position:fixed로 "물리적 화면 우상단"에 고정하면, 폰을 돌려
     보는 순간 그 지점은 시야의 좌상단이 되고 게임 화면만 회전돼 있어서
     미니맵만 90도 틀어져 보인다 — 실제로 그렇게 만들었다가 되돌린 부분.) */
  #minimap-canvas { position: absolute; top: calc(10px + env(safe-area-inset-top)); right: calc(10px + env(safe-area-inset-right));
    width: 160px; height: 90px; border: 2px solid #d9a441; border-radius: 6px; z-index: 50;
    box-shadow: 0 2px 8px rgba(0,0,0,.4); background: #1a140c; }

  /* 마지막 대사/보스전까지 다 마쳐도 곧장 챕터가 끝나지 않고, 이 버튼을
     눌러야만 끝난다 — 그 전까지는 계속 돌아다니며 다른 NPC와 대화 가능. */
  #next-chapter-btn { position: absolute; left: 50%; top: calc(14px + env(safe-area-inset-top)); transform: translateX(-50%);
    background: #d9a441; color: #2b1d0e; border: none; border-radius: 999px; padding: 10px 20px;
    font-size: 14px; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,.4);
    opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 7; }
  #next-chapter-btn.show { opacity: 1; pointer-events: auto; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>

  <div id="hud">
    <div>4화 · 법과 제도의 완성</div>
    <div class="sub">1469~1494년, 홍문관과 지방 고을</div>
    <div class="progress" id="hud-progress"></div>
  </div>

  <div id="stick-zone">
    <div id="stick-base"><div id="stick-knob"></div></div>
  </div>
  <button id="act-btn" onclick="Stage.interact()">💬</button>

  <!-- 회상 인트로 -->
  <div class="ov center show" id="intro-overlay">
    <div id="intro-panel">
      <div id="intro-text"></div>
      <div id="intro-next">탭하여 계속 ▶</div>
    </div>
  </div>

  <!-- 대화 -->
  <div class="ov" id="dlg-overlay">
    <div id="dlg-panel">
      <div class="dlg-top">
        <div class="dlg-portrait" id="dlg-portrait">👤</div>
        <div>
          <div class="dlg-tag" id="dlg-tag"></div>
          <div class="dlg-name" id="dlg-name"></div>
        </div>
      </div>
      <div class="dlg-box" id="dlg-text"></div>
      <div class="dlg-next" id="dlg-next">계속 <span class="arrow">▶</span></div>
    </div>
  </div>

  <!-- 확인 퀴즈 / 보스전 -->
  <div class="ov center" id="quiz-overlay">
    <div id="quiz-panel">
      <div class="quiz-tag" id="quiz-tag">확인 퀴즈</div>
      <div class="quiz-q" id="quiz-q"></div>
      <div class="quiz-opts" id="quiz-opts"></div>
      <div class="quiz-fb" id="quiz-fb"></div>
      <div class="quiz-next" id="quiz-next">계속 <span class="arrow">▶</span></div>
    </div>
  </div>

  <button id="next-chapter-btn" onclick="Stage.endChapter()">다음 화로 가기 ▶</button>

  <div id="fade"></div>

  <div id="end-screen">
    <div>
      <h2>4화 · 끝</h2>
      <p>서거정: (조용히)<br>"…전하께서 요즘 부쩍 학문하는 신하들을 가까이 두시네. 젊고 강직한 이들이지.<br>다만… 그런 이들이 너무 강직하면, 늘 있던 대신들과 부딪히기 마련이라 걱정이야."</p>
      <div id="end-score"></div>
      <p style="margin-top:18px; opacity:.7;">5화 「사림과 피바람」에서 계속됩니다.</p>
      <div><a href="ch5.html">다음 화로</a><a href="index.html">챕터 목록</a></div>
    </div>
  </div>
  <canvas id="minimap-canvas"></canvas>
</div>

<script>
/* ============ 기본 설정 ============ */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const TS = 40;
const T = { WALL: 0, GROUND: 1, STONE: 2, FIELD: 3 };
const WT = 32, HT = 18;

/* 가로모드 고정: 세로 뷰포트면 body에 .rot을 붙여 #wrap을 90도 회전시키고,
   #wrap/canvas 크기는 가로세로를 서로 바꾼 값으로 맞춘다. vh 대신 항상 px로 계산. */
const wrapEl = document.getElementById('wrap');
/* 모바일 브라우저는 주소창이 늦게 접히거나 펼쳐지면서 innerWidth/innerHeight가
   한 박자 늦게 바뀌는 경우가 있다(특히 iOS Safari). visualViewport가 있으면
   그쪽이 실제 보이는 영역을 더 정확히 반영하므로 우선 사용한다. */
function getViewportSize(){
  if (window.visualViewport) return { w: window.visualViewport.width, h: window.visualViewport.height };
  return { w: window.innerWidth, h: window.innerHeight };
}
function applyOrientation(){
  const { w: iw, h: ih } = getViewportSize();
  const portrait = ih > iw;
  document.body.classList.toggle('rot', portrait);
  const w = portrait ? ih : iw;
  const h = portrait ? iw : ih;
  wrapEl.style.width = w + 'px';
  wrapEl.style.height = h + 'px';
  canvas.width = w;
  canvas.height = h;
}
window.addEventListener('resize', applyOrientation);
window.addEventListener('orientationchange', () => setTimeout(applyOrientation, 80));
if (window.visualViewport){
  window.visualViewport.addEventListener('resize', applyOrientation);
  window.visualViewport.addEventListener('scroll', applyOrientation);
}
// 일부 모바일 브라우저는 주소창이 애니메이션으로 늦게 접혀서, 로드 직후 한 번 더 재확인한다.
setTimeout(applyOrientation, 300);
setTimeout(applyOrientation, 800);
applyOrientation();

/* ============ 맵: 홍문관(서) — 지방 고을(동) ============ */
function buildMap(){
  const g = [];
  for (let y = 0; y < HT; y++){ g[y] = new Uint8Array(WT); g[y].fill(T.GROUND); }
  for (let x = 0; x < WT; x++){ g[0][x] = T.WALL; g[HT-1][x] = T.WALL; }
  for (let y = 0; y < HT; y++){ g[y][0] = T.WALL; g[y][WT-1] = T.WALL; }
  // 홍문관(돌바닥)
  for (let y = 3; y < 10; y++) for (let x = 3; x < 13; x++) g[y][x] = T.STONE;
  // 지방 고을(다른 바닥재)
  for (let y = 8; y < 15; y++) for (let x = 21; x < 31; x++) g[y][x] = T.FIELD;
  return g;
}
const MAP = buildMap();
function isBarrier(x, y){
  if (x < 0 || y < 0 || x >= WT || y >= HT) return true;
  if (MAP[Math.floor(y)][Math.floor(x)] === T.WALL) return true;
  for (const n of NPCS){ if (Math.round(n.x) === Math.round(x) && Math.round(n.y) === Math.round(y)) return true; }
  return false;
}

/* 국가유산청 3D 에셋 마켓 웹뷰어로 확인한 실제 색감 참고(아트/국가유산_비주얼_레퍼런스.md):
   경복궁 화강암 판석(홍문관), 남한산성 성벽, 낙안읍성 초가마을 녹지(지방 고을) */
const TILE_COLOR = { [T.GROUND]: '#9faeb0', [T.WALL]: '#2e3942', [T.STONE]: '#909fa6', [T.FIELD]: '#7f9165' };
function hash2(x, y, seed){
  let h = (x*374761393 + y*668265263 + (seed||0)*2246822519) | 0;
  h = (h ^ (h >>> 13)) >>> 0;
  h = Math.imul(h, 1274126177);
  h = (h ^ (h >>> 16)) >>> 0;
  return h / 4294967295;
}
function shadeColor(hex, amt){
  const n = parseInt(hex.slice(1), 16);
  let r = (n>>16)&255, g = (n>>8)&255, b = n&255;
  r = Math.max(0, Math.min(255, r + (amt<0 ? r*amt : (255-r)*amt)));
  g = Math.max(0, Math.min(255, g + (amt<0 ? g*amt : (255-g)*amt)));
  b = Math.max(0, Math.min(255, b + (amt<0 ? b*amt : (255-b)*amt)));
  return `rgb(${r|0},${g|0},${b|0})`;
}
function drawTile(t, tx, ty, px, py){
  const base = TILE_COLOR[t];
  ctx.fillStyle = base;
  ctx.fillRect(px, py, TS+1, TS+1);
  if (t === T.GROUND){
    for (let i=0;i<4;i++){
      const n1 = hash2(tx*4+i, ty, 1), n2 = hash2(tx*4+i, ty, 2), n3 = hash2(tx*4+i, ty, 3);
      ctx.fillStyle = n3 > 0.5 ? 'rgba(0,0,0,.08)' : 'rgba(255,255,255,.08)';
      ctx.beginPath(); ctx.arc(px + 4 + n1*(TS-8), py + 4 + n2*(TS-8), 1.5 + n3*2, 0, Math.PI*2); ctx.fill();
    }
  } else if (t === T.STONE){
    const half = TS/2;
    for (let by=0; by<2; by++) for (let bx=0; bx<2; bx++){
      const n = hash2(tx*2+bx, ty*2+by, 5);
      ctx.fillStyle = shadeColor(base, (n-0.5)*0.18);
      ctx.fillRect(px+bx*half+1, py+by*half+1, half-2, half-2);
    }
    ctx.strokeStyle = 'rgba(0,0,0,.18)'; ctx.lineWidth = 1;
    ctx.strokeRect(px+0.5, py+0.5, TS, TS);
  } else if (t === T.FIELD){
    for (let i=0;i<5;i++){
      const nx = hash2(tx*5+i, ty, 4), ny = hash2(tx*5+i, ty, 6), na = hash2(tx*5+i, ty, 8);
      const bx = px + 3 + nx*(TS-6), by = py + 3 + ny*(TS-6);
      const ang = (na-0.5) * 0.9;
      ctx.strokeStyle = shadeColor(base, na>0.5 ? 0.22 : -0.15);
      ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.moveTo(bx, by+4); ctx.lineTo(bx + Math.sin(ang)*5, by-5); ctx.stroke();
    }
  } else if (t === T.WALL){
    const rows = 3, rowH = TS/rows, cols = 2;
    for (let r=0;r<rows;r++){
      const offset = (r%2===0) ? 0 : TS/cols/2;
      for (let c=-1;c<=cols;c++){
        const n = hash2(tx*10+r*4+c+30, ty, 11);
        const bx = px + c*(TS/cols) + offset;
        ctx.fillStyle = shadeColor(base, (n-0.5)*0.22);
        ctx.fillRect(Math.max(px,bx)+1, py+r*rowH+1, TS/cols-2, rowH-2);
      }
    }
    ctx.strokeStyle = 'rgba(0,0,0,.15)'; ctx.lineWidth = 1;
    ctx.strokeRect(px+0.5, py+0.5, TS, TS);
    ctx.fillStyle = 'rgba(0,0,0,.2)';
    ctx.fillRect(px, py, TS+1, 5);
  }
}
function drawMap(camX, camY){
  const x0 = Math.max(0, Math.floor(camX / TS));
  const y0 = Math.max(0, Math.floor(camY / TS));
  const x1 = Math.min(WT, Math.ceil((camX + canvas.width) / TS) + 1);
  const y1 = Math.min(HT, Math.ceil((camY + canvas.height) / TS) + 1);
  for (let y = y0; y < y1; y++){
    for (let x = x0; x < x1; x++){
      drawTile(MAP[y][x], x, y, x*TS - camX, y*TS - camY);
    }
  }
}

/* ============ NPC ============
   look.role로 실루엣이 달라짐: king(왕)/general(무관)/scholar(문관)/commoner(평민) */
const NPCS = [
  { id: 'seogeojeong', name: '서거정', x: 7, y: 6, look: { role: 'scholar', body: '#2f5c6b', accent: '#c9a24a' } },
  { id: 'seongjong', name: '성종', x: 25, y: 11, look: { role: 'king', body: '#4a6b3d', accent: '#e0b94a' } },
];
const PLAYER_LOOK = { role: 'commoner', body: '#c94f4f', accent: '#e0b94a' };

/* ============ 캐릭터 드로잉 (역할별 실루엣) ============ */
function drawCharacter(px, py, facing, look){
  const role = (look && look.role) || 'commoner';
  const body = (look && look.body) || '#8a6d3b';
  const accent = (look && look.accent) || '#c9a24a';
  const eo = facing === 'l' ? -2 : facing === 'r' ? 2 : 0;
  ctx.save();
  ctx.translate(px, py);
  ctx.fillStyle = 'rgba(0,0,0,.25)';
  ctx.beginPath(); ctx.ellipse(0, 16, 12, 5, 0, 0, Math.PI*2); ctx.fill();

  if (role === 'king'){
    ctx.fillStyle = body;
    ctx.beginPath();
    ctx.moveTo(-6,-8); ctx.lineTo(6,-8); ctx.lineTo(13,14); ctx.lineTo(-13,14); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = accent; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-6,-8); ctx.lineTo(0,3); ctx.lineTo(6,-8); ctx.stroke();
    ctx.fillStyle = '#f1c79a';
    ctx.beginPath(); ctx.arc(0,-14,10,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#1c1a16';
    ctx.beginPath(); ctx.ellipse(0,-21,9,5,0,Math.PI,0); ctx.fill();
    ctx.fillRect(-9,-22,18,4);
    ctx.beginPath(); ctx.ellipse(-12,-17,5,2,-0.4,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(12,-17,5,2,0.4,0,Math.PI*2); ctx.fill();
  } else if (role === 'general'){
    ctx.fillStyle = body;
    ctx.fillRect(-9,-6,18,20);
    ctx.strokeStyle = 'rgba(0,0,0,.3)'; ctx.lineWidth = 1;
    for (let i=-3;i<=11;i+=4){ ctx.beginPath(); ctx.moveTo(-9,i); ctx.lineTo(9,i); ctx.stroke(); }
    ctx.fillStyle = accent;
    ctx.fillRect(-12,-7,6,6); ctx.fillRect(6,-7,6,6);
    ctx.fillStyle = '#f1c79a';
    ctx.beginPath(); ctx.arc(0,-14,10,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#565a5e';
    ctx.beginPath(); ctx.arc(0,-16,10,Math.PI,0); ctx.fill();
    ctx.fillRect(-10,-16,20,4);
    ctx.fillStyle = accent;
    ctx.beginPath(); ctx.moveTo(0,-27); ctx.lineTo(-2,-32); ctx.lineTo(2,-32); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#6b5636'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(13,-18); ctx.lineTo(13,14); ctx.stroke();
  } else if (role === 'scholar'){
    ctx.fillStyle = body;
    ctx.beginPath();
    ctx.moveTo(-5,-8); ctx.lineTo(5,-8); ctx.lineTo(10,14); ctx.lineTo(-10,14); ctx.closePath(); ctx.fill();
    ctx.fillStyle = accent;
    ctx.fillRect(-10,4,20,3);
    ctx.fillStyle = '#f1c79a';
    ctx.beginPath(); ctx.arc(0,-14,10,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#1c1a16';
    ctx.beginPath(); ctx.ellipse(0,-21,8,5,0,Math.PI,0); ctx.fill();
    ctx.fillRect(-8,-22,16,4);
    ctx.fillRect(-14,-19,6,2);
    ctx.fillRect(8,-19,6,2);
  } else {
    ctx.fillStyle = body;
    ctx.fillRect(-9,-6,18,20);
    ctx.strokeStyle = accent; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-9,-6); ctx.lineTo(0,2); ctx.lineTo(9,-6); ctx.stroke();
    ctx.fillStyle = '#f1c79a';
    ctx.beginPath(); ctx.arc(0,-14,10,0,Math.PI*2); ctx.fill();
    if (look && look.headband){
      ctx.fillStyle = accent;
      ctx.fillRect(-10,-18,20,3);
    }
  }

  ctx.fillStyle = '#2b2015';
  ctx.beginPath(); ctx.arc(eo-3,-14,1.4,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(eo+3,-14,1.4,0,Math.PI*2); ctx.fill();
  ctx.restore();
}

/* ============ World: 이동/카메라/충돌 ============ */
const World = {
  px: 17, py: 9, facing: 'd', speed: 3.4,
  stick: { active: false, dx: 0, dy: 0 },
  keys: { l:false, r:false, u:false, d:false },
  paused: false,
  nearNpc: null,
  lastT: 0,

  canStand(x, y){
    const pad = 0.3;
    return !isBarrier(x-pad, y-pad) && !isBarrier(x+pad, y-pad) && !isBarrier(x-pad, y+pad) && !isBarrier(x+pad, y+pad);
  },

  update(dt){
    if (this.paused || overlayOpen()) return;
    let vx = this.stick.dx, vy = this.stick.dy;
    if (this.keys.l) vx -= 1;
    if (this.keys.r) vx += 1;
    if (this.keys.u) vy -= 1;
    if (this.keys.d) vy += 1;
    const len = Math.hypot(vx, vy);
    if (len > 0.05){
      vx /= len; vy /= len;
      if (Math.abs(vx) > Math.abs(vy)) this.facing = vx > 0 ? 'r' : 'l';
      else this.facing = vy > 0 ? 'd' : 'u';
      const nx = this.px + vx * this.speed * dt;
      const ny = this.py + vy * this.speed * dt;
      if (this.canStand(nx, this.py)) this.px = nx;
      if (this.canStand(this.px, ny)) this.py = ny;
    }
    this.checkNpc();
  },

  checkNpc(){
    let found = null, best = 1.7;
    for (const n of NPCS){
      const d = Math.hypot(n.x - this.px, n.y - this.py);
      if (d < best){ best = d; found = n; }
    }
    if (found !== this.nearNpc){
      this.nearNpc = found;
      const btn = document.getElementById('act-btn');
      if (found) btn.classList.add('show'); else btn.classList.remove('show');
    }
  },

  render(){
    const camX = this.px*TS - canvas.width/2;
    const camY = this.py*TS - canvas.height/2;
    ctx.fillStyle = '#9fb0b0';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    drawMap(camX, camY);
    for (const n of NPCS){
      drawCharacter(n.x*TS - camX, n.y*TS - camY, 'd', n.look);
      if (n === this.nearNpc){
        ctx.fillStyle = '#f0c96b';
        ctx.font = '16px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('!', n.x*TS - camX, n.y*TS - camY - 34);
      }
    }
    drawCharacter(this.px*TS - camX, this.py*TS - camY, this.facing, PLAYER_LOOK);
    const vg = ctx.createRadialGradient(canvas.width/2, canvas.height/2, canvas.height*0.3, canvas.width/2, canvas.height/2, canvas.height*0.8);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, 'rgba(0,0,0,.28)');
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }
};

/* 조이스틱 입력 (Pointer Events 통일) */
(function bindStick(){
  const zone = document.getElementById('stick-zone');
  const knob = document.getElementById('stick-knob');
  let activeId = null, cx = 0, cy = 0;
  const R = 44;
  zone.addEventListener('pointerdown', e=>{
    if (activeId !== null) return;
    activeId = e.pointerId;
    try { zone.setPointerCapture(activeId); } catch(err) {}
    const r = zone.getBoundingClientRect();
    cx = r.left + r.width/2; cy = r.top + r.height/2;
    World.stick.active = true;
    move(e);
  });
  zone.addEventListener('pointermove', move);
  zone.addEventListener('pointerup', end);
  zone.addEventListener('pointercancel', end);
  function move(e){
    if (e.pointerId !== activeId) return;
    let dx = e.clientX - cx, dy = e.clientY - cy;
    const d = Math.hypot(dx, dy);
    if (d > R){ dx = dx/d*R; dy = dy/d*R; }
    // 노브는 손가락의 실제 화면 이동을 그대로 따라가야 자연스럽다(시각 좌표계).
    knob.style.transform = `translate(${dx}px,${dy}px)`;
    // 하지만 World(캔버스 내부 좌표계)는 화면이 90도 회전되어 있으므로 역보정이 필요하다.
    let wx = dx, wy = dy;
    if (document.body.classList.contains('rot')){ wx = dy; wy = -dx; }
    World.stick.dx = wx / R; World.stick.dy = wy / R;
  }
  function end(e){
    if (e.pointerId !== activeId) return;
    activeId = null;
    World.stick.active = false; World.stick.dx = 0; World.stick.dy = 0;
    knob.style.transform = 'translate(0,0)';
  }
})();

const Dialog = {
  key: null, npc: null, idx: 0, data: null,
  open(key, npc){
    this.key = key; this.npc = npc; this.idx = 0;
    this.data = NPC_DATA[key];
    World.paused = true;
    document.getElementById('dlg-overlay').classList.add('show');
    document.getElementById('dlg-tag').textContent = '1469~1494년 · 조선';
    this.render();

    const beat = this.data.beats[this.idx];
    document.getElementById('dlg-name').textContent = beat.name || this.data.name;
    document.getElementById('dlg-portrait').textContent = beat.icon || this.data.icon;
    document.getElementById('dlg-text').textContent = beat.t;
  },
  next(){
    this.idx++;
    if (this.idx >= this.data.beats.length){ this.finish(); return; }
    this.render();
  },
  finish(){
    document.getElementById('dlg-overlay').classList.remove('show');
    if (this.data.quizSeq){
      Quiz.openSequence(this.data.quizSeq, (score, total) => this.afterQuizSeq(score, total));

      this.afterQuiz();
    }
  },
  afterQuizSeq(score, total){
    if (this.npc.id === 'seogeojeong'){
      Stage.state.seogeojeongScore += score; Stage.state.seogeojeongTotal += total;
    } else if (this.npc.id === 'seongjong'){
      Stage.state.seongjongScore += score; Stage.state.seongjongTotal += total;
    }
    if (this.data.finishesBossA){ Stage.finishBoss('A', Stage.state.seogeojeongScore, Stage.state.seogeojeongTotal); return; }
    if (this.data.finishesBossB){ Stage.finishBoss('B', Stage.state.seongjongScore, Stage.state.seongjongTotal); return; }
    this.afterQuiz();
  },
  afterQuiz(){
    World.paused = false;
    if (this.npc.id === 'seogeojeong'){
      Stage.state.seogeojeongStage = Math.min(Stage.state.seogeojeongStage + 1, 2);
    } else if (this.npc.id === 'seongjong'){
      Stage.state.seongjongStage = Math.min(Stage.state.seongjongStage + 1, 1);
    }
  }
};
document.getElementById('dlg-panel').addEventListener('click', () => Dialog.next());

/* ============ Quiz 엔진 (단일 확인퀴즈 + 보스전 연속퀴즈 공용) ============ */
const Quiz = {
  data: null, onDone: null, answered: false, optButtons: [],
  seq: null, seqIdx: 0, seqScore: 0, seqOnDone: null,

  open(data, onDone){
    this.seq = null;
    this._openOne(data, onDone);
  },
  openSequence(list, onAllDone){
    this.seq = list; this.seqIdx = 0; this.seqScore = 0; this.seqOnDone = onAllDone;
    this._openOne(this.seq[0], () => this._seqAdvance());
  },
  _seqAdvance(){
    this.seqIdx++;
    if (this.seqIdx >= this.seq.length){
      const score = this.seqScore, total = this.seq.length;
      this.seq = null;
      this.seqOnDone && this.seqOnDone(score, total);
      return;
    }
    this._openOne(this.seq[this.seqIdx], () => this._seqAdvance());
  },
  _openOne(data, onDone){
    this.data = data; this.onDone = onDone; this.answered = false;
    document.getElementById('quiz-overlay').classList.add('show');
    document.getElementById('quiz-tag').textContent = this.seq ? `보스전 · ${this.seqIdx+1}/${this.seq.length}` : '확인 퀴즈';
    document.getElementById('quiz-q').textContent = data.q;
    document.getElementById('quiz-fb').textContent = '';
    document.getElementById('quiz-next').classList.remove('show');
    const opts = document.getElementById('quiz-opts');
    opts.innerHTML = '';
    this.optButtons = data.opts.map((text, i) => {
      const b = document.createElement('button');
      b.className = 'quiz-opt';
      b.textContent = (i+1) + '. ' + text;
      b.onclick = () => this.pick(i);
      opts.appendChild(b);
      return b;
    });
  },
  pick(i){
    if (this.answered) return;
    this.answered = true;
    const correct = i === this.data.answer;
    if (correct && this.seq) this.seqScore++;
    this.optButtons[i].classList.add(correct ? 'correct' : 'wrong');
    if (!correct) this.optButtons[this.data.answer].classList.add('correct');
    document.getElementById('quiz-fb').textContent = this.data.feedback[i];
    const next = document.getElementById('quiz-next');
    next.classList.add('show');
    next.onclick = () => this.confirmIfReady();
  },
  confirmIfReady(){
    if (!this.answered) return;
    document.getElementById('quiz-overlay').classList.remove('show');
    this.onDone && this.onDone();
  }
};

/* ============ 회상 인트로 ============ */
const INTRO_LINES = [
  '세조가 세상을 떠난 뒤, 왕위는 예종을 거쳐 어린 성종에게 이어졌다.',
  '피로 얼룩졌던 시절도 이제는 지나가고, 궁궐엔 서책 정리하는 소리만 조용히 울린다.'
];
let introIdx = 0;
function renderIntro(){ document.getElementById('intro-text').textContent = INTRO_LINES[introIdx]; }
function introNext(){
  introIdx++;
  if (introIdx >= INTRO_LINES.length){
    const fade = document.getElementById('fade');
    fade.classList.add('show');
    setTimeout(() => {
      document.getElementById('intro-overlay').classList.remove('show');
      fade.classList.remove('show');
    }, 600);
    return;
  }
  renderIntro();
}
document.getElementById('intro-panel').addEventListener('click', introNext);
renderIntro();

/* ============ 챕터 진행 표시 / 종료 (보스전 2개 모두 끝나야 종료) ============ */
function updateHudProgress(){
  const a = Stage.state.bossADone ? '완료' : '진행중';
  const b = Stage.state.bossBDone ? '완료' : '진행중';
  document.getElementById('hud-progress').textContent = `관청 시험: ${a} · 성종 보스전: ${b}`;
}
updateHudProgress();

Stage.finishBoss = function(id, score, total){
  if (id === 'A'){ Stage.state.bossADone = true; Stage.state.bossAScore = `${score}/${total}`; }
  else { Stage.state.bossBDone = true; Stage.state.bossBScore = `${score}/${total}`; }
  updateHudProgress();
  World.paused = false;
  if (Stage.state.bossADone && Stage.state.bossBDone){
    document.getElementById('end-score').textContent =
      `관청 시험: ${Stage.state.bossAScore} 정답\n성종 보스전: ${Stage.state.bossBScore} 정답`;
    document.getElementById('next-chapter-btn').classList.add('show');
  }
};
Stage.endChapter = function(){
  document.getElementById('end-screen').classList.add('show');
};

/* ============ 미니맵: #wrap 안의 독립된 2D 캔버스에 매 프레임 직접 그린다
   (Phaser 카메라나 게임 캔버스와 별개). 타일맵(MAP/TILE_COLOR)을 그대로 축소해서 사용. */
const miniCanvas = document.getElementById('minimap-canvas');
const miniCtx = miniCanvas.getContext('2d');
function sizeMinimapCanvas(){
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  miniCanvas.width = Math.round(160 * dpr);
  miniCanvas.height = Math.round(90 * dpr);
}
sizeMinimapCanvas();
window.addEventListener('resize', sizeMinimapCanvas);
function drawMinimap(){
  const w = miniCanvas.width, h = miniCanvas.height;
  const cw = w / WT, ch = h / HT;
  miniCtx.clearRect(0, 0, w, h);
  for (let y=0;y<HT;y++){
    for (let x=0;x<WT;x++){
      miniCtx.fillStyle = TILE_COLOR[MAP[y][x]] || '#3a2c1a';
      miniCtx.fillRect(x*cw, y*ch, cw+0.5, ch+0.5);
    }
  }
  for (const n of NPCS){
    miniCtx.fillStyle = '#8a2f2f';
    miniCtx.beginPath();
    miniCtx.arc(n.x*cw, n.y*ch, 3, 0, Math.PI*2);
    miniCtx.fill();
  }
  miniCtx.fillStyle = '#2f6fbf';
  miniCtx.strokeStyle = '#ffffff';
  miniCtx.lineWidth = 1;
  miniCtx.beginPath();
  miniCtx.arc(World.px*cw, World.py*ch, 4, 0, Math.PI*2);
  miniCtx.fill();
  miniCtx.stroke();
}

/* ============ 메인 루프 ============ */
function loop(t){
  if (!World.lastT) World.lastT = t;
  const dt = Math.min(0.05, (t - World.lastT) / 1000);
  World.lastT = t;
  World.update(dt);
  World.render();
  drawMinimap();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
