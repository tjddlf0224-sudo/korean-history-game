<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>전봉준 리그 시제품</title>
<style>
  body { background:#15110c; color:#e8e2d2; font-family:sans-serif; padding:20px;
    display:flex; flex-wrap:wrap; gap:40px; }
  .box { text-align:center; }
  .box h3 { color:#f0c96b; }
  .rig-wrap { position:relative; width:253px; height:409px; margin:0 auto; }
  .rig-body { position:absolute; inset:0; width:100%; height:100%; }
  .rig-spear { position:absolute; left:35px; top:77px; width:74px; height:307px;
    transform-origin: 44.02px 198px; }

  .swing-gentle .rig-spear { animation: swing-gentle 1.8s ease-in-out infinite; }
  @keyframes swing-gentle {
    0%, 100% { transform: rotate(-6deg); }
    50% { transform: rotate(10deg); }
  }

  .swing-strike .rig-spear { animation: swing-strike 1.1s cubic-bezier(.4,0,.2,1) infinite; }
  @keyframes swing-strike {
    0%   { transform: rotate(-45deg); }
    35%  { transform: rotate(30deg); }
    55%  { transform: rotate(18deg); }
    100% { transform: rotate(-45deg); }
  }

  .swing-fast .rig-spear { animation: swing-strike 0.6s cubic-bezier(.4,0,.2,1) infinite; }

  /* sprite-sheet version for side-by-side comparison */
  .sprite-old { width:69px; height:112px; background-image:url('assets/mascots/jeonbongjun.png');
    background-repeat:no-repeat; background-size: calc(12*100%) 100%; background-position:0 0;
    animation: sprite-play calc(12*0.09s) steps(11) infinite; margin:0 auto; }
  @keyframes sprite-play { from{background-position-x:0%;} to{background-position-x:100%;} }
</style>
</head>
<body>
  <div class="box">
    <h3>리그 방식 — 완만하게</h3>
    <div class="rig-wrap swing-gentle">
      <img class="rig-body" src="assets/mascots/jeonbongjun_rig_body.png">
      <img class="rig-spear" src="assets/mascots/jeonbongjun_rig_spear.png">
    </div>
  </div>
  <div class="box">
    <h3>리그 방식 — 강하게 찌르기(1.1초)</h3>
    <div class="rig-wrap swing-strike">
      <img class="rig-body" src="assets/mascots/jeonbongjun_rig_body.png">
      <img class="rig-spear" src="assets/mascots/jeonbongjun_rig_spear.png">
    </div>
  </div>
  <div class="box">
    <h3>리그 방식 — 강하게 찌르기(0.6초, 빠름)</h3>
    <div class="rig-wrap swing-fast">
      <img class="rig-body" src="assets/mascots/jeonbongjun_rig_body.png">
      <img class="rig-spear" src="assets/mascots/jeonbongjun_rig_spear.png">
    </div>
  </div>
  <div class="box">
    <h3>기존 스프라이트 시트(12프레임, 비교용)</h3>
    <div style="height:409px; display:flex; align-items:flex-end;">
      <div class="sprite-old"></div>
    </div>
  </div>
</body>
</html>
