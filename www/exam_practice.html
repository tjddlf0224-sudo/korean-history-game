<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>기출문제 풀이 — 타임슬립 한국사</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gugi&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; word-break: keep-all; overflow-wrap: break-word; }
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; overscroll-behavior:none;
    background:#15110c; font-family: "Gowun Batang", -apple-system, "Malgun Gothic", serif; color:#f5ecd8; }

  /* 챕터·챕터목록과 같은 가로모드 고정 트릭. */
  #wrap { position: fixed; top: 0; left: 0; touch-action: pan-x pan-y; transform-origin: top left; overflow: hidden; }
  body.rot #wrap { transform: rotate(90deg) translateY(-100%); }

  #scroller { width:100%; height:100%; overflow-x:hidden; overflow-y:auto; -webkit-overflow-scrolling:touch; }
  #app { min-height:100%; width:100%; max-width:640px; margin:0 auto;
    padding: calc(14px + env(safe-area-inset-top)) calc(18px + env(safe-area-inset-right))
    calc(20px + env(safe-area-inset-bottom)) calc(18px + env(safe-area-inset-left));
    display:flex; flex-direction:column; }

  .topbar { display:flex; align-items:center; gap:10px; margin-bottom: 14px; flex: none; }
  #back-btn { flex:none; width:32px; height:32px; border-radius:50%; border:1px solid #4a3c26;
    background:#2a2013; color:#f5ecd8; display:flex; align-items:center; justify-content:center;
    text-decoration:none; }
  #back-btn svg { width:16px; height:16px; }
  .topbar h1 { margin:0; font-size:15px; color:#f0c96b; font-weight:700; }
  .topbar .sub { margin:1px 0 0; font-size:11px; color:#b8a888; }
  #progress-pill { margin-left:auto; flex:none; font-size:11px; color:#e9c979; background:#241c12;
    border:1px solid #3a2c1a; border-radius:999px; padding:4px 10px; font-variant-numeric: tabular-nums; }

  /* ---- 시작 화면 ---- */
  #screen-start { flex:1 1 auto; display:none; flex-direction:column; align-items:center;
    justify-content:center; text-align:center; gap:16px; padding-bottom: 10vh; }
  #screen-start.show { display:flex; }
  #screen-start .big-icon { font-size:44px; }
  #screen-start h2 { margin:0; font-size:20px; color:#f0c96b; }
  #screen-start p { margin:0; font-size:13px; line-height:1.7; color:#cfc7de; max-width:420px; }
  #screen-start .stat-row { display:flex; gap:10px; margin-top:4px; }
  .stat-chip { background:#241c12; border:1px solid #3a2c1a; border-radius:12px; padding:8px 14px;
    font-size:12px; color:#d8ccb5; }
  .stat-chip b { display:block; font-size:18px; color:#f0c96b; font-variant-numeric: tabular-nums; }
  #start-btn { margin-top:10px; background:#c9b8f0; color:#0c0f14; border:none; text-decoration:none;
    padding:14px 32px; border-radius:999px; font-size:15px; font-weight:bold; cursor:pointer;
    font-family:inherit; }

  /* ---- 문제 화면 ---- */
  #screen-quiz { flex:1 1 auto; display:none; flex-direction:column; }
  #screen-quiz.show { display:flex; }
  #progress-track { position:relative; height:4px; border-radius:2px; background:#241c12; flex:none; margin-bottom:16px; }
  #progress-fill { position:absolute; left:0; top:0; height:100%; border-radius:2px; background:#d9a441; transition:width .3s; }
  .q-src { font-size:11px; color:#afa38f; margin-bottom:8px; }
  .q-passage { background:#1c150c; border:1px solid #3a2c1a; border-left:3px solid #d9a441; border-radius:8px;
    padding:12px 14px; font-size:13px; line-height:1.7; color:#cfc7de; margin-bottom:14px; white-space:pre-wrap; }
  .q-text { font-size:16px; line-height:1.6; margin-bottom:16px; font-weight:700; }
  .q-opts { display:flex; flex-direction:column; gap:8px; flex:none; }
  .q-opt { padding:13px 14px; border-radius:12px; border:1px solid #51432c; background:#2a2013; color:#f5ecd8;
    font-size:14px; text-align:left; font-family:inherit; cursor:pointer; line-height:1.5; }
  .q-opt .opt-num { color:#e9c979; margin-right:6px; }
  .q-opt.correct { background:#253d2c; border-color:#7faf8b; }
  .q-opt.wrong { background:#3d2622; border-color:#d96b5f; }
  .q-opt:disabled { opacity:.6; cursor:default; }
  .q-fb { margin-top:12px; font-size:13px; line-height:1.6; color:#d8ccb5; min-height:20px; }
  .q-next { text-align:right; margin-top:14px; }
  #next-btn { background:#c9b8f0; color:#0c0f14; border:none; padding:11px 24px; border-radius:999px;
    font-size:13px; font-weight:bold; cursor:pointer; font-family:inherit; opacity:0; pointer-events:none;
    transition:opacity .2s; }
  #next-btn.show { opacity:1; pointer-events:auto; }

  /* ---- 결과 화면 ---- */
  #screen-result { flex:1 1 auto; display:none; flex-direction:column; }
  #screen-result.show { display:flex; }
  .result-score { text-align:center; padding: 18px 0 22px; flex:none; }
  .result-score .num { font-size:44px; font-weight:bold; color:#f0c96b; font-family:"Gugi", "Gowun Batang", serif; }
  .result-score .denom { font-size:16px; color:#afa38f; }
  .result-score .msg { margin-top:6px; font-size:13px; color:#cfc7de; }
  .result-list { flex:1 1 auto; overflow-y:auto; }
  .result-item { background:#1c150c; border:1px solid #3a2c1a; border-radius:10px; padding:12px 14px; margin-bottom:8px; }
  .result-item .ri-q { font-size:13px; font-weight:700; margin-bottom:6px; line-height:1.5; }
  .result-item .ri-ans { font-size:12px; color:#9fd4ab; margin-bottom:4px; }
  .result-item .ri-mine { font-size:12px; color:#e79f95; margin-bottom:4px; }
  .result-item .ri-fb { font-size:12px; color:#b8a888; line-height:1.5; }
  .result-empty { text-align:center; padding:30px 0; color:#9fd4ab; font-size:14px; }
  .result-btns { flex:none; display:flex; gap:10px; margin-top:16px; }
  .result-btns a, .result-btns button { flex:1; text-align:center; text-decoration:none; font-family:inherit;
    border:1px solid #4a3c26; border-radius:12px; padding:12px; font-size:13px; cursor:pointer; }
  .result-btns .primary { background:#c9b8f0; color:#0c0f14; font-weight:bold; border:none; }
  .result-btns .secondary { background:#2a2013; color:#f5ecd8; }

  #loading { flex:1 1 auto; display:flex; align-items:center; justify-content:center; color:#afa38f; font-size:13px; }
</style>
</head>
<body>
<div id="wrap">
<div id="scroller">
<div id="app">

  <div class="topbar">
    <a id="back-btn" href="index.html" aria-label="챕터 목록으로"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></a>
    <div>
      <h1 id="era-title">기출문제 풀이</h1>
      <p class="sub" id="era-sub"></p>
    </div>
    <div id="progress-pill" style="display:none"></div>
  </div>

  <div id="loading">불러오는 중…</div>

  <div id="screen-start">
    <div class="big-icon">📜</div>
    <h2 id="start-title">기출문제 풀이</h2>
    <p>이 시대를 배경으로 한 실제 기출 스타일 5지선다 문제를 풀어봅니다. 게임 속 대사만으로 풀 수 있는지 확인해 보세요.</p>
    <div class="stat-row">
      <div class="stat-chip"><b id="stat-count">0</b>문항</div>
      <div class="stat-chip"><b id="stat-rounds">0</b>개 회차 기출 반영</div>
    </div>
    <button id="start-btn">시작하기 · Let's Go!</button>
  </div>

  <div id="screen-quiz">
    <div id="progress-track"><div id="progress-fill" style="width:0%"></div></div>
    <div class="q-src" id="q-src"></div>
    <div class="q-passage" id="q-passage" style="display:none"></div>
    <div class="q-text" id="q-text"></div>
    <div class="q-opts" id="q-opts"></div>
    <div class="q-fb" id="q-fb"></div>
    <div class="q-next"><button id="next-btn">다음 ▶</button></div>
  </div>

  <div id="screen-result">
    <div class="result-score">
      <span class="num" id="result-num">0</span><span class="denom" id="result-denom">/0</span>
      <div class="msg" id="result-msg"></div>
    </div>
    <div class="result-list" id="result-list"></div>
    <div class="result-btns">
      <button class="secondary" id="retry-btn">다시 풀기</button>
      <a class="primary" href="index.html">챕터 목록으로</a>
    </div>
  </div>

</div>
</div>
</div>

<script>
/* 가로모드 고정: index.html·게임 챕터들과 동일. */
function applyOrientation(){
  const iw = window.innerWidth, ih = window.innerHeight;
  document.body.classList.toggle('rot', ih > iw);
  const wrap = document.getElementById('wrap');
  if (ih > iw){ wrap.style.width = ih + 'px'; wrap.style.height = iw + 'px'; }
  else { wrap.style.width = iw + 'px'; wrap.style.height = ih + 'px'; }
}
window.addEventListener('resize', applyOrientation);
window.addEventListener('orientationchange', applyOrientation);
applyOrientation();

/* index.html의 ERAS 배열과 같은 순서 — era= 쿼리는 이 배열의 인덱스. */
const ERA_TITLES = ['선사·초기국가','고대','고려','조선 전기','조선 후기','근대·개항기','일제강점기','현대','시대 통합'];

const params = new URLSearchParams(location.search);
const eraIdx = parseInt(params.get('era'), 10);
const eraTitle = ERA_TITLES[eraIdx];

const els = {
  loading: document.getElementById('loading'),
  screenStart: document.getElementById('screen-start'),
  screenQuiz: document.getElementById('screen-quiz'),
  screenResult: document.getElementById('screen-result'),
  eraTitle: document.getElementById('era-title'),
  eraSub: document.getElementById('era-sub'),
  startTitle: document.getElementById('start-title'),
  statCount: document.getElementById('stat-count'),
  statRounds: document.getElementById('stat-rounds'),
  startBtn: document.getElementById('start-btn'),
  progressPill: document.getElementById('progress-pill'),
  progressFill: document.getElementById('progress-fill'),
  qSrc: document.getElementById('q-src'),
  qPassage: document.getElementById('q-passage'),
  qText: document.getElementById('q-text'),
  qOpts: document.getElementById('q-opts'),
  qFb: document.getElementById('q-fb'),
  nextBtn: document.getElementById('next-btn'),
  resultNum: document.getElementById('result-num'),
  resultDenom: document.getElementById('result-denom'),
  resultMsg: document.getElementById('result-msg'),
  resultList: document.getElementById('result-list'),
  retryBtn: document.getElementById('retry-btn'),
};

function formatSrc(src){
  if (!src || !src.length) return '';
  const rounds = [...src].sort((a,b) => a-b);
  const body = rounds.length <= 2 ? rounds.join(', ') + '회' : `${rounds[0]}회 등 ${rounds.length}개 회차`;
  return '기출 출처 · ' + body;
}

function shuffle(arr){
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

let pool = [];
let queue = [];
let qIdx = 0;
let answered = false;
let optButtons = [];
let order = [];
let mistakes = [];

function showScreen(name){
  els.screenStart.classList.toggle('show', name === 'start');
  els.screenQuiz.classList.toggle('show', name === 'quiz');
  els.screenResult.classList.toggle('show', name === 'result');
  els.progressPill.style.display = name === 'quiz' ? '' : 'none';
}

function startSession(){
  queue = shuffle(pool);
  qIdx = 0;
  mistakes = [];
  showScreen('quiz');
  renderQuestion();
}

function renderQuestion(){
  answered = false;
  const data = queue[qIdx];
  els.progressPill.textContent = `${qIdx + 1} / ${queue.length}`;
  els.progressFill.style.width = (qIdx / queue.length * 100) + '%';
  els.qSrc.textContent = formatSrc(data.src);
  if (data.passage){
    els.qPassage.style.display = '';
    els.qPassage.textContent = data.passage;
  } else {
    els.qPassage.style.display = 'none';
    els.qPassage.textContent = '';
  }
  els.qText.textContent = data.q;
  els.qFb.textContent = '';
  els.nextBtn.classList.remove('show');

  order = data.opts.map((_, i) => i);
  order = shuffle(order);
  els.qOpts.innerHTML = '';
  optButtons = order.map((origIdx, i) => {
    const b = document.createElement('button');
    b.className = 'q-opt';
    b.innerHTML = `<span class="opt-num">${i + 1}.</span>${data.opts[origIdx]}`;
    b.onclick = () => pick(i);
    els.qOpts.appendChild(b);
    return b;
  });
}

function pick(i){
  if (answered) return;
  const data = queue[qIdx];
  const correct = order[i] === data.answer;
  if (correct){
    answered = true;
    optButtons[i].classList.add('correct');
    optButtons.forEach(b => b.disabled = true);
    els.qFb.textContent = data.feedback[1];
    els.nextBtn.classList.add('show');
  } else {
    optButtons[i].classList.add('wrong');
    optButtons[i].disabled = true;
    els.qFb.textContent = data.feedback[0];
    mistakes.push({ q: data.q, correctText: data.opts[data.answer], myText: data.opts[order[i]], feedback: data.feedback[1] });
  }
}

els.nextBtn.onclick = () => {
  qIdx++;
  if (qIdx >= queue.length){
    finishSession();
    return;
  }
  renderQuestion();
};

function finishSession(){
  const total = queue.length;
  const correct = total - new Set(mistakes.map(m => m.q)).size;
  els.progressFill.style.width = '100%';
  showScreen('result');
  els.resultNum.textContent = correct;
  els.resultDenom.textContent = '/' + total;
  const pct = Math.round(correct / total * 100);
  els.resultMsg.textContent = pct >= 90
    ? '훌륭해요! 이 시대는 게임 대사만으로 충분히 풀 수 있어요.'
    : pct >= 70
    ? '꽤 잘했어요. 틀린 문제만 다시 확인해 보세요.'
    : '이 시대 챕터를 한 번 더 플레이하고 오면 좋을 것 같아요.';

  els.resultList.innerHTML = '';
  const uniqMistakes = [];
  const seen = new Set();
  mistakes.forEach(m => { if (!seen.has(m.q)){ seen.add(m.q); uniqMistakes.push(m); } });
  if (!uniqMistakes.length){
    els.resultList.innerHTML = '<div class="result-empty">틀린 문제가 없어요 — 만점입니다!</div>';
  } else {
    uniqMistakes.forEach(m => {
      const div = document.createElement('div');
      div.className = 'result-item';
      div.innerHTML = `<div class="ri-q">${m.q}</div>
        <div class="ri-mine">내가 고른 답 · ${m.myText}</div>
        <div class="ri-ans">정답 · ${m.correctText}</div>
        <div class="ri-fb">${m.feedback}</div>`;
      els.resultList.appendChild(div);
    });
  }
}

els.startBtn.onclick = startSession;
els.retryBtn.onclick = () => { showScreen('start'); };

if (!eraTitle){
  els.loading.textContent = '이 시대를 찾을 수 없어요. 챕터 목록에서 다시 들어와 주세요.';
} else {
  fetch('assets/data/exam_variants.json')
    .then(r => r.json())
    .then(all => {
      pool = all.filter(item => item.era === eraTitle);
      const allRounds = new Set();
      pool.forEach(item => (item.src || []).forEach(r => allRounds.add(r)));
      els.loading.style.display = 'none';
      els.eraTitle.textContent = eraTitle + ' · 기출문제';
      els.eraSub.textContent = '실제 기출 발문 형식을 흉내 낸 연습 문제';
      els.startTitle.textContent = eraTitle;
      els.statCount.textContent = pool.length;
      els.statRounds.textContent = allRounds.size;
      showScreen('start');
    })
    .catch(() => { els.loading.textContent = '문제를 불러오지 못했어요. 새로고침해 주세요.'; });
}
</script>
</body>
</html>
