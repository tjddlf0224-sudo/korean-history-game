<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>한국사 게임 - 일제강점기 7화 임정의 부활</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; overscroll-behavior: none; background: #000; font-family: "Gowun Batang", -apple-system, "Malgun Gothic", serif; }
  #wrap { position: fixed; top: 0; left: 0; touch-action: none; transform-origin: top left; }
  body.rot #wrap { transform: rotate(90deg) translateY(-100%); }
  #game { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #hud { position: absolute; top: calc(10px + env(safe-area-inset-top)); left: calc(12px + env(safe-area-inset-left));
    color: #f5f0e6; font-size: 14px; text-shadow: 0 1px 3px rgba(0,0,0,.8); z-index: 5; }
  #hud .sub { font-size: 11px; opacity: .75; margin-top: 2px; }
  #stick-zone { position: absolute; left: calc(18px + env(safe-area-inset-left)); bottom: calc(18px + env(safe-area-inset-bottom));
    width: 130px; height: 130px; z-index: 6; touch-action: none; }
  #stick-base { position: absolute; inset: 0; border-radius: 50%; background: rgba(255,255,255,0.12); border: 2px solid rgba(255,255,255,0.25); }
  #stick-knob { position: absolute; width: 52px; height: 52px; left: 39px; top: 39px; border-radius: 50%; background: rgba(255,255,255,0.55); transition: transform .05s linear; }
  #act-btn { position: absolute; right: calc(22px + env(safe-area-inset-right)); bottom: calc(34px + env(safe-area-inset-bottom));
    width: 68px; height: 68px; border-radius: 50%; border: none; touch-action: none;
    background: #c9d9e8; color: #16202b; box-shadow: 0 4px 10px rgba(0,0,0,.4);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity .15s; z-index: 6; }
  #act-btn.show { opacity: 1; pointer-events: auto; }
  .ov { position: absolute; inset: 0; z-index: 20; display: none; align-items: flex-end; justify-content: center; background: rgba(0,0,0,0.35); }
  .ov.show { display: flex; }
  .ov.center { align-items: center; }
  #intro-overlay { background: #0b1116; }
  #dlg-panel, #intro-panel {
    width: 100%; max-width: 640px; margin: 0 16px calc(16px + env(safe-area-inset-bottom)); background: #14202aee; border: 2px solid #4a6a82;
    border-radius: 14px; padding: 16px 18px; color: #dce8f0; box-shadow: 0 8px 24px rgba(0,0,0,.5);
    max-height: 80%; overflow-y: auto;
  }
  .dlg-top { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .dlg-portrait { width: 44px; height: 44px; border-radius: 50%; background: #2a3a4a; flex: none; display:flex; align-items:center; justify-content:center; font-size:20px; background-size: cover; background-position: center 15%; }
  .dlg-name { font-weight: bold; font-size: 15px; color: #9dc3e0; }
  .dlg-tag { font-size: 11px; opacity: .7; }
  .dlg-box { font-size: 18px; line-height: 1.6; min-height: 54px; white-space: pre-wrap; }
  .dlg-next { text-align: right; margin-top: 10px; font-size: 13px; opacity: .8; cursor: pointer; }
  .dlg-next .arrow { display: inline-block; margin-left: 4px; animation: nudge 1s infinite; }
  @keyframes nudge { 0%,100%{transform:translateX(0);} 50%{transform:translateX(4px);} }
  #intro-panel { }
  #intro-text { font-size: 18px; line-height: 1.6; min-height: 40px; white-space: pre-wrap; }
  #intro-next { margin-top: 14px; font-size: 13px; opacity: .8; }
  #fade { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity .6s; z-index: 30; }
  #fade.show { opacity: 1; pointer-events: auto; }
  #end-screen { position: absolute; inset: 0; z-index: 40; display: none; align-items: center; justify-content: center;
    background: #000; color: #9dc3e0; text-align: center; padding: 24px; }
  #end-screen.show { display: flex; }
  #end-screen h2 { font-size: 20px; margin-bottom: 10px; }
  #end-screen p { color: #c3d3dc; font-size: 14px; line-height: 1.7; }
  #end-screen a { display: inline-block; margin: 10px 8px 0; color: #0b1116; background: #9dc3e0; text-decoration: none;
    padding: 10px 22px; border-radius: 999px; font-size: 14px; font-weight: bold; }

  /* 미니맵: 반드시 #wrap 안에 둬야 한다. #wrap의 rotate(90deg)를 같이 물려받아야
     플레이어가 폰을 돌려서 보는 시야 기준으로 똑바로, 우상단에 놓이기 때문.
     (밖으로 빼서 position:fixed로 "물리적 화면 우상단"에 고정하면, 폰을 돌려
     보는 순간 그 지점은 시야의 좌상단이 되고 게임 화면만 회전돼 있어서
     미니맵만 90도 틀어져 보인다 — 실제로 그렇게 만들었다가 되돌린 부분.) */
  #minimap-canvas { position: absolute; top: calc(10px + env(safe-area-inset-top)); right: calc(10px + env(safe-area-inset-right));
    width: 160px; height: 90px; border: 2px solid #d9a441; border-radius: 6px; z-index: 4;
    box-shadow: 0 2px 8px rgba(0,0,0,.4); background: #1a140c; }

  /* 마지막 대사까지 다 들어도 곧장 챕터가 끝나지 않고, 이 버튼을
     눌러야만 끝난다 — 그 전까지는 계속 돌아다니며 다른 NPC와 대화 가능. */
  #next-chapter-btn { position: absolute; left: 50%; top: calc(14px + env(safe-area-inset-top)); transform: translateX(-50%);
    background: #d9a441; color: #2b1d0e; border: none; border-radius: 999px; padding: 10px 20px;
    font-size: 14px; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,.4);
    opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 7; }
  #next-chapter-btn.show { opacity: 1; pointer-events: auto; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
  <div id="hud">
    <div>일제강점기 7화 · 임정의 부활</div>
    <div class="sub">1931~1932년, 상하이 · 훙커우공원</div>
  </div>
  <div id="stick-zone"><div id="stick-base"><div id="stick-knob"></div></div></div>
  <button id="act-btn" onclick="Stage.interact()">
    <svg viewBox="0 0 24 24" width="30" height="30" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M4 5.5C4 4.67 4.67 4 5.5 4h13C19.33 4 20 4.67 20 5.5v9c0 .83-.67 1.5-1.5 1.5H9.8l-3.9 3.4c-.5.44-1.27.08-1.27-.58V16h-.13C3.67 16 3 15.33 3 14.5v-9C3 4.67 3.67 4 4.5 4"
        stroke="#16202b" stroke-width="1.6" stroke-linejoin="round" fill="#16202b" fill-opacity="0.06"/>
      <circle cx="8.3" cy="9.8" r="1.15" fill="#16202b"/><circle cx="12" cy="9.8" r="1.15" fill="#16202b"/><circle cx="15.7" cy="9.8" r="1.15" fill="#16202b"/>
    </svg>
  </button>
  <div class="ov show" id="intro-overlay">
    <div id="intro-panel"><div id="intro-text"></div><div id="intro-next">탭하여 계속 ▶</div></div>
  </div>
  <div class="ov" id="dlg-overlay">
    <div id="dlg-panel">
      <div class="dlg-top">
        <div class="dlg-portrait" id="dlg-portrait">👤</div>
        <div><div class="dlg-tag" id="dlg-tag"></div><div class="dlg-name" id="dlg-name"></div></div>
      </div>
      <div class="dlg-box" id="dlg-text"></div>
      <div class="dlg-next" id="dlg-next">계속 <span class="arrow">▶</span></div>
    </div>
  </div>
  <button id="next-chapter-btn" onclick="Stage.endChapter()">다음 화로 가기 ▶</button>

  <div id="fade"></div>
  <div id="end-screen">
    <div>
      <h2>임정의 부활 — 끝</h2>
      <p>이봉창의 도쿄 의거, 윤봉길의 훙커우공원 의거로<br>임시정부는 다시 국제 사회의 주목을 받았다.</p>
      <p style="margin-top:14px; opacity:.75;">중국 국민당의 지원이 시작되며, 개별 의거의 시대는 저물고<br>조직적인 무장투쟁의 새 장이 열린다.</p>
      <a href="index.html">챕터 목록으로</a>
    </div>
  </div>
  <canvas id="minimap-canvas"></canvas>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let VIEW_W = 0, VIEW_H = 0;   // 논리 픽셀 기준 화면 크기(DPR 스케일 전)
const wrapEl = document.getElementById('wrap');
/* 모바일 브라우저는 주소창이 늦게 접히거나 펼쳐지면서 innerWidth/innerHeight가
   한 박자 늦게 바뀌는 경우가 있다(특히 iOS Safari). visualViewport가 있으면
   그쪽이 실제 보이는 영역을 더 정확히 반영하므로 우선 사용한다. */
function getViewportSize(){
  const vv = window.visualViewport;
  // 핀치줌이 걸리면 vv.width/height가 확대 배율만큼 줄어든다. 그 값을 그대로 쓰면
  // #wrap이 축소되면서 화면이 "확대된 채로" 굳어 되돌릴 수 없었다(실제 발생).
  // 줌이 걸린 동안은 레이아웃 뷰포트를 써서 레이아웃이 줌을 따라가지 않게 한다.
  if (vv && (vv.scale || 1) <= 1.01) return { w: vv.width, h: vv.height };
  return { w: window.innerWidth, h: window.innerHeight };
}

/* ============ 확대(핀치줌·더블탭줌) 차단 ============
   iOS Safari는 접근성 정책상 viewport meta의 user-scalable=no를 무시하므로
   JS로 직접 막는다. 위 getViewportSize의 폴백과 2중 방어. */
['gesturestart','gesturechange','gestureend'].forEach(function(ev){
  document.addEventListener(ev, function(e){ e.preventDefault(); }, { passive: false });
});
document.addEventListener('touchmove', function(e){
  if (e.touches.length > 1) e.preventDefault();          // 두 손가락 = 핀치
}, { passive: false });
var __lastTouchEnd = 0;
document.addEventListener('touchend', function(e){
  var now = Date.now();
  if (now - __lastTouchEnd <= 300) e.preventDefault();   // 더블탭 줌
  __lastTouchEnd = now;
}, { passive: false });
function applyOrientation(){
  const { w: iw, h: ih } = getViewportSize();
  const portrait = ih > iw;
  document.body.classList.toggle('rot', portrait);
  const w = portrait ? ih : iw, h = portrait ? iw : ih;
  wrapEl.style.width = w + 'px'; wrapEl.style.height = h + 'px';
  // 디스플레이 배율(DPR) 대응: 백킹 스토어를 물리 픽셀만큼 키우고 컨텍스트를 그만큼
  // 스케일해 둔다. 이걸 빼면 캔버스가 논리 픽셀 1배로 그려진 뒤 브라우저가 2~3배로
  // 늘려서 배경/NPC/주인공이 전부 뭉개진다(ch0_phaser의 resolution 옵션과 동일한 취지).
  // 이후 드로잉 코드는 전부 논리 픽셀(VIEW_W/VIEW_H)만 쓰면 된다.
  const dpr = Math.min(3, window.devicePixelRatio || 1);
  VIEW_W = w; VIEW_H = h;
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
}
window.addEventListener('resize', applyOrientation);
window.addEventListener('orientationchange', () => setTimeout(applyOrientation, 80));
if (window.visualViewport){
  window.visualViewport.addEventListener('resize', applyOrientation);
  window.visualViewport.addEventListener('scroll', applyOrientation);
}
// 일부 모바일 브라우저는 주소창이 애니메이션으로 늦게 접혀서, 로드 직후 한 번 더 재확인한다.
setTimeout(applyOrientation, 300);
setTimeout(applyOrientation, 800);
applyOrientation();

/* ============ 구역: 상하이 임시정부 청사(단일 구역, 실사 배경) ============ */
const BG_W = 1376, BG_H = 768, ZOOM = 1.6;
/* 배리어 디버그 격자: URL에 ?debug=1 붙이면 isBarrierPx()가 막힌 곳을
   빨간 점 격자로 표시해서 눈으로 바로 확인할 수 있다(책상 등 가구
   배리어를 배경 그림과 맞춰 잡을 때, 좌표를 눈대중으로 추측하다 계속
   틀렸던 문제의 재발 방지용). */
const DEBUG_GRID = new URLSearchParams(location.search).get('debug') === '1';
const ZONES = {
  imjeong: {
    img: 'assets/scenes/ilje_ch7_imjeong.png', label: '임시정부 청사',
    spawn: { x: 1050, y: 660 },
    barriers: [
      { x0:460, y0:190, x1:790, y1:340 }, // 위쪽 책상
      { x0:460, y0:380, x1:790, y1:530 }, // 아래쪽 책상
      { x0:860, y0:40, x1:1200, y1:200 }, // 서가
    ],
    npcs: [
      { id: 'gimgu', name: '김구', x: 900, y: 260, img: 'assets/portraits/gimgu.png', look: { role: 'scholar', body: '#2a3a4a', accent: '#9dc3e0' } },
      { id: 'yunbonggil', name: '윤봉길', x: 900, y: 460, img: 'assets/portraits/yunbonggil.png', look: { role: 'commoner', body: '#3a4a52', accent: '#c9d9e8', headband:true } },
    ],
    exits: [],
  },
};
const zoneImgs = {};
for (const id in ZONES){ const im = new Image(); im.src = ZONES[id].img; zoneImgs[id] = im; }
function isBarrierPx(zoneId, x, y){
  if (x < 6 || y < 6 || x >= BG_W-6 || y >= BG_H-6) return true;
  for (const b of ZONES[zoneId].barriers){ if (x >= b.x0 && x <= b.x1 && y >= b.y0 && y <= b.y1) return true; }
  return false;
}
const NPCS = ZONES.imjeong.npcs;
const PLAYER_LOOK = { role: 'commoner', body: '#c94f4f', accent: '#e0b94a' };

/* ============ 주인공(학생) 스프라이트: 프로시저럴 실루엣 대신 실사 이미지 사용.
   ch0_phaser와 동일한 4방향 걷기 시트를 그대로 재사용(같은 인물이므로 전 챕터 공통). */
/* 주의(재발 방지): assets/player/left_*.png·right_*.png 원본 파일 자체가 좌우
   내용이 뒤바뀌어 있음(ch0_phaser에서 이미 발견/수정된 문제, DIR_SRC로 보정).
   여기서도 동일하게 보정하지 않으면 왼쪽으로 이동 시 오른쪽을 보는 등 반대로 렌더됨. */
const DIR_SRC = { down:'down', up:'up', left:'right', right:'left' };
const PLAYER_SPRITES = {};
['down','up','left','right'].forEach(dir => {
  const src = DIR_SRC[dir];
  PLAYER_SPRITES[dir] = [0,1,2].map(i => { const im = new Image(); im.src = `assets/player/${src}_${i}.png`; return im; });
});
const DIR_NAME = { u:'up', d:'down', l:'left', r:'right' };
function drawPlayerSprite(px, py, facing, moving){
  ctx.fillStyle = 'rgba(0,0,0,.28)';
  ctx.beginPath(); ctx.ellipse(px, py + 23, 20, 8, 0, 0, Math.PI*2); ctx.fill();
  const dir = DIR_NAME[facing] || 'down';
  const frames = PLAYER_SPRITES[dir];
  const seq = [0, 1, 0, 2];
  const idx = moving ? seq[Math.floor(performance.now()/140) % seq.length] : 0;
  const img = frames[idx];
  if (!img.complete || !img.naturalWidth) return;
  const H = 88, W = H * (img.naturalWidth / img.naturalHeight);
  ctx.drawImage(img, px - W/2, py - H*0.68, W, H);
}


/* ============ NPC 실사 초상 스프라이트: 초상화가 있는 NPC는 프로시저럴
   실루엣 대신 실제 이미지를 필드에도 그린다(ch0_phaser와 동일하게). */
const NPC_SPRITE_CACHE = {};
function getNpcImg(path){
  if (!NPC_SPRITE_CACHE[path]){ const im = new Image(); im.src = path; NPC_SPRITE_CACHE[path] = im; }
  return NPC_SPRITE_CACHE[path];
}
function drawNpcSprite(px, py, imgPath){
  ctx.fillStyle = 'rgba(0,0,0,.28)';
  ctx.beginPath(); ctx.ellipse(px, py + 23, 20, 8, 0, 0, Math.PI*2); ctx.fill();
  const img = getNpcImg(imgPath);
  if (!img.complete || !img.naturalWidth) return;
  const H = 88, W = H * (img.naturalWidth / img.naturalHeight);
  ctx.drawImage(img, px - W/2, py - H*0.68, W, H);
}

function drawCharacter(px, py, facing, look){
  const role = (look && look.role) || 'commoner';
  const body = (look && look.body) || '#8a6d3b', accent = (look && look.accent) || '#c9a24a';
  const eo = facing === 'l' ? -2 : facing === 'r' ? 2 : 0;
  ctx.save(); ctx.translate(px, py);
  ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(0, 16, 12, 5, 0, 0, Math.PI*2); ctx.fill();
  if (role === 'scholar'){
    ctx.fillStyle = body;
    ctx.beginPath(); ctx.moveTo(-5,-8); ctx.lineTo(5,-8); ctx.lineTo(10,14); ctx.lineTo(-10,14); ctx.closePath(); ctx.fill();
    ctx.fillStyle = accent; ctx.fillRect(-10,4,20,3);
    ctx.fillStyle = '#f1c79a'; ctx.beginPath(); ctx.arc(0,-14,10,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#1c1a16'; ctx.beginPath(); ctx.ellipse(0,-21,8,5,0,Math.PI,0); ctx.fill();
    ctx.fillRect(-8,-22,16,4);
  } else {
    ctx.fillStyle = body; ctx.fillRect(-9,-6,18,20);
    ctx.strokeStyle = accent; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-9,-6); ctx.lineTo(0,2); ctx.lineTo(9,-6); ctx.stroke();
    ctx.fillStyle = '#f1c79a'; ctx.beginPath(); ctx.arc(0,-14,10,0,Math.PI*2); ctx.fill();
    if (look.headband){ ctx.fillStyle = accent; ctx.fillRect(-10,-18,20,3); }
  }
  ctx.fillStyle = '#2b2015';
  ctx.beginPath(); ctx.arc(eo-3,-14,1.4,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(eo+3,-14,1.4,0,Math.PI*2); ctx.fill();
  ctx.restore();
}
function overlayOpen(){ return !!document.querySelector('.ov.show') || document.getElementById('end-screen').classList.contains('show'); }
const World = {
  zone: 'imjeong', px: ZONES.imjeong.spawn.x, py: ZONES.imjeong.spawn.y, facing: 'd', speed: 165,
  stick: { active: false, dx: 0, dy: 0 }, keys: { l:false, r:false, u:false, d:false }, paused: false, nearNpc: null, lastT: 0,
  canStand(x, y){
    const pad = 16;
    if (isBarrierPx(this.zone, x-pad, y-pad) || isBarrierPx(this.zone, x+pad, y-pad) ||
        isBarrierPx(this.zone, x-pad, y+pad) || isBarrierPx(this.zone, x+pad, y+pad)) return false;
    for (const n of ZONES[this.zone].npcs){ if (Math.hypot(n.x - x, n.y - y) < 34) return false; }
    return true;
  },
  update(dt){
    if (this.paused || overlayOpen()) return;
    let vx = this.stick.dx, vy = this.stick.dy;
    if (this.keys.l) vx -= 1; if (this.keys.r) vx += 1; if (this.keys.u) vy -= 1; if (this.keys.d) vy += 1;
    const len = Math.hypot(vx, vy);
    this.moving = len > 0.05;
    if (this.moving){
      vx /= len; vy /= len;
      if (Math.abs(vx) > Math.abs(vy)) this.facing = vx > 0 ? 'r' : 'l'; else this.facing = vy > 0 ? 'd' : 'u';
      const nx = this.px + vx * this.speed * dt, ny = this.py + vy * this.speed * dt;
      if (this.canStand(nx, this.py)) this.px = nx;
      if (this.canStand(this.px, ny)) this.py = ny;
    }
    this.checkNpc();
  },
  checkNpc(){
    // ch0_phaser와 동일한 2단계 거리(멀면 !, 가까우면 이름)로 통일
    const SHOW_RANGE = 192, INTERACT_RANGE = 108.8;
    let shown = null, best = SHOW_RANGE;
    for (const n of NPCS){
      const d = Math.hypot(n.x - this.px, n.y - this.py);
      if (d < best){ best = d; shown = n; }
    }
    this.nearNpcShown = shown;
    const found = (shown && best < INTERACT_RANGE) ? shown : null;
    if (found !== this.nearNpc){ this.nearNpc = found; document.getElementById('act-btn').classList.toggle('show', !!found); }
  },
  render(){
    const img = zoneImgs[this.zone];
    const viewW = VIEW_W / ZOOM, viewH = VIEW_H / ZOOM;
    const camX = Math.max(0, Math.min(Math.max(0, BG_W - viewW), this.px - viewW/2));
    const camY = Math.max(0, Math.min(Math.max(0, BG_H - viewH), this.py - viewH/2));
    ctx.fillStyle = '#1a140c'; ctx.fillRect(0, 0, VIEW_W, VIEW_H);
    if (img.complete && img.naturalWidth){
      const srcW = Math.min(viewW, BG_W), srcH = Math.min(viewH, BG_H);
      ctx.drawImage(img, camX, camY, srcW, srcH, 0, 0, srcW*ZOOM, srcH*ZOOM);
    }
    ctx.save(); ctx.scale(ZOOM, ZOOM);
    for (const n of NPCS){ if (!n.img) drawCharacter(n.x - camX, n.y - camY, 'd', n.look); }
    ctx.restore();
    for (const n of NPCS){ if (n.img) drawNpcSprite((n.x - camX) * ZOOM, (n.y - camY) * ZOOM, n.img); }
    drawPlayerSprite((this.px - camX) * ZOOM, (this.py - camY) * ZOOM, this.facing, this.moving);
    if (this.nearNpcShown){
      const n = this.nearNpcShown;
      const sx = (n.x - camX) * ZOOM, sy = (n.y - camY) * ZOOM;
      ctx.fillStyle = '#9dc3e0'; ctx.font = 'bold 16px sans-serif'; ctx.textAlign = 'center';
      if (n === this.nearNpc){
        ctx.fillText(n.name, sx, sy - 66);
      } else {
        const key = Stage.keyFor(n.id);
        if (!key || !seenDialogKeys.has(key)) ctx.fillText('!', sx, sy - 66);
      }
    }
    if (DEBUG_GRID){
      const step = 16;
      for (let gx = 0; gx < BG_W; gx += step){
        for (let gy = 0; gy < BG_H; gy += step){
          if (!isBarrierPx(this.zone, gx, gy)) continue;
          const sx2 = (gx - camX) * ZOOM, sy2 = (gy - camY) * ZOOM;
          if (sx2 < -step*ZOOM || sx2 > VIEW_W || sy2 < -step*ZOOM || sy2 > VIEW_H) continue;
          ctx.fillStyle = 'rgba(255,40,40,0.45)';
          ctx.fillRect(sx2 - 2, sy2 - 2, 4, 4);
        }
      }
      ctx.fillStyle = '#fff'; ctx.font = 'bold 12px monospace'; ctx.textAlign = 'left';
      ctx.fillText(`DEBUG px:(${Math.round(this.px)},${Math.round(this.py)}) zone:${this.zone}`, 6, VIEW_H - 8);
    }
    const vg = ctx.createRadialGradient(VIEW_W/2, VIEW_H/2, VIEW_H*0.3, VIEW_W/2, VIEW_H/2, VIEW_H*0.8);
    vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,.45)');
    ctx.fillStyle = vg; ctx.fillRect(0, 0, VIEW_W, VIEW_H);
  }
};
(function bindStick(){
  const zone = document.getElementById('stick-zone'), knob = document.getElementById('stick-knob');
  let activeId = null, cx = 0, cy = 0; const R = 44;
  zone.addEventListener('pointerdown', e=>{
    if (activeId !== null) return; activeId = e.pointerId;
    try { zone.setPointerCapture(activeId); } catch(err) {}
    const r = zone.getBoundingClientRect(); cx = r.left + r.width/2; cy = r.top + r.height/2;
    World.stick.active = true; move(e);
  });
  zone.addEventListener('pointermove', move); zone.addEventListener('pointerup', end); zone.addEventListener('pointercancel', end);
  function move(e){
    if (e.pointerId !== activeId) return;
    let dx = e.clientX - cx, dy = e.clientY - cy; const d = Math.hypot(dx, dy);
    if (d > R){ dx = dx/d*R; dy = dy/d*R; }
    let wx = dx, wy = dy; if (document.body.classList.contains('rot')){ wx = dy; wy = -dx; }
    // 조이스틱 손잡이는 #wrap 안에 있어서 translate가 '회전된' 좌표계로
    // 해석된다. 화면 델타(dx,dy)를 그대로 주면 손잡이만 90도 틀어져
    // 보인다(이동은 멀쩡한데 손잡이만 오른쪽으로 꺾이던 문제). 이동에
    // 쓰는 값과 똑같은 wx,wy로 그려서 손가락·주인공·손잡이를 일치시킨다.
    knob.style.transform = `translate(${wx}px,${wy}px)`;
    World.stick.dx = wx / R; World.stick.dy = wy / R;
  }
  function end(e){ if (e.pointerId !== activeId) return; activeId = null; World.stick.active = false; World.stick.dx = 0; World.stick.dy = 0; knob.style.transform = 'translate(0,0)'; }
})();
window.addEventListener('keydown', e=>{
  if (e.key === ' ' || e.key === 'Enter'){
    e.preventDefault();
    if (document.getElementById('intro-overlay').classList.contains('show')) { introNext(); return; }
    if (document.getElementById('dlg-overlay').classList.contains('show')) { Dialog.next(); return; }
    Stage.interact(); return;
  }
  if (overlayOpen()) return;
  if (['ArrowLeft','a','A'].includes(e.key)) World.keys.l = true;
  if (['ArrowRight','d','D'].includes(e.key)) World.keys.r = true;
  if (['ArrowUp','w','W'].includes(e.key)) World.keys.u = true;
  if (['ArrowDown','s','S'].includes(e.key)) World.keys.d = true;
});
window.addEventListener('keyup', e=>{
  if (['ArrowLeft','a','A'].includes(e.key)) World.keys.l = false;
  if (['ArrowRight','d','D'].includes(e.key)) World.keys.r = false;
  if (['ArrowUp','w','W'].includes(e.key)) World.keys.u = false;
  if (['ArrowDown','s','S'].includes(e.key)) World.keys.d = false;
});

/* 사료 근거: 한국민족문화대백과사전 "한인애국단" E0061905.
   아래 대사는 위 사료를 참고해 새로 창작한 것이며 원문을 그대로 옮긴 것이 아님. */
const NPC_DATA = {
  gimgu_0: {
    name:'김구', icon:'🎯', img:'assets/portraits/gimgu.png',
    beats: [
      { t:'임시정부가 상하이에서 힘을 잃어가고 있네. 국민대표회의도 결렬되고, 자금도 인력도 바닥이야.' },
      { t:'나는 특무대를 하나 조직하기로 했네 — 한인애국단이라 부르겠네. 이제부터 다시, 우리가 살아있다는 걸 보여줄 것이야.' },
      { t:'(1931년 12월) 이봉창 동지, 자네의 뜻이 확고하다면… 도쿄로 가주게.' },
    ]
  },
  gimgu_1: {
    name:'김구', icon:'💥', img:'assets/portraits/gimgu.png',
    beats: [
      { t:'(1932년 1월) 이봉창 동지가 도쿄에서 일왕의 마차 행렬에 폭탄을 던졌다는 소식이다. 명중하지는 못했지만, 전 세계가 우리의 존재를 다시 알게 됐네.' },
      { t:'윤봉길 동지, 이번엔 상하이 훙커우공원일세. 일본이 상하이사변 전승을 기념하는 큰 행사를 연다더군.' },
      { t:'(윤봉길이 결연하게 고개를 끄덕인다.) …자네의 결심, 잊지 않겠네.' },
    ]
  },
  yunbonggil_0: {
    name:'윤봉길', icon:'🍱', img:'assets/portraits/yunbonggil.png',
    beats: [
      { t:'1932년 4월 29일, 훙커우공원. 일본 군부와 관료들이 단상에 모두 모여 있습니다.' },
      { t:'(물통 모양 폭탄을 던진다) …' },
      { t:'(내레이션) 시라카와 군사령관을 비롯해 여러 명이 그 자리에서 살상당했다. 윤봉길은 현장에서 체포되어 그해 12월 순국했다.' },
      { t:'(내레이션) 이 의거를 계기로 중국 국민당 장제스가 "한국의 한 청년이 우리 백만 대군도 못한 일을 해냈다"며 임시정부를 적극 지원하기 시작했다.' },
    ],
    endsChapter: true
  }
};
const Stage = {
  state: { talkStage: 0 },
  keyFor(id){
    if (id === 'gimgu') return 'gimgu_' + Math.min(Stage.state.talkStage, 1);
    if (id === 'yunbonggil') return 'yunbonggil_0';
    return null;
  },
  interact(){
    if (document.querySelector('.ov.show')) return;
    const n = World.nearNpc; if (!n) return;
    const key = Stage.keyFor(n.id);
    if (key) Dialog.open(key, n);
  }
};
const seenDialogKeys = new Set();
const Dialog = {
  key: null, npc: null, idx: 0, data: null,
  open(key, npc){
    this.key = key; this.npc = npc; this.idx = 0; this.data = NPC_DATA[key];
    seenDialogKeys.add(key);
    World.paused = true;
    document.getElementById('dlg-overlay').classList.add('show');
    document.getElementById('dlg-name').textContent = this.data.name;
    document.getElementById('dlg-tag').textContent = '1931~1932년 · 상하이';
    document.getElementById('dlg-portrait').textContent = this.data.icon;
    this.render();
  },
  render(){ document.getElementById('dlg-text').textContent = this.data.beats[this.idx].t; },
  next(){ this.idx++; if (this.idx >= this.data.beats.length){ this.finish(); return; } this.render(); },
  finish(){
    document.getElementById('dlg-overlay').classList.remove('show');
    World.paused = false;
    if (this.npc.id === 'gimgu'){ Stage.state.talkStage = Math.min(Stage.state.talkStage + 1, 1); }
    if (this.data.endsChapter){ document.getElementById('next-chapter-btn').classList.add('show'); }
  }
};
document.getElementById('dlg-panel').addEventListener('click', () => Dialog.next());

const INTRO_LINES = [
  '1930년대 초, 상하이 임시정부는 국민대표회의 결렬 이후 큰 힘을 잃은 상태였다.',
  '자금도, 인력도 바닥난 상황 속에서 김구는 특단의 결단을 내린다.',
  '한인애국단 — 다시 한번, 이 나라가 살아있음을 세계에 알릴 조직이다.'
];
let introIdx = 0;
function renderIntro(){ document.getElementById('intro-text').textContent = INTRO_LINES[introIdx]; }
function introNext(){
  introIdx++;
  if (introIdx >= INTRO_LINES.length){
    const fade = document.getElementById('fade'); fade.classList.add('show');
    setTimeout(() => { document.getElementById('intro-overlay').classList.remove('show'); fade.classList.remove('show'); }, 600);
    return;
  }
  renderIntro();
}
document.getElementById('intro-panel').addEventListener('click', introNext);
renderIntro();
Stage.endChapter = function(){ document.getElementById('end-screen').classList.add('show'); };

/* ============ 미니맵: #wrap 안의 독립된 2D 캔버스에 매 프레임 직접 그린다
   (Phaser 카메라나 게임 캔버스와 별개). 타일맵(MAP/TILE_COLOR)을 그대로 축소해서 사용. */
const miniCanvas = document.getElementById('minimap-canvas');
const miniCtx = miniCanvas.getContext('2d');
function sizeMinimapCanvas(){
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  miniCanvas.width = Math.round(160 * dpr);
  miniCanvas.height = Math.round(90 * dpr);
}
sizeMinimapCanvas();
window.addEventListener('resize', sizeMinimapCanvas);
function drawMinimap(){
  const w = miniCanvas.width, h = miniCanvas.height;
  const img = zoneImgs[World.zone];
  const sx = w / BG_W, sy = h / BG_H;
  miniCtx.clearRect(0, 0, w, h);
  if (img.complete && img.naturalWidth){ miniCtx.drawImage(img, 0, 0, w, h); }
  // 구역 전환 출구(문)를 미니맵에도 표시 — 어디로 나가야 다음 구역인지 한눈에 보이게.
  // (이모지 폰트 미지원 환경에서도 항상 똑같이 보이도록 직접 그린 문 아이콘 사용)
  for (const ex of (ZONES[World.zone].exits || [])){
    const pad = 8;
    const cx = Math.max(pad, Math.min(w-pad, (ex.rect.x0 + ex.rect.x1) / 2 * sx));
    const cy = Math.max(pad, Math.min(h-pad, (ex.rect.y0 + ex.rect.y1) / 2 * sy));
    const dw = 7, dh = 9;
    miniCtx.fillStyle = '#c9a24a';
    miniCtx.strokeStyle = '#3a2c1a';
    miniCtx.lineWidth = 1;
    miniCtx.beginPath();
    miniCtx.roundRect(cx - dw/2, cy - dh/2, dw, dh, 1.5);
    miniCtx.fill();
    miniCtx.stroke();
    miniCtx.fillStyle = '#3a2c1a';
    miniCtx.beginPath();
    miniCtx.arc(cx + dw/2 - 2, cy + 1, 0.9, 0, Math.PI*2);
    miniCtx.fill();
  }
  for (const n of NPCS){
    miniCtx.fillStyle = '#c23b3b';
    miniCtx.beginPath();
    miniCtx.arc(n.x*sx, n.y*sy, 4, 0, Math.PI*2);
    miniCtx.fill();
  }
  miniCtx.fillStyle = '#3d84e6';
  miniCtx.strokeStyle = '#ffffff';
  miniCtx.lineWidth = 1.2;
  miniCtx.beginPath();
  miniCtx.arc(World.px*sx, World.py*sy, 5, 0, Math.PI*2);
  miniCtx.fill();
  miniCtx.stroke();
}

function loop(t){
  if (!World.lastT) World.lastT = t;
  const dt = Math.min(0.05, (t - World.lastT) / 1000);
  World.lastT = t; World.update(dt); World.render();
  drawMinimap();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
