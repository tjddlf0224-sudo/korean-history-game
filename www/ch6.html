<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>한국사 게임 - 6화 폭풍 전야</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; overscroll-behavior: none; background: #000; font-family: -apple-system, "Pretendard", "Malgun Gothic", sans-serif; }
  #wrap { position: fixed; top: 0; left: 0; touch-action: none; transform-origin: top left; }
  body.rot #wrap { transform: rotate(90deg) translateY(-100%); }
  #game { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

  #hud { position: absolute; top: calc(10px + env(safe-area-inset-top)); left: calc(12px + env(safe-area-inset-left));
    color: #f5f0e6; font-size: 14px; text-shadow: 0 1px 3px rgba(0,0,0,.8); z-index: 5; }
  #hud .sub { font-size: 11px; opacity: .75; margin-top: 2px; }

  #stick-zone { position: absolute; left: calc(18px + env(safe-area-inset-left)); bottom: calc(18px + env(safe-area-inset-bottom));
    width: 130px; height: 130px; z-index: 6; touch-action: none; }
  #stick-base { position: absolute; inset: 0; border-radius: 50%; background: rgba(255,255,255,0.12); border: 2px solid rgba(255,255,255,0.25); }
  #stick-knob { position: absolute; width: 52px; height: 52px; left: 39px; top: 39px; border-radius: 50%; background: rgba(255,255,255,0.55); transition: transform .05s linear; }

  #act-btn { position: absolute; right: calc(22px + env(safe-area-inset-right)); bottom: calc(34px + env(safe-area-inset-bottom));
    width: 68px; height: 68px; border-radius: 50%; border: none; touch-action: none;
    background: #d9a441; color: #2b1d0e; box-shadow: 0 4px 10px rgba(0,0,0,.4);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none; transition: opacity .15s; z-index: 6; }
  #act-btn.show { opacity: 1; pointer-events: auto; }

  .ov { position: absolute; inset: 0; z-index: 20; display: none; align-items: flex-end; justify-content: center; background: rgba(0,0,0,0.35); }
  .ov.show { display: flex; }
  .ov.center { align-items: center; }
  #intro-overlay { background: #0c0f14; }

  #dlg-panel, #intro-panel {
    width: 100%; max-width: 640px; margin: 0 16px calc(16px + env(safe-area-inset-bottom)); background: #201c26ee; border: 2px solid #6a6a8a;
    border-radius: 14px; padding: 16px 18px; color: #eae6f2; box-shadow: 0 8px 24px rgba(0,0,0,.5);
    max-height: 80%; overflow-y: auto;
  }
  .dlg-top { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .dlg-portrait { width: 44px; height: 44px; border-radius: 50%; background: #4a4560; flex: none; display:flex; align-items:center; justify-content:center; font-size:20px; }
  .dlg-name { font-weight: bold; font-size: 15px; color: #c9b8f0; }
  .dlg-tag { font-size: 11px; opacity: .7; }
  .dlg-box { font-size: 18px; line-height: 1.6; min-height: 54px; white-space: pre-wrap; }
  .dlg-next { text-align: right; margin-top: 10px; font-size: 13px; opacity: .8; cursor: pointer; }
  .dlg-next .arrow { display: inline-block; margin-left: 4px; animation: nudge 1s infinite; }
  @keyframes nudge { 0%,100%{transform:translateX(0);} 50%{transform:translateX(4px);} }

  #intro-panel { max-width: 560px; text-align: center; }
  #intro-text { font-size: 15px; line-height: 1.8; min-height: 90px; white-space: pre-wrap; }
  #intro-next { margin-top: 14px; font-size: 13px; opacity: .8; }

  #fade { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; transition: opacity .6s; z-index: 30; }
  #fade.show { opacity: 1; pointer-events: auto; }

  #end-screen { position: absolute; inset: 0; z-index: 40; display: none; align-items: center; justify-content: center;
    background: #000; color: #c9b8f0; text-align: center; padding: 24px; }
  #end-screen.show { display: flex; }
  #end-screen h2 { font-size: 20px; margin-bottom: 10px; }
  #end-screen p { color: #cfc7de; font-size: 14px; line-height: 1.7; }
  #end-screen a { display: inline-block; margin-top: 22px; color: #0c0f14; background: #c9b8f0; text-decoration: none;
    padding: 10px 22px; border-radius: 999px; font-size: 14px; font-weight: bold; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>

  <div id="hud">
    <div>6화 · 폭풍 전야</div>
    <div class="sub">1589년, 조정 회의장 · 선조</div>
  </div>

  <div id="stick-zone">
    <div id="stick-base"><div id="stick-knob"></div></div>
  </div>
  <button id="act-btn" onclick="Stage.interact()">
    <svg viewBox="0 0 24 24" width="30" height="30" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M4 5.5C4 4.67 4.67 4 5.5 4h13C19.33 4 20 4.67 20 5.5v9c0 .83-.67 1.5-1.5 1.5H9.8l-3.9 3.4c-.5.44-1.27.08-1.27-.58V16h-.13C3.67 16 3 15.33 3 14.5v-9C3 4.67 3.67 4 4.5 4"
        stroke="#2b1d0e" stroke-width="1.6" stroke-linejoin="round" fill="#2b1d0e" fill-opacity="0.06"/>
      <circle cx="8.3" cy="9.8" r="1.15" fill="#2b1d0e"/>
      <circle cx="12" cy="9.8" r="1.15" fill="#2b1d0e"/>
      <circle cx="15.7" cy="9.8" r="1.15" fill="#2b1d0e"/>
    </svg>
  </button>

  <div class="ov center show" id="intro-overlay">
    <div id="intro-panel">
      <div id="intro-text"></div>
      <div id="intro-next">탭하여 계속 ▶</div>
    </div>
  </div>

  <div class="ov" id="dlg-overlay">
    <div id="dlg-panel">
      <div class="dlg-top">
        <div class="dlg-portrait" id="dlg-portrait">👤</div>
        <div>
          <div class="dlg-tag" id="dlg-tag"></div>
          <div class="dlg-name" id="dlg-name"></div>
        </div>
      </div>
      <div class="dlg-box" id="dlg-text"></div>
      <div class="dlg-next" id="dlg-next">계속 <span class="arrow">▶</span></div>
    </div>
  </div>

  <div id="fade"></div>

  <div id="end-screen">
    <div>
      <h2>조선 전기 — 끝</h2>
      <p>200년, 이 나라는 많은 것을 이루었다.<br>새 문자를 만들었고, 법전을 완성했고, 국경을 넓혔다.<br>그리고 그만큼 많은 피를 흘리며 스스로를 시험했다.</p>
      <p style="margin-top:14px;">하지만 바다 저편에서는, 아무도 모르는 사이<br>전혀 다른 이야기가 시작되고 있었다.</p>
      <p style="margin-top:14px; opacity:.75;">1592년. 조선은 아직, 그 함대가 무엇을 의미하는지 알지 못했다.</p>
      <p style="margin-top:18px; opacity:.6;">다음 이야기: 조선 후기 (준비 중)</p>
      <a href="index.html">챕터 목록으로</a>
    </div>
  </div>
</div>

<script>
/* ============ 기본 설정 ============ */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const TS = 40;
const T = { WALL: 0, GROUND: 1, WOOD: 2, STONE: 3 };
const WT = 22, HT = 16;

const wrapEl = document.getElementById('wrap');
/* 모바일 브라우저는 주소창이 늦게 접히거나 펼쳐지면서 innerWidth/innerHeight가
   한 박자 늦게 바뀌는 경우가 있다(특히 iOS Safari). visualViewport가 있으면
   그쪽이 실제 보이는 영역을 더 정확히 반영하므로 우선 사용한다. */
function getViewportSize(){
  if (window.visualViewport) return { w: window.visualViewport.width, h: window.visualViewport.height };
  return { w: window.innerWidth, h: window.innerHeight };
}
function applyOrientation(){
  const { w: iw, h: ih } = getViewportSize();
  const portrait = ih > iw;
  document.body.classList.toggle('rot', portrait);
  const w = portrait ? ih : iw;
  const h = portrait ? iw : ih;
  wrapEl.style.width = w + 'px';
  wrapEl.style.height = h + 'px';
  canvas.width = w;
  canvas.height = h;
}
window.addEventListener('resize', applyOrientation);
window.addEventListener('orientationchange', () => setTimeout(applyOrientation, 80));
if (window.visualViewport){
  window.visualViewport.addEventListener('resize', applyOrientation);
  window.visualViewport.addEventListener('scroll', applyOrientation);
}
// 일부 모바일 브라우저는 주소창이 애니메이션으로 늦게 접혀서, 로드 직후 한 번 더 재확인한다.
setTimeout(applyOrientation, 300);
setTimeout(applyOrientation, 800);
applyOrientation();

/* ============ 맵: 조정 회의장 (붕당을 상징하듯 어둡고 차분한 톤) ============ */
function buildMap(){
  const g = [];
  for (let y = 0; y < HT; y++){ g[y] = new Uint8Array(WT); g[y].fill(T.STONE); }
  for (let x = 0; x < WT; x++){ g[0][x] = T.WALL; g[HT-1][x] = T.WALL; }
  for (let y = 0; y < HT; y++){ g[y][0] = T.WALL; g[y][WT-1] = T.WALL; }
  // 회의장 중앙 목재 단상
  for (let y = 5; y < 10; y++) for (let x = 8; x < 14; x++) g[y][x] = T.WOOD;
  return g;
}
const MAP = buildMap();
function isBarrier(x, y){
  if (x < 0 || y < 0 || x >= WT || y >= HT) return true;
  if (MAP[Math.floor(y)][Math.floor(x)] === T.WALL) return true;
  for (const n of NPCS){ if (Math.round(n.x) === Math.round(x) && Math.round(n.y) === Math.round(y)) return true; }
  return false;
}

/* 사화의 시대(챕터5)보다는 차분하지만, 여전히 채도를 낮춘 톤 — 붕당의 시작이라는
   무거운 분위기를 유지하되 유혈사태였던 5화보다는 살짝 밝혀서 "완충 챕터"임을 표현 */
const TILE_COLOR = { [T.GROUND]: '#7d7a8c', [T.WALL]: '#242030', [T.WOOD]: '#5c4f42', [T.STONE]: '#8f8a9c' };

function hash2(x, y, seed){
  let h = (x*374761393 + y*668265263 + (seed||0)*2246822519) | 0;
  h = (h ^ (h >>> 13)) >>> 0;
  h = Math.imul(h, 1274126177);
  h = (h ^ (h >>> 16)) >>> 0;
  return h / 4294967295;
}
function shadeColor(hex, amt){
  const n = parseInt(hex.slice(1), 16);
  let r = (n>>16)&255, g = (n>>8)&255, b = n&255;
  r = Math.max(0, Math.min(255, r + (amt<0 ? r*amt : (255-r)*amt)));
  g = Math.max(0, Math.min(255, g + (amt<0 ? g*amt : (255-g)*amt)));
  b = Math.max(0, Math.min(255, b + (amt<0 ? b*amt : (255-b)*amt)));
  return `rgb(${r|0},${g|0},${b|0})`;
}
function drawTile(t, tx, ty, px, py){
  const base = TILE_COLOR[t];
  ctx.fillStyle = base;
  ctx.fillRect(px, py, TS+1, TS+1);
  if (t === T.STONE){
    const half = TS/2;
    for (let by=0; by<2; by++) for (let bx=0; bx<2; bx++){
      const n = hash2(tx*2+bx, ty*2+by, 5);
      ctx.fillStyle = shadeColor(base, (n-0.5)*0.18);
      ctx.fillRect(px+bx*half+1, py+by*half+1, half-2, half-2);
    }
    ctx.strokeStyle = 'rgba(0,0,0,.25)'; ctx.lineWidth = 1;
    ctx.strokeRect(px+0.5, py+0.5, TS, TS);
  } else if (t === T.WOOD){
    for (let i=0;i<3;i++){
      const n = hash2(tx*3+i, ty, 6);
      ctx.fillStyle = shadeColor(base, (n-0.5)*0.2);
      ctx.fillRect(px + i*(TS/3), py, TS/3 - 1, TS+1);
    }
  } else if (t === T.WALL){
    ctx.fillStyle = shadeColor(base, -0.1);
    ctx.fillRect(px, py, TS+1, TS+1);
    ctx.fillStyle = 'rgba(0,0,0,.25)';
    ctx.fillRect(px, py, TS+1, 6);
  }
}
function drawMap(camX, camY){
  const x0 = Math.max(0, Math.floor(camX / TS));
  const y0 = Math.max(0, Math.floor(camY / TS));
  const x1 = Math.min(WT, Math.ceil((camX + canvas.width) / TS) + 1);
  const y1 = Math.min(HT, Math.ceil((camY + canvas.height) / TS) + 1);
  for (let y = y0; y < y1; y++){
    for (let x = x0; x < x1; x++){
      drawTile(MAP[y][x], x, y, x*TS - camX, y*TS - camY);
    }
  }
}

/* ============ NPC ============ */
const NPCS = [
  { id: 'yiyi', name: '이이', x: 9, y: 6.5, look: { role: 'scholar', body: '#3a4a6a', accent: '#c9b8f0' } },
  { id: 'yihwang2', name: '이황', x: 12, y: 6.5, look: { role: 'scholar', body: '#4a3a5a', accent: '#c9b8f0' } },
];
const PLAYER_LOOK = { role: 'commoner', body: '#c94f4f', accent: '#e0b94a' };

function drawCharacter(px, py, facing, look){
  const role = (look && look.role) || 'commoner';
  const body = (look && look.body) || '#8a6d3b';
  const accent = (look && look.accent) || '#c9a24a';
  const eo = facing === 'l' ? -2 : facing === 'r' ? 2 : 0;
  ctx.save();
  ctx.translate(px, py);
  ctx.fillStyle = 'rgba(0,0,0,.25)';
  ctx.beginPath(); ctx.ellipse(0, 16, 12, 5, 0, 0, Math.PI*2); ctx.fill();

  if (role === 'scholar'){
    ctx.fillStyle = body;
    ctx.beginPath();
    ctx.moveTo(-5,-8); ctx.lineTo(5,-8); ctx.lineTo(10,14); ctx.lineTo(-10,14); ctx.closePath(); ctx.fill();
    ctx.fillStyle = accent;
    ctx.fillRect(-10,4,20,3);
    ctx.fillStyle = '#f1c79a';
    ctx.beginPath(); ctx.arc(0,-14,10,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#1c1a16';
    ctx.beginPath(); ctx.ellipse(0,-21,8,5,0,Math.PI,0); ctx.fill();
    ctx.fillRect(-8,-22,16,4);
    ctx.fillRect(-14,-19,6,2);
    ctx.fillRect(8,-19,6,2);
  } else {
    ctx.fillStyle = body;
    ctx.fillRect(-9,-6,18,20);
    ctx.strokeStyle = accent; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-9,-6); ctx.lineTo(0,2); ctx.lineTo(9,-6); ctx.stroke();
    ctx.fillStyle = '#f1c79a';
    ctx.beginPath(); ctx.arc(0,-14,10,0,Math.PI*2); ctx.fill();
  }

  ctx.fillStyle = '#2b2015';
  ctx.beginPath(); ctx.arc(eo-3,-14,1.4,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(eo+3,-14,1.4,0,Math.PI*2); ctx.fill();
  ctx.restore();
}

function overlayOpen(){
  return !!document.querySelector('.ov.show') || document.getElementById('end-screen').classList.contains('show');
}

const World = {
  px: 10.5, py: 11, facing: 'u', speed: 3.4,
  stick: { active: false, dx: 0, dy: 0 },
  keys: { l:false, r:false, u:false, d:false },
  paused: false,
  nearNpc: null,
  lastT: 0,

  canStand(x, y){
    const pad = 0.3;
    return !isBarrier(x-pad, y-pad) && !isBarrier(x+pad, y-pad) && !isBarrier(x-pad, y+pad) && !isBarrier(x+pad, y+pad);
  },

  update(dt){
    if (this.paused || overlayOpen()) return;
    let vx = this.stick.dx, vy = this.stick.dy;
    if (this.keys.l) vx -= 1;
    if (this.keys.r) vx += 1;
    if (this.keys.u) vy -= 1;
    if (this.keys.d) vy += 1;
    const len = Math.hypot(vx, vy);
    if (len > 0.05){
      vx /= len; vy /= len;
      if (Math.abs(vx) > Math.abs(vy)) this.facing = vx > 0 ? 'r' : 'l';
      else this.facing = vy > 0 ? 'd' : 'u';
      const nx = this.px + vx * this.speed * dt;
      const ny = this.py + vy * this.speed * dt;
      if (this.canStand(nx, this.py)) this.px = nx;
      if (this.canStand(this.px, ny)) this.py = ny;
    }
    this.checkNpc();
  },

  checkNpc(){
    let found = null, best = 1.7;
    for (const n of NPCS){
      const d = Math.hypot(n.x - this.px, n.y - this.py);
      if (d < best){ best = d; found = n; }
    }
    if (found !== this.nearNpc){
      this.nearNpc = found;
      const btn = document.getElementById('act-btn');
      if (found) btn.classList.add('show'); else btn.classList.remove('show');
    }
  },

  render(){
    const camX = this.px*TS - canvas.width/2;
    const camY = this.py*TS - canvas.height/2;
    ctx.fillStyle = '#242030';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    drawMap(camX, camY);
    for (const n of NPCS){
      drawCharacter(n.x*TS - camX, n.y*TS - camY, 'd', n.look);
      if (n === this.nearNpc){
        ctx.fillStyle = '#c9b8f0';
        ctx.font = '16px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('!', n.x*TS - camX, n.y*TS - camY - 34);
      }
    }
    drawCharacter(this.px*TS - camX, this.py*TS - camY, this.facing, PLAYER_LOOK);
    const vg = ctx.createRadialGradient(canvas.width/2, canvas.height/2, canvas.height*0.3, canvas.width/2, canvas.height/2, canvas.height*0.8);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, 'rgba(0,0,0,.4)');
    ctx.fillStyle = vg;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }
};

(function bindStick(){
  const zone = document.getElementById('stick-zone');
  const knob = document.getElementById('stick-knob');
  let activeId = null, cx = 0, cy = 0;
  const R = 44;
  zone.addEventListener('pointerdown', e=>{
    if (activeId !== null) return;
    activeId = e.pointerId;
    try { zone.setPointerCapture(activeId); } catch(err) {}
    const r = zone.getBoundingClientRect();
    cx = r.left + r.width/2; cy = r.top + r.height/2;
    World.stick.active = true;
    move(e);
  });
  zone.addEventListener('pointermove', move);
  zone.addEventListener('pointerup', end);
  zone.addEventListener('pointercancel', end);
  function move(e){
    if (e.pointerId !== activeId) return;
    let dx = e.clientX - cx, dy = e.clientY - cy;
    const d = Math.hypot(dx, dy);
    if (d > R){ dx = dx/d*R; dy = dy/d*R; }
    knob.style.transform = `translate(${dx}px,${dy}px)`;
    let wx = dx, wy = dy;
    if (document.body.classList.contains('rot')){ wx = dy; wy = -dx; }
    World.stick.dx = wx / R; World.stick.dy = wy / R;
  }
  function end(e){
    if (e.pointerId !== activeId) return;
    activeId = null;
    World.stick.active = false; World.stick.dx = 0; World.stick.dy = 0;
    knob.style.transform = 'translate(0,0)';
  }
})();

window.addEventListener('keydown', e=>{
  if (e.key === ' ' || e.key === 'Enter'){
    e.preventDefault();
    if (document.getElementById('intro-overlay').classList.contains('show')) { introNext(); return; }
    if (document.getElementById('dlg-overlay').classList.contains('show')) { Dialog.next(); return; }
    Stage.interact();
    return;
  }
  if (overlayOpen()) return;
  if (['ArrowLeft','a','A'].includes(e.key)) World.keys.l = true;
  if (['ArrowRight','d','D'].includes(e.key)) World.keys.r = true;
  if (['ArrowUp','w','W'].includes(e.key)) World.keys.u = true;
  if (['ArrowDown','s','S'].includes(e.key)) World.keys.d = true;
});
window.addEventListener('keyup', e=>{
  if (['ArrowLeft','a','A'].includes(e.key)) World.keys.l = false;
  if (['ArrowRight','d','D'].includes(e.key)) World.keys.r = false;
  if (['ArrowUp','w','W'].includes(e.key)) World.keys.u = false;
  if (['ArrowDown','s','S'].includes(e.key)) World.keys.d = false;
});

/* ============ 대화 데이터 (사료 근거: hm_077_0070 정여립 모반, hm_077_0080 동서 붕당 발생.
   아래 대사는 위 사료를 참고해 새로 창작한 것이며 원문을 그대로 옮긴 것이 아님.
   보스전 없는 컷신 중심 에필로그 — 조선 전기 MVP의 엔딩이자 조선후기로 이어지는 티저.) ============ */
const NPC_DATA = {
  yiyi_0: {
    name: '이이', icon: '📖',
    beats: [
      { who:'npc', t:'우리가 그렇게 많은 벗을 잃어가며 지켜온 조정인데… 이제는 우리끼리 다시 갈라서고 있으니, 마음이 무겁습니다.' },
      { who:'npc', t:'심의겸과 김효원, 두 사람의 사소한 다툼에서 시작된 일이 어쩌다 여기까지 왔는지. 이제 사람들은 자신을 동인이다, 서인이다 나누어 부르기 시작했습니다.' },
      { who:'npc', t:'…권력을 다루는 자리에 사람이 모이면, 결국 이런 일이 반복되는 걸지도 모르겠습니다. 다만 이번만큼은, 칼부림 없이 말로 다투는 세상이 되었으면 합니다.' },
    ]
  },
  yiyi_1: {
    name: '이이', icon: '📖',
    beats: [
      { who:'npc', t:'…얼마 전엔 정여립이라는 자가 반역을 꾀했다는 고변이 올라왔습니다. 그 일을 조사하는 과정에서 또 많은 사람이 화를 입었지요.' },
      { who:'npc', t:'동인과 서인의 골은 그 사건을 거치며 더 깊어졌습니다. …자네도 이 조정의 공기가 심상치 않다는 걸 느끼겠지.' },
    ],
    endsChapter: true
  },
  yihwang2_0: {
    name: '이황', icon: '📚',
    beats: [
      { who:'npc', t:'사화의 시절엔 목숨을 걸고 지켜야 할 게 분명했지. 그런데 지금은… 무엇을 두고 다투는지조차 흐릿해질 때가 있네.' },
      { who:'npc', t:'그래도 이이 저 사람처럼, 양쪽 모두를 다독이려는 이가 아직 남아있다는 게 다행이라면 다행일세.' },
    ]
  }
};

const Stage = {
  state: { talkStage: 0 },
  interact(){
    if (document.querySelector('.ov.show')) return;
    const n = World.nearNpc;
    if (!n) return;
    if (n.id === 'yiyi'){
      const key = 'yiyi_' + Math.min(Stage.state.talkStage, 1);
      Dialog.open(key, n);
    } else if (n.id === 'yihwang2'){
      Dialog.open('yihwang2_0', n);
    }
  }
};

const Dialog = {
  key: null, npc: null, idx: 0, data: null,
  open(key, npc){
    this.key = key; this.npc = npc; this.idx = 0;
    this.data = NPC_DATA[key];
    World.paused = true;
    document.getElementById('dlg-overlay').classList.add('show');
    document.getElementById('dlg-name').textContent = this.data.name;
    document.getElementById('dlg-tag').textContent = '1589년 · 조정';
    document.getElementById('dlg-portrait').textContent = this.data.icon;
    this.render();
  },
  render(){
    const beat = this.data.beats[this.idx];
    document.getElementById('dlg-text').textContent = beat.t;
  },
  next(){
    this.idx++;
    if (this.idx >= this.data.beats.length){
      this.finish();
      return;
    }
    this.render();
  },
  finish(){
    document.getElementById('dlg-overlay').classList.remove('show');
    if (this.data.endsChapter){
      Stage.endChapter();
      return;
    }
    World.paused = false;
    if (this.npc.id === 'yiyi'){
      Stage.state.talkStage = Math.min(Stage.state.talkStage + 1, 1);
    }
  }
};
document.getElementById('dlg-panel').addEventListener('click', () => Dialog.next());

/* ============ 모던 인트로 ============ */
const INTRO_LINES = [
  '사림의 시대는 많은 죽음을 치르고서야 조정의 중심에 섰다.',
  '연산군의 폭정도, 을사사화의 피바람도 지나갔다.',
  '이제 조정에는 사림 출신의 신하들이 가득하다 — 그런데 어느 순간부터, 그들 사이에서도 균열이 시작되고 있었다.',
  '동인과 서인. 같은 스승 밑에서 배운 이들이 어느새 서로 다른 편에 서 있다.'
];
let introIdx = 0;
function renderIntro(){
  document.getElementById('intro-text').textContent = INTRO_LINES[introIdx];
}
function introNext(){
  introIdx++;
  if (introIdx >= INTRO_LINES.length){
    const fade = document.getElementById('fade');
    fade.classList.add('show');
    setTimeout(() => {
      document.getElementById('intro-overlay').classList.remove('show');
      fade.classList.remove('show');
    }, 600);
    return;
  }
  renderIntro();
}
document.getElementById('intro-panel').addEventListener('click', introNext);
renderIntro();

Stage.endChapter = function(){
  document.getElementById('end-screen').classList.add('show');
};

function loop(t){
  if (!World.lastT) World.lastT = t;
  const dt = Math.min(0.05, (t - World.lastT) / 1000);
  World.lastT = t;
  World.update(dt);
  World.render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
